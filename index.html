    ["台中市","石岡區","石崗仔","石岡舊稱石崗仔，因上坑溪與下坑溪在此匯流、河流出谷口形似陶缸（硿）而得名。","","石岡地名由來源自當地特殊的河谷地形：上坑溪與下坑溪兩條溪流在石岡區南方匯合，河水流出谷口時因地形收束，形狀神似傳統陶製容器「缸」（閩南語亦寫作「硿」），加上大甲溪河床在此堆積大量石礫，因而得名「石崗仔」，其後簡化為「石岡」。石岡地處大甲溪沖積扇頂端，是台中山城地區重要的水利樞紐：1976年完工的石岡壩，是大甲溪引水灌溉與提供大台中地區民生用水的重要水利設施；1999年921大地震震央即位於石岡附近，石岡壩壩體因斷層錯動而嚴重受損，是當年地震重建的重要地標之一，如今壩區已規劃為地震紀念公園，供後人認識這段天災與水利建設交織的歷史。石岡因客家人口比例較高，也是大台中地區重要的客家文化聚落之一。"],
    ["台中市","東勢區","東勢角","東勢舊稱東勢角，客家話「勢角」意指某一方向的角落，因位於台中盆地東側山區的一個角落而得名。","","東勢地名由來源自客家語彙對地理方位的獨特表達方式：客家話中「勢角」一詞，意指某一個方向的角落地帶，東勢地處台中盆地東側、緊鄰大甲溪與雪山山脈餘脈交界的丘陵地帶，客籍移民依其相對於盆地的方位，將此地稱為「東勢角」，日治時期簡化為「東勢」，沿用至今。東勢清代原是平埔族巴宰族「樸仔籬社」的傳統領域，因地處漢人與泰雅族交界前緣，是重要的樟腦、木材集散地，客家移民大量湧入後，逐漸發展成大甲溪上游山城地帶的商業重鎮，境內至今仍保留完整的東勢老街與客家伙房建築群。東勢因氣候溫和、日夜溫差大，是台灣重要的高接梨（東勢高接梨）產地，享有「水果之鄉」美譽，每年舉辦的「東勢客家歌謠比賽」與采風節，也是地方重要的客家文化推廣活動。"],
    ["台中市","和平區","和平","和平區清代至日治時期屬不設街庄界的高山原住民地帶，戰後取「四維八德」中的「和平」二字為區名。","","和平區是台中市面積最大、唯一的山地原住民區，境內大部分為雪山山脈與中央山脈北段的高山地帶，是泰雅族傳統領域。這片山區在清代及日治時期，長期被劃為不設一般街庄行政界線的「高山地帶」，直接由理蕃機構或警察系統管轄，未如平地聚落般擁有正式的漢語地名。戰後，國民政府在此設立山地鄉行政區時，取「四維八德」傳統道德教條中的「和平」二字作為鄉名，賦予這片曾經是原漢衝突前緣地帶的山區一個充滿期許的嶄新名稱，2010年台中縣市合併升格直轄市後，改制為和平區，沿用至今。和平區境內因海拔落差大，蘊藏豐富的溫泉、高山蔬果與林業資源，谷關溫泉、梨山果園、大甲溪上游的松鶴、環山部落等地，都是境內著名的觀光與泰雅族部落所在地。"],
    ["台中市","新社區","新社仔","新社原稱新社仔，因平埔族巴宰族山頂社人受漢人拓墾壓力所迫，向東遷移至此另建新聚落而得名。","","新社地名由來與一段平埔族被迫遷徙的歷史密切相關：清代中葉以前，巴宰族朴仔籬社群原分布於豐原、東勢、石岡一帶，隨著漢人拓墾勢力不斷向山區推進，其中一支「山頂社」（Santonton）族人被迫離開原居地，向東遷移至今日新社一帶另建聚落，這處新建立的小型聚落因而被稱為「新社仔」，簡化後成為今日的「新社」地名，未待這些族人遷入埔里盆地之前，新社便是他們暫居的過渡之地。新社區因地處大甲溪河階台地，海拔約400至700公尺，日夜溫差大、雲霧繚繞，氣候條件類似高山茶區，發展出獨具特色的新社高接梨、香菇與莊園式葡萄酒產業，境內的「新社古堡」歐式莊園與「花海節」更是台中市熱門的觀光景點，讓這個因平埔族遷徙而得名的山城，轉型為結合農業與休閒觀光的知名景區。"],
    ["台中市","潭子區","潭仔墘","潭子舊稱潭仔墘，因聚落建於柳川上游凹岸深水處旁，閩南語稱深水處為「潭」、水邊為「墘」而得名。","","潭子地名由來源自當地的河川地形：柳川（舊稱邱厝仔溪）上游流經此地時，因河道彎曲形成凹岸侵蝕坡，水流在此處匯聚成較深的水潭，閩南語稱溪流中的深水處為「潭」，水邊際緣則稱「墘」，這處建於深水潭岸邊的聚落，因而得名「潭仔墘」，1920年簡化為「潭子」，沿用至今。潭子區清代原是平埔族巴宰族「阿里史社」的傳統領域，境內石牌公園內保存的「禁示碑」，見證了清代官府調解漢人與阿里史社土地糾紛的歷史；1731年「大甲西社事件」爆發後，阿里史社等十餘個平埔族社群曾聯合圍攻彰化縣城，是清代台灣中部平埔族群反抗漢人拓墾壓迫的重要歷史事件之一。如今潭子區因鄰近豐原、台中市區，加上潭子加工出口區的設立，已從清代平埔族聚落，發展成台中市重要的工商業與住宅衛星市鎮。"],
    ["台中市","大雅區","壩仔","大雅原稱壩仔，源自平埔族巴宰族岸裡社群「阿河巴」荒埔之意，客家話稱河邊草埔為「壩仔」，與台語「埔仔」同義。","","大雅地名由來源自平埔族語與客家拓墾用語的結合：這一帶清代原是巴宰族岸裡社群所屬「阿河巴」（或稱阿河壩）荒埔，是尚未開墾、水源尚稱豐沛的河濱草埔地。漢人（尤其是客籍移民）進墾後，依平埔族原有的「阿河巴」稱呼，並套用客家話中稱呼河壩草埔為「壩仔」的用語（與台語「埔仔」意義相通），將此地簡稱為「壩仔」。1920年，日本殖民政府推行地方行政改制，將「壩仔」改以較為典雅的近音字「大雅」取代，沿用至今，這種因追求文雅而選字、卻與地名原始語意（河邊荒埔）幾乎無關的更名方式，在台灣地名史上並不少見。大雅區因大甲溪沖積扇地形，土壤肥沃、氣候適宜，是全台最大的小麥產區，享有「小麥的故鄉」美譽，也是台中市重要的花卉與蔬果專業區。"],
    ["台中市","神岡區","新廣","神岡舊稱新廣，因最初移民多來自廣東嘉應州「神岡社」而得名，另有一說與道光年間分類械鬥時神明庇護傳說有關。","","神岡地名由來流傳著幾種說法：第一種說法指出，最初移入這片墾地的移民，大多來自廣東省嘉應州鎮平縣一處名為「神岡社」的原鄉聚落，因而依原鄉地名稱此地為「神岡」，《彰化縣志》則以諧音記載為「新廣莊」，這種依原鄉地名為新墾地命名的方式，在客家移民拓墾史上相當常見；另一種在地流傳的說法則認為，道光年間台灣分類械鬥頻仍之際，神岡路上的八仙寺曾因李仙祖神明指示族人聚集於此便能保平安，靈驗的庇護傳說（「神講」）以諧音轉化為「神岡」地名。1920年，日本殖民政府推行地方行政改制，正式將「新廣」改稱「神岡」，沿用至今。神岡境內的岸裡社，清代曾是巴宰族岸裡社群的核心聚落，也是清廷推行「以番制番」政策、借重岸裡社武力平定多次民變的重要據點。"],
    ["台中市","大肚區","大肚","大肚地名源自平埔族拍瀑拉族大肚社，清代這一帶更曾是統轄中部十餘社群的「大肚王國」核心領域。","","大肚地名源自平埔族拍瀑拉族「大肚社」的社名。更令人驚訝的是，早在荷蘭統治時期的文獻記載中，大肚一帶其實是一個跨部落政治實體「大肚王國」的核心領域：這個王國統治期間約自16世紀中葉延續至1732年，轄下涵蓋拍瀑拉、巴則海、道卡斯、洪雅、巴布薩等不同語族共十九至二十個部落，1722年巡臺御史黃叔璥的《臺海使槎錄》甚至記載「大肚山形，遠望如百雉高城，昔有番長名大眉」，印證了17世紀台灣中部確實存在一個具有相當規模的原住民政治組織。1731年，因清廷官員濫殺前來協助運糧的大肚社「良番」，引爆大肚社聯合沙轆社、牛罵頭社等十餘社群圍攻彰化縣城的武裝抗爭事件，史稱「大甲西社事件」，事件平定後大肚王國的勢力也隨之瓦解，其後裔多遷往埔里盆地定居。如今大肚區境內的磺溪書院，是台中僅存少數保存完整的清代書院建築之一。"],
    ["台中市","沙鹿區","沙轆","沙鹿舊稱沙轆，源自平埔族拍瀑拉族沙轆社社名，1731年大甲西社事件後遭清廷強迫更名遷善社，1920年改稱沙鹿。","","沙鹿地名源自平埔族拍瀑拉族「沙轆社」（Salach）的社名，該社世居於大肚山西麓的沙鹿平原，是拍瀑拉族四大社群之一。1731年（雍正9年）「大甲西社事件」爆發，沙轆社加入反抗清廷的行列，隔年遭到官兵血腥鎮壓，幾乎慘遭滅族，清廷平定亂事後，為表達「懲戒與教化」之意，強迫將沙轆社改名為「遷善社」，與同時期被改名的大甲西社「德化社」、牛罵社「感恩社」、貓盂社「興隆社」，都帶有清廷刻意羞辱、施加政治教化色彩的意味，是清代原住民政策中相當黑暗的一頁。事件過後，沙轆社元氣大傷，土地逐漸被閩粵移民以租、買等方式取得，族人或遠徙、或逐漸漢化融入。1920年，日本殖民政府推行地方行政改制，將「沙轆」正式改稱「沙鹿」，沿用至今，如今沙鹿因臺中港開發帶動，已從拍瀑拉族傳統領域轉型為工商業重鎮。"],
    ["台中市","龍井區","龍目井","龍井原稱龍目井，源自大肚台地西麓斷層線上一處湧泉，因井旁兩塊石頭狀似龍的雙眼而得名。","","龍井地名源自一處真實存在的天然湧泉：大肚台地西麓的斷層線上，地下水源豐沛，形成一處終年湧流不絕的泉井，清代文人郁永河在其著作《裨海紀遊》中記載：「龍目井，……旁有兩石，狀若龍目，故名」，直接說明了因井旁兩塊石頭形似龍的雙眼，因而得名「龍目井」，是清代台灣中部拓墾史上相當知名的一處水源地標。這處湧泉在清代是當地重要的灌溉水源，也是漢人選擇在此定居拓墾的關鍵因素之一。1920年，日本殖民政府推行地方行政改制，將「龍目井」簡化為「龍井」，沿用至今。龍井區清代原是平埔族拍瀑拉族「水裡社」的傳統領域，如今因台中港特定區與台中彩虹眷村等景點，已從清代單純依賴湧泉灌溉的農業聚落，發展成兼具工業區與觀光景點的行政區。"],
    ["台中市","梧棲區","五汊港","梧棲舊稱五汊港，因牛罵頭溪出海口分為五條扇狀水道分流而得名，後取諧音雅字改稱梧棲港。","","梧棲地名由來源自河口三角洲的水文地形：牛罵頭溪（今清水地區溪流）流至出海口附近時，因泥沙沖積形成小型三角洲，河道在此分歧為五條扇狀分流的水汊，因而得名「五汊港」，《彰化縣志》中則寫作「五叉港」。其後，先民取「五汊」的諧音，選用較為典雅的「梧棲」二字取代，這種因追求字面優雅、而以同音或諧音字取代原本地形描述用字的命名方式，在台灣地名演變中相當常見。梧棲另有一別稱「鰲西」，因地處鰲峰山（即今清水牛罵頭山）之西側而得名。梧棲因位處大甲溪與大肚溪之間的海岸線中段，清代已是重要的漁港與貨物吞吐口，日治及戰後時期，隨著台中港（原稱台中商港）於梧棲外海興建完工，梧棲從傳統的河口小漁港，躍升為中台灣最重要的國際商港門戶，也是全台知名的漁獲直銷與海鮮餐飲聚落。"],
    ["台中市","清水區","牛罵頭","清水舊稱牛罵頭，源自平埔族拍瀑拉族牛罵社社名，1920年因當地「埤仔口泉」水質清澈而改稱清水。","","清水舊稱「牛罵頭」，源自平埔族拍瀑拉族「牛罵社」（Gomach）的社名音譯，是拍瀑拉族四大社群中最北的一支，1731年大甲西社事件後，牛罵社同樣遭清廷強迫改名為「感恩社」，以示教化之意。1920年，日本殖民政府推行地方行政改制，考量牛罵頭街上有一處名為「埤仔口泉」的湧泉，泉水終年清澈甘美，因而以「清水」二字取代原本的「牛罵頭」，是台灣少數因當地水質特色而更名、且沿用至今廣為人知的地名案例。清水地區因大甲溪沖積扇與清水隆起海岸平原地形，自古便是重要的農業與航運據點，境內牛罵頭遺址是台灣中部重要的史前文化遺跡，見證此地數千年來的人類活動歷史；清水鰲峰山、高美濕地與清水眷村文化園區，也讓這座因清澈泉水得名的海線市鎮，兼具生態、歷史與文化觀光的多重魅力。"],
    ["台中市","大甲區","大甲","大甲地名源自平埔族道卡斯族聚落，「道卡斯」（Taokas）一詞的學術族名，甚至反過來是因發音近似「大甲」而得名。","","大甲與台灣其他多數「因原住民社名而得漢語地名」的案例不同，兩者的命名關係其實是雙向的：大甲地區清代是道卡斯族的主要活動範圍，涵蓋大甲東社、大甲西社、日南社、雙寮社等聚落，漢人依當地原住民自稱的音譯，將此地稱為「大甲」；然而，1904年日本學者伊能嘉矩為這群分布於新竹、苗栗、台中沿海一帶的平埔族群，以語言學方法歸類命名時，卻是因「道卡斯」（Taokas）一詞的閩南語發音類似「大甲」，才反過來將這個族群正式命名為「道卡斯族」，這種地名與族名相互影響、甚至倒果為因的命名過程，是台灣地名史上相當特殊的案例。1731年「大甲西社事件」（林武力抗清事件）爆發，是清代台灣中部平埔族群規模最大的武裝反抗行動之一，事件平定後，大甲西社遭清廷改名為「德化社」。大甲如今以媽祖遶境進香、奶油酥餅與藺草編織聞名全台，是台灣海線最具代表性的信仰與物產重鎮。"],
    ["台中市","外埔區","外埔","外埔因位處內埔（今后里）外側的埔地而得名，是道卡斯族大甲東社的傳統領域。","","外埔地名由來相對單純，源自其與鄰近聚落的相對地理位置：清代漢人拓墾勢力由海岸線一帶（近海處，俗稱「外」）向東側內陸擴展時，將位於「內埔」（今后里區，因地處聚落內側而得名）之外的這片埔地，稱為「外埔」，以區別兩處拓墾範圍的先後與相對位置，這種依內外方位對應命名的方式，與台北「內湖」對應「外湖」等地名，屬於相似的邏輯。外埔原是平埔族道卡斯族「大甲東社」的傳統領域，蓬山八社中的大甲東、大甲西兩社，便是以境內的鐵砧山為界劃分，鐵砧山以東屬大甲東社，因該社在1731年大甲西社事件中選擇配合清廷而未遭波及，得以保留原有社名，未如大甲西社般被強迫改稱。外埔區因地勢平坦、水源充足，是台中市重要的水稻與葡萄產區，境內鐵砧山風景區因鄭成功「劍井」傳說而聞名，是台中海線地區重要的歷史與農業觀光景點。"],
    ["台中市","大安區","海翁窟港","大安在明末稱海翁窟港，因港灣時有鯨魚（海翁）出沒而得名，另有一稱勞施港，形容航道迂迴如螺殼紋路。","","大安舊稱由來相當富有畫面感：明末文獻記載，這處港灣因時常有鯨魚（閩南語稱鯨魚為「海翁」）洄游出沒，因而得名「海翁窟港」；另有一稱「勞施港」（又寫作螺絲港），形容船隻進出這處港灣時，航道必須迂迴繞轉兩處沙嘴，路徑彎曲有如螺殼上的螺旋紋路，1764年（乾隆29年）《續修臺灣府志》中即已記載「勞施港」之名。這片海岸沙洲地帶因地勢低平、緊鄰海岸，先民依方位稱之為「海墘」（意指海邊），也是大安地名演變過程中曾出現的另一種稱呼。大安因大安溪出海口的優良港灣條件，清代曾是中部重要的貿易港口之一，1841年鴉片戰爭期間，英國商船「阿吶號」在此觸礁擱淺，遭岸上民勇圍攻俘虜，史稱「大安之役」，是清代台灣少見與西方列強直接軍事衝突的歷史事件之一。如今大安以濱海樂園、西瓜產業與大安漁港聞名，是台中海線最北端的行政區。"],
    ["台中市","梨山","斯拉茂","梨山舊稱斯拉茂（Slamaw），是泰雅族先祖翻越雪山山脈北遷擴散的重要據點，因日治後引進溫帶水果種植而改稱梨山。","","梨山地名源自泰雅族語「Slamaw」（日治時期日文寫作「サラマオ」，音譯為斯拉茂、薩拉矛或沙拉茅），是大甲溪上游流域重要的泰雅族傳統聚落。根據泰雅族口傳歷史，族人祖先自更南方的原居地沿北港溪上游向北翻越分水嶺遷徙擴散，在大甲溪谷尾端與蘭陽溪分水嶺的思源埡口一帶，Pinsbkan家族衍生出向北、向東、向東北遷徙的三大支系，斯拉茂正是這波遷徙擴散過程中位於大甲溪上游流域的重要據點之一，與松茂、佳陽、環山（志佳陽）等地並稱「斯拉茂群」（或薩拉茅群）。1956年中橫公路動工興建後，這處高山地區因氣候冷涼、日夜溫差大，特別適合溫帶水果生長，政府引進蘋果、水梨等果樹試種成功後，便將這片山區改稱「梨山」，取代了原本的泰雅族地名，如今梨山已是台灣最知名的高山水果與茶葉產區之一，也是中橫公路最重要的中繼站。"],
    ["台中市","谷關","明治溫泉","谷關因1960年中部橫貫公路通車，行經此地的溪谷有如一道天然關卡而得名，日治時期曾稱明治溫泉。","","谷關舊稱「明治溫泉」，因1907年當地泰雅族人發現溫泉露頭，直到1927年才由台中州政府撥款、配合民眾捐獻興建公共浴場正式開發，並依日本明治天皇年號命名，且依海拔高低分為上明治（今上谷關）、下明治（今下谷關）。1956年，政府為貫通台灣東西兩岸，選定大甲溪河谷路線動工興建中部橫貫公路，谷關正位於這條路線的重要節點；由於中橫公路行經此地的谷口地形險要，山岩崢嶸矗立，兩側高山夾峙，形如一道天然關卡，因而在1960年5月中橫公路通車典禮時，正式將此地命名為「谷關」，取代了日治時期的「明治」舊稱。谷關溫泉屬弱鹼性碳酸泉，泉質清澈無硫磺味，相傳日本明治天皇曾泡湯後得子，因而衍生出「生男湯」的民間傳說。如今谷關因溫泉觀光與谷關、捎來等歷史吊橋景觀，是中部橫貫公路沿線最重要的溫泉度假勝地。"],
    ["台中市","逢甲","逢甲","逢甲因鄰近私立逢甲大學而得名，該校為紀念清末抗日保台的愛國詩人丘逢甲而命名，逢甲商圈已是全台知名夜市。","","逢甲地區的地名由來，與一位清末抗日愛國詩人密切相關：丘逢甲是清光緒年間的進士，1895年馬關條約割讓台灣後，他曾號召台灣仕紳成立「台灣民主國」，力主抗日保台，雖然行動最終失敗，仍留下「宰相有權能割地，孤臣無力可回天」等膾炙人口的詩句，被後世視為台灣近代史上重要的愛國象徵人物。1961年，一群有志之士在西屯區籌辦私立學校時，為紀念丘逢甲的愛國精神，將學校命名為「逢甲工商學院」（今逢甲大學），校址周邊的地區也因此逐漸以「逢甲」作為通稱，取代了原本的行政區劃地名。隨著逢甲大學師生人數增加，加上鄰近文華夜市（今逢甲夜市）的興起，逢甲商圈迅速發展成全台規模數一數二、以小吃聞名的觀光夜市，每年吸引大量國內外遊客造訪，讓「逢甲」從單純紀念歷史人物的校名，演變成台中市最具代表性的商業與觀光地標之一。"],
    ["台中市","高美","高密","高美舊稱高密，因清代此地聚落地勢較高、林木茂密而得名，日治後改為較文雅的「高美」，境內高美濕地聞名全台。","","高美地名由來相對單純，清代這一帶因地勢略高、林木植被茂密，先民依此地形特徵稱之為「高密」。1920年，日本殖民政府推行地方行政改制，考量「高密」二字字面略顯粗獷，遂取其諧音、改以較為典雅美觀的「高美」取代，沿用至今，這種單純因字面美感考量而更改用字、卻與原始地形意涵幾乎無關的命名調整，在台灣地名演變史上相當常見。高美地處清水區大甲溪出海口南側，因地勢平坦、潮間帶廣闊，加上台中港防波堤興建後改變了當地的水文與泥沙沉積條件，意外形成一片面積廣達1500公頃的高美濕地，是台灣少數幾處大規模雁鴨集體棲息與繁殖地之一，園區內特有的雲林莞草生態、風力發電風車林立的景觀，加上夕陽美景，讓高美濕地成為台中市近年最熱門的生態旅遊景點之一，也讓這個原本描述地形的舊地名，因濕地生態保育而重新聲名大噪。"],
    ["台中市","成功","成功嶺","成功因鄰近成功嶺（大專院校集訓中心）而得名，取「精誠團結、邁向成功」的訓練期許之意。","","成功地區的地名由來，與戰後台灣大專院校學生軍事訓練的歷史密切相關：這一帶原是台中盆地南側的丘陵台地，戰後政府在此設立軍事訓練基地，做為大專院校學生接受入伍前基礎軍事訓練（俗稱「成功嶺集訓」）的重要場所，數十年來一屆又一屆的青年學子在此接受磨練，「上成功嶺」一度成為台灣男性青年成長過程中共同的重要記憶，訓練基地便以寄託「邁向成功」期許的「成功嶺」為名。隨著這座訓練基地的知名度不斷提升，周邊地區也逐漸以「成功」作為通稱，甚至超越了原本行政區劃上的地名。如今成功嶺仍是國軍重要的教育訓練基地之一，雖然大專集訓的規模已不若從前，但「成功嶺」這個充滿時代記憶與勵志意涵的地名，至今仍深植於許多台灣民眾的共同記憶之中。"],
    ["台中市","追分","追分","追分因日治時期海線、山線鐵路在此交會分岔而得名，「追分」為日語詞彙，意指道路的分歧點。","","追分地名直接借用自日語詞彙：「追分」（おいわけ，Oiwake）在日語中原意指道路或鐵道的分歧點，日本本土本就有多處同名地名。1920年，台灣總督府鐵道部完成縱貫線海線鐵路的興建，這條新闢的海線鐵路與原本的山線鐵路，恰好在今日烏日、大肚交界處會合分岔，鐵道部便依日語「分歧點」的詞彙，將這處新設車站命名為「追分驛」，戰後沿用為「追分車站」，並成為周邊地區的通稱地名。追分車站至今仍保留日治時期興建的木造站房，是台灣少數保存完整的日治小型車站建築之一；因「追分」與「永保安康」（大甲車站舊稱「日南」的諧音）等鐵路車站名稱，被鐵道迷賦予「追分（永不）分手、永保安康」的祝福意涵，追分車站的車票因而成為情侶間熱門的紀念小物，讓這個原本單純描述鐵道地形的日語地名，意外演變成充滿浪漫寓意的觀光話題。"],
    ["台中市","日南","日南社","日南因源自平埔族道卡斯族蓬山八社之一的「日南社」而得名，境內日南車站因與「永保安康」車票組合聞名。","","日南地名源自平埔族道卡斯族「日南社」的社名，是清代「蓬山八社」（原稱崩山八社）之一，與大甲東社、大甲西社、雙寮社等同屬蓬山地區平埔族部落聯盟成員，主要分布於今日大甲、大安一帶。日治時期，縱貫鐵路海線通車後，在日南社傳統領域範圍內設立「日南驛」，戰後沿用為日南車站。日南車站因與另一座知名車站「追分」搭配，衍生出「日南（永保）安康、追分（永不）分手」的祝福諧音組合，兩地車票因而成為台灣鐵道迷與情侶間熱門的紀念小物，帶動一波車站觀光風潮，讓這個源自平埔族社名的百年小站，意外因鐵道文化而重新受到矚目。日南車站至今仍保留日治時期興建的木造站房建築，是海線鐵路沿線珍貴的歷史車站之一。"],
    ["台中市","泰安","大安","台中泰安舊站原稱大安，因位於大安溪畔而得名，1954年為與苗栗泰安鄉同名而不便，改稱「泰安」，如今舊站已轉型為鐵道文化園區。","","台中后里的泰安車站，其地名演變與苗栗縣泰安鄉頗有淵源：這座位於山線鐵路上的車站，因鄰近大安溪畔，最初命名為「大安驛」，然而由於台中州（今台中縣市）與新竹州（今苗栗縣）境內，皆有以「大安」為名的行政區或車站，容易造成混淆，1954年遂比照苗栗大安鄉改名為泰安鄉的邏輯，將車站正式改稱「泰安車站」，取「國泰民安」的吉祥寓意，同時也巧妙保留了「大安」的諧音。1998年，隨著山線鐵路截彎取直、新泰安車站啟用，這座興建於1908年、擁有超過百年歷史的舊泰安車站因而功成身退，卻幸運地未遭拆除，反而因保存完整的檜木站房建築與周邊鐵道遺跡，被指定為台中市歷史建築，並轉型為「泰安鐵道文化園區」，成為鐵道迷與遊客造訪山城時，認識台灣鐵道發展史的重要景點。"],

    // --- 【彰化縣】 ---
    ["彰化縣","彰化市","半線","彰化市舊稱半線，源自平埔族巴布薩族「半線社」譯音，清雍正元年設縣時取「彰顯皇化」之意改稱彰化。","","彰化市舊稱「半線」，源自平埔族巴布薩族「半線社」的社名音譯，該社原居於今彰化市光南里一帶，是清代彰化平原十個平埔族社之一。雍正元年（1723年），清廷鑑於半線一帶開發日盛、人口漸增，遂在此地另設新縣，福建巡撫王紹蘭於〈彰化縣碑記〉中寫下「實獲眾心、保域保民、彰聖天子、丕昌海隅之化歟」，取其中「彰」「化」二字，寓意「彰顯皇化」，正式定名為彰化縣，縣治便設於半線。值得一提的是，彰化在地文史工作者曾考證指出，清代文獻中「半線社」與「半線莊」「半線街」實為不同層級的聚落單位，不應混為一談，甚至主張彰化市真正的舊稱應是「磺溪」（因大肚溪支流磺溪流經而得名），而非籠統地稱為半線，顯示地方史考據仍存在不同觀點。彰化市因八卦山大佛而聞名全台，是中台灣重要的信仰與交通樞紐。"],
    ["彰化縣","鹿港鎮","鹿仔港","鹿港舊稱鹿仔港，因清代此地曾是鹿群聚集的港灣，也是重要的稻米集散地而得名，清中葉曾為僅次台南的全台第二大港市。","","鹿港舊稱「鹿仔港」，地名由來流傳多種說法：一說荷蘭時期到清領初期，台灣西部平原鹿群遍布，海口草埔常有鹿群聚集，因而得名；一說源自當地平埔族巴布薩族「Rokau-an社」的閩南語音譯轉化；一說因港灣地形彎曲，形狀似鹿角而得名；另一說則指清雍正6年（1728年）彰化縣在鹿仔港米市街設立方形穀倉，方形倉庫稱為「鹿」，故以此命名，鹿港米市街的存在也印證了此地確實是重要稻米集散地。學者莊展鵬考證後，認為「鹿群聚集說」較為可信。鹿港憑藉優良的港灣條件，清乾隆49年（1784年）與福建蚶江對渡通商後，商業迅速興盛，與台南府城、台北艋舺並列「一府二鹿三艋舺」，是清中葉台灣第二大港市，天后宮、龍山寺、鹿港老街等古蹟至今仍完整保留這段全盛時期的歷史風貌。"],
    ["彰化縣","和美鎮","卡里善","和美原稱卡里善，源自巴布薩族語「冷熱交界地」，因漳泉械鬥頻繁，民國9年取「和睦美鄰」之意改稱和美。","","和美舊稱「卡里善」（也寫作朥狸散），源自平埔族巴布薩族語，意指「冷與熱的交界地」，反映當地氣候溫和宜人的特徵，此後因發音相近，又演變出「和美線」「和美散」等不同寫法。和美地處泉州移民與漳州移民拓墾範圍的接觸地帶，以境內詔安橋為界，橋西是泉州移民墾地，橋東則是來自彰化的漳州移民墾地，兩籍移民雜處而居，清代分類械鬥頻仍、衝突不斷。民國9年（1920年），日本殖民政府推行地方行政改制，鑑於此地長期作為漳泉械鬥的衝突地帶，特別取「和睦美鄰」之意，將「和美線」正式改稱「和美」，期望藉由地名寄託化解族群衝突、促進和睦相處的願景，是台灣地名中少數直接以「族群和解」為命名初衷的案例。和美如今是彰化縣重要的紡織與針織工業重鎮，享有「和美織仔」的美稱。"],
    ["彰化縣","線西鄉","下見口","線西舊稱下見口，因聚落位於四股圳入海口，可望見河口而得名，1920年因隸屬線西堡而改稱線西。","","線西鄉舊稱「下見口」，也寫作「下徑口」，這個地名描述了當地的地理位置特徵：聚落坐落在四股圳注入台灣海峽的出海口附近，站在此處可以望見河海交會的水口，因而得名「見口」，加上「下」字表示地勢較低或位置偏下游之意。1920年，日本殖民政府推行地方行政改制，因這一帶清代隸屬「線西堡」的行政區劃範圍，遂直接沿用堡名，將「下見口」改稱為「線西」，這種以清代堡里舊名取代原本聚落俗稱的命名方式，在台灣地名演變中相當常見。線西鄉地處彰化縣濱海地帶，因地勢平坦、鄰近福馬圳等水利設施，加上近年推廣的哈密瓜與蔬果種植，是彰化縣重要的沿海農業鄉鎮之一，境內的臭青龜仔（哈利波特風車）觀光工廠等特色景點，也讓這個描述河口地形的舊地名，逐漸發展出濱海觀光的新面貌。"],
    ["彰化縣","伸港鄉","新港","伸港原稱新港，因是新闢的港口而得名，1959年因與嘉義縣新港鄉同名而改稱伸港。","","伸港鄉地名由來相對單純，清代這一帶因新開闢一處港口，便直接以「新港」為名，意指新設立的港埠。然而，台灣行政區劃中另有嘉義縣「新港鄉」同樣以「新港」為名，兩地容易在行政公文、郵政系統上造成混淆，民國48年（1959年）7月1日，彰化的新港鄉正式更名為「伸港鄉」，以「伸」字近音替代「新」字，同時避開重名問題，這與苗栗西湖鄉（原四湖鄉，因與雲林四湖鄉同名而改名）、台中后里（原內埔鄉，因與屏東內埔鄉同名而改名）屬於同一類因行政區重名而更改地名的特殊案例。伸港鄉地處彰化縣最北端濱海地帶，鄰近台中大肚溪出海口，境內慶安水道自然生態中心（俗稱白色海豚屋）與伸港濕地是熱門的生態旅遊景點，也讓這個因新闢港口得名、又因撞名而改名的鄉鎮，發展出獨具特色的濕地生態觀光資源。"],
    ["彰化縣","福興鄉","福興","福興因福建移民期許在此振興事業、建莊興隆而得名。","","福興鄉地名由來直接寄託了先民的拓墾期許：清代福建移民渡海來到這片土地開墾定居時，希望能在異鄉振興家業、發展興隆，因而以「福興」為莊名，「福」代表原鄉福建，也有福氣之意，「興」則寄託事業興旺的願景，是台灣地名中相當常見的一種吉祥式命名方式。福興鄉地處鹿港鎮南側，清代因鄰近鹿港港口，同樣受惠於鹿港作為清中葉台灣第二大港的貿易繁榮，加上濁水溪沖積形成的肥沃平原，農業發展條件優異。福興鄉境內的番社村，地名則源自當地平埔族馬芝遴社的傳統領域，顯示這一帶在漢人大規模拓墾之前，同樣是平埔族巴布薩族的生活範圍。如今福興鄉因地勢平坦、水源充足，是彰化縣重要的稻米與甘藷產地之一。"],
    ["彰化縣","秀水鄉","臭水","秀水原稱臭水，因地處灌溉水路末端、排水不佳而積水發臭，後取諧音雅字改稱秀水。","","秀水鄉地名由來反映了先民對地形排水問題的直白描述：清代這一帶正好位於整片灌溉水系的末端，來自上游各處的餘水匯聚於此，由於地勢低平、排水不易，長期積水導致水質混濁發臭，因而被稱為「臭水」，這種依水質狀況直接命名的方式雖不甚雅觀，卻真實反映了早期農業聚落面臨的排水困境。隨著行政區劃調整與地名雅化的趨勢，「臭水」後來改以發音相近、字義優美的「秀水」取代，徹底扭轉了原本不甚討喜的地名印象。秀水鄉地處彰化平原核心地帶，因濁水溪沖積帶來的肥沃土壤，加上灌溉水利設施逐漸完善，早已從昔日排水不良的積水之地，轉型為彰化縣重要的花卉與蔬果專業區，境內的彰化花卉generation生產專區更是全台知名的花卉批發集散地之一。"],
    ["彰化縣","花壇鄉","茄苳腳","花壇原稱茄苳腳，因早期此地茄苳樹茂生成林，經移民砍伐開墾成耕地建莊而得名。","","花壇鄉舊稱「茄苳腳」，這個地名直接反映了當地早期的自然植被景觀：清代移民初入墾此地時，發現一帶茄苳樹生長茂密、成林遍布，先民便著手砍伐林木、開墾為可耕作的農地，並在這片曾經林木茂盛之處建立聚落，因而以「茄苳腳」為莊名，意指茄苳樹林下方或周邊的聚落。1920年，日本殖民政府推行地方行政改制，將「茄苳腳」改以較為典雅的「花壇」取代，沿用至今。花壇鄉地處八卦山台地西側山麓，因地勢略高、排水良好，加上氣候條件適宜，是台灣重要的花卉與盆景苗木專業產區，尤其以杜鵑花、七里香等園藝植物聞名，花壇之名雖非源自花卉產業，卻恰好與今日的花卉重鎮形象不謀而合，成為地名巧合呼應在地特色的有趣案例。"],
    ["彰化縣","芬園鄉","芬園新莊","芬園原稱芬園新莊，相傳因清代在此廣植菸草（芬）而得名。","","芬園鄉舊稱「芬園新莊」，關於「芬園」二字的由來，民間相傳與清代在此廣泛種植菸草有關：早期移民入墾這片新開闢的莊園時，大量栽植菸草作為經濟作物，「芬」字或許取自菸草特有的氣味或菸園之意，「園」則指旱地作物栽培的田園，兩字合稱反映了當地曾以菸草種植為主要產業的拓墾歷史。芬園鄉地處彰化縣東側、八卦山台地北端，與南投縣草屯鎮相鄰，是彰化縣唯一不靠海、地勢最高的山地型鄉鎮。境內舊社村之名，則源自平埔族洪雅族「貓羅社」的傳統領域，顯示這一帶在漢人拓墾之前，同樣是平埔族群的生活範圍。如今芬園鄉因八卦山台地地形，發展出荔枝、龍眼、鳳梨等丘陵果樹產業，是彰化縣重要的水果產地之一。"],
    ["彰化縣","員林市","林仔街","員林原稱員林仔，因清代先民開墾森林、刻意留下一塊圓形林地建莊而得名。","","員林地名由來源自清代拓墾時的一種特殊留林習慣：康熙末年之後，大批移民湧入這片區域開墾，隨著雍正初年村莊逐漸成形、發展成市街，墾民在大規模砍伐林木闢地的過程中，特意保留了一塊圓形的林地未予砍伐，並在其周邊建立聚落，因而得名「員林仔」（「員」通「圓」），後來才簡化刪去「仔」字，成為今日的「員林」。這種刻意保留圓形林地的做法，可能兼具風水考量與生態調節的實用目的。員林憑藉地處彰化平原交通要衝的優勢，加上鐵路縱貫線設站帶動，逐漸發展成彰化縣南部最重要的商業與工業重鎮，人口規模長期位居彰化縣各鄉鎮市之冠，2015年正式由鎮改制為縣轄市，員林蜜餞、芭樂等農產加工業也讓這座因保留圓林而得名的城市聲名遠播。"],
    ["彰化縣","溪湖鎮","湖厝","溪湖舊稱湖厝，因舊濁水溪與麥嶼厝溪環流交會、周圍多沙丘窪地（湖）而得名。","","溪湖鎮舊稱「湖厝」，地名由來源自其獨特的水文地形：溪湖鎮地處彰化縣中央位置，舊濁水溪與麥嶼厝溪兩條溪流由此斜貫而過，支流環繞流經聚落周邊，加上周圍分布著許多沙丘群與低窪盆地地形，閩南語慣以「湖」稱呼這種盆狀窪地，先民便取溪流環繞之「溪」與盆地窪地之「湖」，合併命名為「溪湖」，「湖厝」則是更早期以「厝」（房舍聚落）為後綴的稱呼方式。溪湖鎮因地勢平坦、水源充沛，清代以來便是彰化平原重要的農業聚落，日治時期因製糖會社在此設立溪湖糖廠，一度是台灣中部重要的製糖重鎮，如今糖廠雖已停止製糖，但保留的五分車鐵道與園區，已轉型為觀光鐵道與地方文化資產，讓溪湖從單純的水文地名，發展出獨特的糖業觀光魅力。"],
    ["彰化縣","田中鎮","田中央","田中鎮名源自清代田中央莊，因聚落建於一片水田中央而得名，後因濁水溪氾濫沖毀田地，才轉型為市街。","","田中鎮地名由來相對直白，源自清代「田中央莊」之名：這處聚落最初建立於一片廣闊水田的中央位置，四周環繞著農田，因而得名。然而，隨著濁水溪多次氾濫改道，這片水田大半遭洪水沖毀流失，原本以農業為主的聚落被迫轉型，先民另擇地勢較高、較不易淹水之處重新發展，逐漸從單純的水田聚落蛻變為商業市街，「田中」之名卻仍保留下來，成為這段從農田到市街轉型歷程的歷史見證。田中鎮因位處清代八堡圳與十五庄圳（今八堡二圳）分水口附近，加上縱貫鐵路設站帶動，逐漸發展成彰化縣南端重要的交通與商業樞紐，鄰近的濁水溪畔沖積平原，至今仍是優質白柚與蔬果的重要產地。"],
    ["彰化縣","大村鄉","燕霧大莊","大村原稱燕霧大莊，因位於燕霧山（八卦台地）下、規模較大的集村聚落而得名。","","大村鄉舊稱「燕霧大莊」，這個地名結合了地形與聚落規模兩種概念：「燕霧」指的是境內鄰近的燕霧山，也就是今日所稱的八卦台地，因山勢地形而得名；「大莊」則說明這是燕霧山下規模較大的一處集村聚落，與周邊其他較小型的莊社有所區別，兩者合稱「燕霧大莊」，後簡化為「大村」，沿用至今。大村鄉地處彰化平原與八卦台地交界地帶，因土壤肥沃、日照充足，加上地勢略高、排水良好，成為台灣重要的葡萄產區，尤其以巨峰葡萄聞名全台，享有「巨峰葡萄之鄉」的美譽，每年葡萄產季更吸引大量遊客前來採果，讓這個源自山勢與聚落規模命名的鄉鎮，因葡萄產業而聲名遠播。"],
    ["彰化縣","埔鹽鄉","埔鹽","埔鹽因早期是蒲鹽菁（一種植物）茂生的荒埔，或因土地鹽分偏高的荒埔地而得名。","","埔鹽鄉地名由來主要有兩種說法：第一種說法認為，這一帶移民建村之初，是一片盛產「蒲鹽菁」的荒埔地，蒲鹽菁是一種可能與染料或藥用植物相關的作物，先民依此特徵稱之為「埔鹽」；第二種說法則從土壤特性出發，指出這片濱海荒埔地因地下水位偏鹹、土質鹽分含量偏高，不利一般作物生長，因而直接以「鹽」字描述其土壤特徵，加上「埔」字表示尚未大規模開墾的荒地，合稱「埔鹽」。無論何種說法為真，都反映了這一帶土地在拓墾初期面臨的自然條件挑戰。埔鹽鄉地處彰化平原西側，鄰近鹿港與福興，清代同樣受惠於鹿港貿易的繁榮腹地效應，如今則以稻米、蔬果等農業生產為主，是彰化縣典型的農業鄉鎮之一。"],
    ["彰化縣","埔心鄉","大埔心","埔心原稱大埔心，因聚落位於一片廣闊未墾荒地（埔）的中心位置而得名。","","埔心鄉舊稱「大埔心」，與台灣其他地方常見的「埔心」地名同屬一套命名邏輯：「埔」指尚未開墾的平坦荒地，「心」則表示中心、中央的位置，這處聚落恰好座落在一片範圍廣闊的荒埔地帶正中央，因而得名「大埔心」，後簡化為「埔心」，是彰化縣境內少數與桃園埔心、南投埔里等地名概念相通、卻各自獨立發展的案例。埔心鄉地處彰化平原核心地帶，清代以來便是重要的農業聚落，如今因氣候與土壤條件適宜，發展出獨具特色的葡萄與蜜紅葡萄柚等果樹產業，加上鄰近的芥菜、酸菜加工業，是彰化縣農業經濟多元發展的代表性鄉鎮之一，境內的舊館社區與芥菜產業館，也讓這個描述地理位置的舊地名注入嶄新的產業文化意涵。"],
    ["彰化縣","永靖鄉","關帝廳","永靖因清代粵籍移民聚居地屢遭閩粵械鬥波及，知縣楊桂森取「永久安靖」之意命名，勸誡雙方停止械鬥。","","永靖鄉地名由來與清代台灣社會常見的閩粵械鬥問題密切相關：這一帶自乾隆末年起，因是廣東客籍移民的主要聚居範圍，與周邊閩南聚落之間屢屢因土地、水源等資源競爭而爆發分類械鬥，雙方傷亡損失慘重。相傳當時的知縣楊桂森有感於械鬥頻仍對地方發展的嚴重危害，特地取「永久安靖」的期許之意，將這一帶命名為「永靖」，希望藉由地名本身承載的祝願，勸誡閩粵雙方族群放下仇隙、和睦共處，這與和美鎮「取和睦美鄰之意」命名的初衷不謀而合，顯示彰化縣境內至少有兩處地名，是清代官府或仕紳試圖以命名化解族群衝突的具體嘗試。永靖鄉如今仍保有典型的客家夥房建築，是彰化縣少數保留客家文化特色的鄉鎮。"],
    ["彰化縣","社頭鄉","社頭","社頭因清乾隆年間移民舉族在平埔族洪雅族大武郡社的社頭（頭目居所或聚落核心）之上建莊而得名。","","社頭鄉地名由來與平埔族聚落的空間結構有關：清乾隆年間，漢人移民舉族遷入此地開墾時，選擇在當地平埔族洪雅族「大武郡社」的「社頭」——也就是該社聚落的核心或頭目居所所在的位置——建立自己的莊社，因而將新建的莊名直接稱為「社頭」，社頭鄉境內至今仍保留「舊社村」的地名，正是當年大武郡社所在地的直接見證。社頭鄉地處八卦山台地西麓，因丘陵地形、氣候涼爽，加上桑樹種植歷史悠久，發展成全台最重要的織襪產業重鎮，享有「襪子的故鄉」美譽，每年生產的襪子占全台總產量相當高的比例，讓這個源自平埔族聚落核心命名的山腳鄉鎮，意外成為台灣紡織產業版圖中舉足輕重的一角。"],
    ["彰化縣","二水鄉","二八水","二水舊稱二八水，因八堡圳在此以「八」字形分為兩條水圳灌溉彰化平原而得名，另有取道「過二幅水」諧音的說法。","","二水鄉舊稱「二八水」，地名由來主要有兩種考證。第一種說法與清代重大水利工程有關：康熙58年（1719年）與60年（1721年），施世榜與黃仕卿兩位先賢分別在二水開鑿八堡圳（施厝圳，即今八堡一圳）與十五庄圳（今八堡二圳），兩條渠道行經二水鼻仔頭時，以「八」字形分流為一圳、二圳，蜿蜒灌溉整個彰化平原，因而得名「二八水」。第二種說法則出自學者陳國典的考證：明鄭時期，自林圮埔（今南投竹山）前往此地，必須渡過清水溪、濁水溪兩條溪流，稱為「過二幅水」，因「二幅水」與台語「二八水」發音雷同，加上早期移民識字不多，便將地名寫成「二八水」，1920年才簡化為「二水」。二水鄉因八堡圳分水工程，是全台重要的水利文化資產所在地，境內的水圳文化園區至今仍展示這段治水拓墾的歷史。"],
    ["彰化縣","北斗鎮","寶斗","北斗舊稱寶斗，因源自平埔族巴布薩族東螺支族「Baoata社」音譯，另有街道規劃方正、形似量米方斗之說。","","北斗鎮舊稱「寶斗」，地名由來主要有兩種說法：一說源自居住於此的平埔族巴布薩族東螺支族「Baoata社」的社名音譯，直接轉寫為「寶斗」；另一說則從地形著眼，指北斗街道規劃整齊方正，形狀酷似古代用來量米的方形量斗「寶斗仁」，因而得名。北斗原稱「東螺街」，因清道光元年（1821年）舊街遭東螺溪（今舊濁水溪）洪水沖毀，居民被迫遷移至今日北斗鎮所在地重建街市，並依繼承東螺地區行政機能之意，另建新街，其後才將「寶斗」雅化為發音相近的「北斗」，取北斗七星之意，沿用至今。北斗因清代重建後迅速發展成彰化平原南側的重要商業市街，與員林、鹿港並稱彰化縣三大早期市街，境內奠安宮、北斗老街等古蹟至今仍見證這段因水患遷城的歷史。"],
    ["彰化縣","二林鎮","二林社","二林因是平埔族巴布薩族「二林社」的傳統領域而得名，荷蘭時代文獻記載為Gielim。","","二林鎮地名源自平埔族巴布薩族「二林社」的社名，這個平埔族部落是荷蘭統治時期文獻中記載的「Gielim」，是彰化沿海地區重要的原住民聚落之一，漢人入墾後直接沿用其社名音譯，定名為「二林」。二林因地處彰化縣西南沿海，土壤與氣候條件適合甘蔗種植，日治時期糖業興盛，1925年爆發的「二林事件」（又稱二林蔗農事件），是台灣農民運動史上第一次農民組織性的集體抗爭行動，蔗農為爭取合理的甘蔗收購價格，與林本源製糖會社及日本警方發生激烈衝突，這起事件被視為台灣農民運動的重要里程碑，也讓二林這個源自平埔族社名的濱海鄉鎮，在台灣社會運動史上留下重要的一頁。如今二林以葡萄、蔬果等農業生產聞名，也是彰化縣重要的酒莊產業聚落。"],
    ["彰化縣","田尾鄉","田尾","田尾因清代先民在十五庄圳灌溉水田地帶的末端建莊而得名。","","田尾鄉地名由來相對直白，與秀水鄉「臭水」（位於灌溉末端而積水發臭）的命名邏輯類似：清代墾民在十五庄圳這套灌溉水利系統所澆灌的水田地帶，選擇位置相對偏向末端之處建立聚落，因而得名「田尾」，意指水田灌溉範圍的尾端。田尾鄉地處彰化平原南側，因濁水溪沖積帶來的肥沃土壤，加上溫和的氣候條件，逐漸從單純的稻作水田地帶，轉型發展成全台最重要的花卉苗木專業區之一，享有「花的故鄉」美譽，境內公路花園沿線苗圃林立，各式盆栽、園藝景觀造景批發買賣熱絡，每年吸引大量遊客前來賞花購苗，讓這個原本描述水田末端位置的地名，蛻變為台灣花卉產業的重要地標。"],
    ["彰化縣","埤頭鄉","埤頭","埤頭因清雍正年間漢人在莿仔埤圳的圳頭附近建莊而得名。","","埤頭鄉地名由來源自清代的水利建設：雍正年間，漢人移民入墾這片區域時，選擇在灌溉水圳「莿仔埤圳」的取水口（圳頭）附近建立聚落，「埤」在閩南語中泛指蓄水池或水圳，「頭」則表示源頭或起始位置，兩字合稱「埤頭」，意指水圳源頭處的聚落，這種依水利設施位置命名的方式，反映了清代台灣農業拓墾對灌溉水源的高度依賴。埤頭鄉地處彰化平原西南側，因濁水溪沖積形成的肥沃沖積扇地形，加上完善的埤圳灌溉系統，自清代以來便是重要的稻作生產區，如今則以蔬菜、水稻等農業生產為主，是彰化縣典型的農業鄉鎮之一，境內的合興村百年老樹等地標，也見證了這段依水而興的拓墾歷史。"],
    ["彰化縣","芳苑鄉","番仔挖","芳苑原稱番仔挖，因是平埔族巴布薩族居住地（番仔），且溪流在此轉折入海（挖）而得名，光復後取當地舉人洪算諒宅號改稱芳苑。","","芳苑鄉舊稱「番仔挖」，這個地名結合了族群與地形兩種元素：「番仔」是清代漢人對這一帶平埔族巴布薩族居民的慣稱，反映此地曾是該族群的傳統領域；「挖」則是台語用來形容溪流或海岸線轉折彎曲之處的用字，境內有一條溪道在流入台灣海峽前呈現明顯的彎折走向，因而得名「番仔挖」。台灣光復後，鑑於「番仔」一詞帶有歧視意味，地方政府決定以當地清代舉人洪算諒的宅號「芳苑」取代舊名，作為新的鄉名，這種以在地知名仕紳宅號重新命名地方、藉此淡化帶有歧視色彩舊稱的做法，在台灣戰後地名雅化過程中具有代表性。芳苑鄉地處彰化縣濱海地帶，境內王功漁港、芳苑潮間帶生態與燈塔等景點，讓這個曾經因族群與地形命名的濱海鄉鎮，發展出獨特的海線觀光魅力。"],
    ["彰化縣","大城鄉","大城厝","大城原稱大城厝，因清道光初年移民聚落遭械鬥威脅，築土成壘防禦盜匪而形成規模較大的集村，故得名。","","大城鄉地名由來與清代地方治安狀況密切相關：清道光初年，陸續有移民前來這片濁水溪出海口附近的荒埔地開墾聚居，然而當時分類械鬥與盜匪侵擾頻繁，居民為了自保，紛紛在聚落四周構築土牆壁壘，形成具防禦功能的集村聚落，隨著人口聚集規模逐漸擴大，形同一座具備防禦工事的小城，因而得名「大城厝」，後簡化為「大城」。大城鄉地處彰化縣最南端，緊鄰濁水溪出海口，因地勢低平、土壤含鹽分較高，農業生產條件相對嚴苛，居民多從事西瓜、花生等耐旱耐鹽作物種植，加上沿海的漁業與蚵仔養殖，是彰化縣濱海地帶重要的農漁業鄉鎮，境內的台灣西瓜促銷活動也讓大城西瓜享有一定知名度。"],
    ["彰化縣","竹塘鄉","竹塘","竹塘因清初墾民儲水為塘以利灌溉，且周邊水塘一帶蘆竹叢生茂密而得名。","","竹塘鄉地名由來結合了水利設施與植被特徵兩種元素：清初移民入墾這片區域時，因灌溉水源不易取得，便挖掘池塘蓄積雨水與地下水，以供農業灌溉之用；而這些人工開鑿的水塘周邊，恰好生長著大片茂密的蘆竹，先民依此特徵，將這片以蓄水池塘與蘆竹叢生為特色的區域，命名為「竹塘」。竹塘鄉地處彰化平原西南側，鄰近濁水溪沖積扇末端，因灌溉水利系統的持續改善，早已從清初依賴蓄水塘灌溉的拓墾聚落，發展成彰化縣重要的稻米與蔬果產區，境內的醒靈宮等百年廟宇，也見證了這段先民開鑿水塘、克服水源不足困境的拓墾歷史。"],
    ["彰化縣","溪州鄉","溪州","溪州因地處東螺溪與西螺溪之間的氾濫沖積平原（洲）而得名。","","溪州鄉地名由來源自其獨特的河川地形：這片區域坐落於東螺溪與西螺溪兩條溪流之間，是濁水溪多次氾濫改道所沖積形成的浮覆地帶，閩南語慣以「洲」稱呼這種由河流泥沙堆積而成的沙洲地形，加上位處兩溪之間，因而得名「溪州」。溪州鄉境內另有一處聚落「舊眉」，地名源自平埔族巴布薩族「眉里社」的傳統領域，是了解這一帶平埔族分布歷史的重要線索。溪州因地處濁水溪沖積扇末端，土壤肥沃、水源充沛，是台灣重要的水稻與蔬果產區，享有「濁水米故鄉」的美譽，境內的台灣糖業公司溪州糖廠與周邊的森林公園，也讓這個因河川沙洲地形得名的鄉鎮，兼具農業生產與生態休閒的多重面貌。"],
    ["彰化縣","八卦山","望寮山","八卦山最早稱望寮山，因可登高瞭望彰化縣城而得名，清嘉慶年間知縣胡應魁因山形如八卦而改名。","","八卦山最早見於1717年《諸羅縣志》，當時稱為「寮望山」或「望寮山」，因地處彰化縣城制高點，可綜觀全城動靜，清代即在山頂設置瞭望台戒備。雍正9年（1731年）大甲西社事件平定後，台灣道倪象愷在山上建立「鎮番亭」；道光年間又依地方士紳建議，興築「定軍山寨」戍守縣城，一度改稱「定軍山」，有「定寨望洋」的美稱。嘉慶3年（1798年），知縣胡應魁鑒於山勢輪廓神似《易經》中的八卦圖形，遂將此山正式更名為「八卦山」，並建太極亭，取「太極生兩儀，兩儀生四象，四象生八卦」之義；民間另有一說，認為此名與清代秘密會黨「天地會」分支「八卦會」曾在此地聚集活動有關。光緒21年（1895年）乙未戰爭中，八卦山之役是這場戰事規模最大、傷亡最慘烈的一戰，客家義軍領袖吳湯興、黑旗軍統領吳彭年皆壯烈犧牲。1961年，山頂建成當時亞洲最大的釋迦牟尼佛像，成為今日彰化最具代表性的地標。"],
    
    // --- 【南投縣】 ---
    ["南投縣","南投市","南投社","南投源自洪雅族「南投社」，因位居「北投社」（今草屯）之南而得名，與台北北投無關。","","南投地名由來與草屯的舊稱密切相關：清代文獻《諸羅縣志》記載「虎尾之北有大武郡山，東為南投山，內社二，溪南為南投，溪北為北投」，說明貓羅溪南北兩岸各有一個平埔族洪雅族聚落，溪北稱「北投社」（即今草屯鎮，古稱北投堡），溪南則相對稱為「南投社」，兩地地名互為對照，與台北市北投區並無地緣關聯，純屬巧合同名。關於「北投社」原名的考證另有一說，指其原稱「Tausabata」，漢人取其後半「bata」音譯為北投社，南投社之名則是相對於北投社而生；另有學者主張南投社本身即源自洪雅族支族阿立昆族語「Ramtau」的音譯。乾隆24年（1759年），彰化縣在南投正式設縣丞，是南投地區有政教建制之始，光緒元年更因開山撫番設立埔里社廳，逐步奠定今日南投縣治所在地的地位，如今南投市因糖業歷史與縣政府進駐，是全台唯一不臨海縣份的行政中樞。"],
    ["南投縣","埔里鎮","埔里社","埔里源自邵族「埔里社」與泰雅族「眉里社」，清道光年間因西部平埔族大舉遷入形成「平埔各社最集中的鄉里」而得名。","","埔里地名由來與台灣中部平埔族群的一段集體遷徙史密切相關：這片盆地清領前期原是邵族「Poli社」（埔里社）與泰雅族「Vairi社」（眉里社）的生活領域，清乾隆53年（1788年）《埔里社紀略》中已可見「埔里社」之名。道光元年（1820年）前後，受到閩粵漢人拓墾壓力排擠，台灣西部的道卡斯、巴則海、巴布薩、拍瀑拉等多個平埔族群，不約而同大舉遷入埔里盆地另闢生機，使埔里成為當時全台平埔各族最集中匯聚的地區，學者洪英聖便將埔里解釋為「平埔各社最集中的鄉里」。埔里境內的「愛蘭里」舊稱「烏牛欄」，源自原居台中豐原的巴宰族「烏牛欄社」遷居於此；「房里」則是苗栗苑裡道卡斯族「房里社」族人遷入後留下的地名。光緒元年設埔里社廳後，當地曾築土城牆，稱「大埔城」。埔里如今以酒廠、花卉與地理中心鎮聞名，是南投縣北部最重要的山城市鎮。"],
    ["南投縣","草屯鎮","草鞋墩","草屯舊稱草鞋墩，因位處交通要衝，往來挑夫商旅在此更換磨損的草鞋，廢棄草鞋堆積如山而得名。","","草屯舊稱「草鞋墩」，這個地名生動描繪了清代交通往來的真實場景：草屯地處通往埔里、水沙連等內山地帶的必經要道，往來的挑夫、商旅在此長途跋涉後，草鞋早已磨損不堪，於是紛紛在此更換新鞋，卸下的破舊草鞋日積月累、堆積如山，形成一座顯眼的「墩」（小丘），因而得名「草鞋墩」，是台灣地名中相當生動寫實的交通民生案例。草屯古稱「北投社」，是洪雅族阿里坤支族的傳統領域，與溪南的「南投社」相對而得名。1920年，日本殖民政府推行地方行政改制，將「草鞋墩」簡化雅化為「草屯」，沿用至今。草屯鎮境內的坪頂里七股遺址、中原里頂崁仔遺址，出土了牛罵頭文化與營埔文化的史前器物，顯示這一帶自新石器時代便已有人類活動，如今草屯是南投縣人口最多的市鎮，也是中彰投都會區重要的衛星城市。"],
    ["南投縣","竹山鎮","林圮埔","竹山舊稱林圮埔，為紀念明鄭參軍林圮率眾入墾此地、力抗原住民而戰死得名，日治時期因竹林茂密改稱竹山。","","竹山舊稱「林圮埔」，是南投縣漢人開發史上的第一站：明永曆22年（1668年），鄭成功麾下參軍林圮（也寫作林圯）奉命率領部屬進入竹山一帶屯墾，這裡地屬水沙連番界，漢番交界局勢緊張，林圮在此設置社商休息用的草寮與原住民議和交易，境內「社寮」地名即由此而來；然而林圮其後行經東埔蚋（今竹山延平里）一帶時，遭逢原住民出草殺害而身亡，後人感念他開拓竹山的功績，便以其名為這片墾地命名「林圮埔」。1920年，日本殖民政府推行地方行政改制，因當地竹林密布、竹產業發達，將「林圮埔」改稱「竹山」，沿用至今，竹山也因此發展出全台重要的竹藝加工產業。境內因車籠埔斷層通過，1999年921大地震震央即在附近，如今設有車籠埔斷層保存園區，見證這段地質變動的歷史記憶。"],
    ["南投縣","集集鎮","集集社","集集地名由來有二說，一為平埔族「集集社」譯音，一為早期移民將收穫物資集中交易而得名。","","集集地名由來主要有兩種說法：第一種說法認為，「集集」源自水沙連番界內平埔族「Chipu-chipu社」（集埔集埔社）的音譯漢字；第二種說法則從拓墾過程著眼，指出移民入墾此地後，習慣將各自開墾收穫的農產物資，集中運送到固定場所進行交易，這種「集中交易」的功能性聚落，因而得名「集集」或「聚集」。集集與鄰近的中寮鄉境內都曾出現「半路店」這個地名，指的是移民開發路段中途所形成的店鋪街市，反映了清代拓墾沿交通路線逐步向內山推進的過程。集集因地處濁水溪畔，日治時期興建集集線鐵路作為水力發電工程的運輸線，如今已轉型為觀光鐵道，加上綠色隧道與集集火車站的懷舊氛圍，是南投縣熱門的鐵道觀光小鎮，其舊稱「半路店」則已鮮少為人所知。"],
    ["南投縣","名間鄉","湳仔","名間舊稱湳仔，因地勢低窪潮濕多爛泥而得名，日治時期因其日語發音近似「湳仔」台語音而改稱名間。","","名間鄉舊稱「湳仔」，「湳」在閩南語中意指濕軟泥濘的低窪地形，這一帶因排水不易、土地經常潮濕泥濘，先民便以此地形特徵為聚落命名，這種因低窪濕地而得名「湳仔」「大湳」的地名在台灣各地相當常見。1920年，日本殖民政府推行地方行政改制，選定漢字「名間」取代原本的「湳仔」，原因是「名間」二字的日語讀音「なま」（na-ma）與台語「湳仔」的發音十分相近，這種利用日語發音近似性來選字更名的方式，與新竹鎮西堡、關西等地借用日語地名的邏輯類似，但名間更特別之處在於是刻意挑選字義吉祥、發音又相近的漢字組合。名間鄉因八卦山台地南端地形，加上濁水溪沖積平原的加持，是全台重要的茶葉（尤其是松柏長青茶）與生薑產地，境內松柏嶺受天宮更是全台玄天上帝信仰的重要進香中心。"],
    ["南投縣","鹿谷鄉","羌仔寮","鹿谷舊稱羌仔寮，因早期羌群棲息於此，獵羌者搭寮居住而得名，1920年因「羌」與「鹿」相似、境內多溪谷而改稱鹿谷。","","鹿谷鄉舊稱「羌仔寮」，這個地名反映了當地開墾前的野生動物生態：清代此地尚未開墾之前，是山羌群聚棲息之地，前來狩獵羌隻的獵人在此搭建簡易茅寮暫居，隨著聚落逐漸擴大發展成村莊，便以「羌仔寮」為名，這個地名還曾出現「羌雅寮」「獐仔寮」「猐仔寮」等多種不同音譯寫法。1920年，日本殖民政府推行地方行政改制，考量「羌」與「鹿」外形相似，加上境內因濁水溪支流切割而多溪谷地形，便將「羌仔寮」改稱「鹿谷」，沿用至今。乾隆年間，漳州人程志成、泉州人許廷瑄先後率眾入山開墾，途中屢遭原住民出草威脅，歷經艱辛才逐步拓墾出羌仔寮、坪仔頂、車輄寮、小半天等聚落。如今鹿谷因氣候與地形適宜，是台灣最富盛名的凍頂烏龍茶產地，境內溪頭自然教育園區也是熱門的森林遊憩景點。"],
    ["南投縣","中寮鄉","中寮","中寮因清代先民沿二重溪東岸築寮拓墾，此聚落恰好位居六寮、十八甲寮、後寮等眾多寮舍聚落之中央而得名。","","中寮鄉地名由來源自清代拓墾聚落的相對位置：先民沿二重溪東岸一帶搭建簡易草寮、逐步開墾定居，陸續形成六寮、十八甲寮、後寮等多個以「寮」為名的小型聚落，其中位置恰好座落於這些聚落中央地帶的一處，便直接被稱為「中寮」。中寮鄉境內因清代拓墾規模與產業活動，留下大量以「股」「份」計算開墾規模的地名，如十八股寮、六股、十四股、二十份等，加上「打鐵坑」（打鐵業聚落）、「大丘園」（大片田園菜圃）等依產業與地形命名的聚落，共同呈現這一帶豐富多樣的拓墾地名文化。中寮鄉地處南投縣西側丘陵地帶，因氣候與土壤條件適合，是台灣重要的龍眼與柳丁產地，1999年921大地震震央雖在集集，中寮卻是受創最嚴重的鄉鎮之一，如今已從地震重建中逐漸恢復農村風貌。"],
    ["南投縣","魚池鄉","五城堡","魚池舊稱五城堡，因清道光末年在新城、貓蘭、司馬垵、水社、銃櫃五處聚落外築竹圍防禦而得名，另一舊稱魚池仔則因日月潭漁產豐富而來。","","魚池鄉有兩個歷史脈絡不同的舊稱。「五城堡」之名，源自道光末年（1840年代）漢人移民入墾這一帶後，為防禦原住民與盜匪侵擾，分別在新城、貓蘭、司馬垵、水社、銃櫃五個聚居點外圍構築竹圍防禦工事，「銃櫃」即指存放槍砲的堡壘據點，五個聚落合稱「五城堡」；另一個舊稱「魚池仔」則因日月潭在興建水庫、進行水力發電工程之前，原本就是一座漁產豐盛的天然湖泊，入墾的漢人依此漁業資源特色，將這一帶稱為「魚池仔」，1920年簡化為「魚池」。魚池鄉境內的日月潭是台灣最大的天然湖泊，也是邵族傳統領域，加上得天獨厚的氣候條件，是台灣紅茶（日月潭紅玉紅茶）的重要產地，讓這個因防禦聚落與漁業資源命名的山區鄉鎮，兼具觀光、生態與茶葉產業的多重魅力。"],
    ["南投縣","國姓鄉","國姓","國姓因鄭成功部將劉國軒追擊平埔族大肚社時曾行經此地而得名，「國姓」則源自鄭成功受南明皇帝賜姓朱、人稱「國姓爺」的典故。","","國姓鄉地名由來與明鄭時期的一段軍事行動有關：鄭成功因獲南明隆武帝賜予「朱」姓，被尊稱為「國姓爺」，其麾下部將劉國軒在追擊反抗明鄭政權的平埔族拍瀑拉族大肚社族人時，曾率軍行經這片區域，後人為紀念這段與鄭成功「國姓爺」相關的歷史淵源，便將此地命名為「國姓」，是南投縣境內少數直接承襲明鄭時期人物典故的地名。國姓鄉地處烏溪上游河谷地帶，是漢人與泰雅族、布農族接觸拓墾的前緣地帶之一，境內因氣候與土壤條件適宜，是台灣重要的青梅與樹薯產地，每年梅花季更吸引大量遊客前來賞梅，讓這個源自鄭成功部將行軍典故的山區鄉鎮，發展出獨具特色的農業觀光資源。"],
    ["南投縣","水里鄉","水裡坑","水里原稱水裡坑，源自邵族「水裡社」（水社）社名，因鄰近日月潭畔部落而得名，1950年設鄉時簡化為水里。","","水里鄉地名源自居住於日月潭畔的邵族「水裡社」（又稱水社），日月潭舊稱「水裡湖」或「水社湖」正是因鄰近水裡社而得名，郁永河《裨海紀遊》記載日月潭因「水分丹碧二色，故名日月潭」，可見這座湖泊擁有雙重舊稱系統。水里鄉地處水裡溪匯入濁水溪之處，這片河階地帶因而得名「水裡坑」，1950年水里正式設鄉時，簡化為今日的「水里」。水里鄉境內的「社子」「拔社埔」等地名，同樣顯示這一帶曾是拍瀑拉族等南島原住民族群的傳統聚落所在地。日治大正2年（1914年），為了運輸埔里糖廠所需甘蔗與物資，鋪設連接外界的輕便鐵道，沿線設置多個中繼站，其中「車埕」因經常停放數百輛台車而得名，成為水里鄉重要的木材與交通運輸重鎮，如今車埕已轉型為知名的鐵道觀光景點。"],
    ["南投縣","信義鄉","羅娜","信義鄉為布農族傳統領域，戰後國民政府取「四維八德」中的「信義」二字為山地鄉命名，境內羅娜為布農族最大部落。","","信義鄉是南投縣境內布農族的主要傳統領域，戰後國民政府治台，仿效「忠孝仁愛信義和平」等儒家傳統道德教條，為新設立的山地鄉命名，將這片布農族聚居的山地行政區定名為「信義」，與鄰近仁愛鄉（取「仁愛」二字）同屬這波政治教化式命名的產物。境內的「羅娜」是信義鄉規模最大的布農族部落，人口眾多、部落文化保存完整；「東埔」則是另一處著名的布農族部落，因鄰近溫泉、風景秀麗而聞名，境內東埔吊橋更是全台最高的吊橋之一。信義鄉境內還有台灣最高峰玉山，布農族稱之為「Tongku Saveq」（意指高大的山），清代文獻中則因終年雲霧繚繞、遠望皆白石而得名「玉山」，日治時期因比日本富士山更高，一度改稱「新高山」，戰後才恢復玉山舊名，成為認識台灣多元族群與外來政權更迭的絕佳例證。"],
    ["南投縣","仁愛鄉","霧社","仁愛鄉舊稱霧社，源自泰雅語「終年雲霧繚繞」之意，戰後國民政府取「四維八德」中的「仁愛」二字為山地鄉命名。","","仁愛鄉境內的「霧社」，地名源自泰雅族語，意指這一帶地勢高聳、終年雲霧繚繞的地理特徵，是南投縣境內泰雅族與賽德克族的重要傳統領域。1930年，賽德克族在此發動震驚台灣社會的抗日行動「霧社事件」，是台灣原住民武裝抗日史上規模最大、影響最深遠的一次起義。事件後，日本當局將部分遺族強制遷移至北港溪與眉原溪之間的河階台地，因三條溪流匯集形似「川」字，日人稱之為「川中島」，族人則自稱「谷路邦」（Alan-Gluban）部落，戰後因去日本化考量改稱「清流部落」，如今兩個名稱仍並行使用。戰後，國民政府比照信義鄉的命名邏輯，將這片山地行政區定名為「仁愛」。仁愛鄉境內的清境農場，前身為「見晴農場」，1965年因時任行政院長蔣經國讚嘆「清新空氣任君取，境地幽雅是仙居」而改名清境，如今已是台灣中部最負盛名的高山觀光勝地之一。"],
    ["南投縣","清境","見晴農場","清境農場原名見晴農場，1965年因時任行政院長蔣經國讚嘆「清新空氣任君取，境地幽雅是仙居」而改名清境。","","清境農場前身為「見晴農場」，民國50年（1961年）由行政院退除役官兵輔導委員會創立，最初以安置退伍軍人從事高山農牧開墾為主要目的，「見晴」之名可能與當地地勢高聳、視野開闊、易見晴朗天色有關。民國54年（1965年），時任行政院長蔣經國先生造訪此地，見這片坐落於海拔約1750公尺高原上的牧場，四季景致如畫、氣候溫和清爽，讚嘆「清新空氣任君取，境地幽雅是仙居」，遂賜名「清境農場」，這句頗具詩意的題詞也成為地名由來的重要典故。清境地處中部橫貫公路霧社支線通往合歡山的必經之地，因終年雲霧繚繞、氣候宜人，享有「霧上桃源」的美譽，如今已從退輔會的高山農場，轉型為結合綿羊放牧、歐式民宿與高山景觀的台灣中部最知名觀光勝地之一，每年吸引大量遊客前來避暑賞景。"],
    ["南投縣","日月潭","水裡社潭","日月潭因潭水一側形如日輪、一側形如月鉤而得名，舊稱水裡社潭或水沙連，是邵族傳統領域，潭中拉魯島為邵族祖靈聖地。","","日月潭舊稱「水裡社潭」或「水社湖」，因鄰近邵族「水裡社」（水社）而得名；清代文獻中，這一帶連同周邊地區泛稱「水沙連」，範圍曾記載有三十六社、二十四社等不同說法，其中頭社、水社、貓蘭社、沈鹿社、埔裏社、眉社合稱「水沙連六社」。「日月潭」之名則描述了潭水的地形特徵：道光初年北路理番同知鄧傳安在〈遊水里社記〉中記載「水分丹碧二色，故名日月潭」，一般認為潭的北側形狀渾圓如太陽，南側狹長彎曲如月鉤，因而得名。潭中的拉魯島，是邵族心目中祖靈安息的聖地，「拉魯」即「祖靈聖島」之意；國民政府時期因強調中華意識，一度將此島改稱「光華島」，直到1999年921大地震重創該島、經整頓後，時值陳水扁總統執政，才正式恢復「拉魯島」的原名，這段島名變遷完整見證了台灣不同政權更迭下的文化政策轉變。"],
    ["南投縣","溪頭","溪頭","溪頭因位於北勢溪（麒麟潭溪）的源頭附近而得名，境內為台灣大學實驗林場，以孟宗竹林與大學池聞名。","","溪頭地名由來相對單純，因這片區域地處北勢溪上游、溪流發源地附近，先民依此地理位置直接命名為「溪頭」，意指溪流的源頭之地。溪頭與鄰近鹿谷鄉「羌仔寮」（今鹿谷）的開發脈絡緊密相連，同屬國立台灣大學實驗林管理處管轄範圍內的重要林場基地，日治時期便已規劃為林業試驗與教學用地，園區內遍植孟宗竹、柳杉、台灣杉等人工林，森林覆蓋率極高、負氧離子豐富，是台灣最早開發的森林遊樂區之一。境內的大學池（初稱竹廬），是台大實驗林場為蓄水灌溉及景觀造景所闢建的人工池塘，池上的獨木橋與竹拱橋已成為溪頭最具代表性的景觀地標。如今溪頭與鄰近的杉林溪、小半天等地共同構成南投縣鹿谷鄉重要的森林生態旅遊廊帶，是台灣中部避暑賞景的熱門去處。"],
    ["南投縣","車埕","車埕","車埕因1914年埔里糖廠興建輕便鐵道運輸蔗糖，此地作為台車中繼休息與修理站，經常停放數百部台車而得名。","","車埕地名由來與日治時期的糖業與林業運輸密切相關：大正2年（1914年），為了運送埔里地區生產的蔗糖，總督府鋪設一條對外連接的輕便鐵道，車埕因地處交通要衝，被規劃為沿線重要的中繼休息站與修理站，經常有數百部人力輕便台車在此停放、調度，因而得名「車埕」，「埕」在閩南語中泛指開闊的空地或廣場，恰好貼合這裡作為台車調度場地的功能。隨著集集線鐵路的興建與延伸，車埕進一步發展成南投山區重要的木材集散與運輸重鎮，日治至戰後全盛時期，這裡林業加工廠林立，是木業經濟的核心地帶。隨著林業政策轉變與鐵路運輸功能式微，車埕一度沒落，近年透過保存舊車站建築、木業歷史廠房與周邊明潭水庫的湖光山色，成功轉型為集集線鐵路端點站的熱門觀光小鎮。"],
    ["南投縣","武界","Vogai","武界因位處泰雅族與布農族早年交戰後議和劃定的獵域界線而得名，另一說源自布農語「Vogai」，意指翻越山嶺或界線。","","武界地名由來主要有兩種說法：第一種說法指出，這裡是南投信義鄉與仁愛鄉的交界地帶，早年北側泰雅族與南側布農族時常因爭奪獵域而發生衝突，雙方經過協調後，議定以干卓萬山為界、互不越界，這條劃定的界線正好通過武界現址，因而得名「武界」；第二種說法則認為地名源自布農語「Buqaiz」（也拼寫作Vogai或Bogai）的音譯，意指「翻越某物」，例如翻過一座山頭或跨越一條界線，恰好呼應了武界地處山區要衝、族群往來必經之地的地理特徵。1919年，台灣總督府為統一管理布農族卓社群，推行「集團移住」政策，將原本分散各處的卓社群部落族人集中遷移到濁水溪沖積平原上安置，形成今日的武界部落（法治村），是台灣布農族分布最北的一支，如今武界因鄰近武界壩與雲龍瀑布，是南投縣深具原始風貌的部落型觀光景點。"],

    // --- 【擴充：交通與特殊地名】 ---
    ["新北市","浮洲","浮洲","浮洲因位於大漢溪沖積形成的沙洲地帶，地勢低平、雨季易被大水淹沒若浮於水面而得名。","","浮洲地名由來與其所在的地形直接相關：這片位於板橋南側的土地，是大漢溪長期沖積作用堆積而成的沙洲地帶，地勢低平，每逢雨季河水暴漲，四周景象猶如漂浮於水面之上，因而得名「浮洲」。清代這一帶因地勢低窪、常遭水患侵擾，開發程度相對較晚，多作為農業用地。隨著板橋市區向南擴張，加上台北大學校區與周邊住宅社區的興建，浮洲逐漸從昔日的河濱沙洲農地，轉型為板橋南側重要的新興住宅與文教區域。浮洲橋橫跨大漢溪，連接板橋與土城兩地，也是這一帶居民往來對岸的重要交通動脈，見證了這片沙洲地從農業聚落發展為都市外圍生活圈的變遷過程。"],
    ["桃園市","永安","永安","永安因地處新屋溪出海口，是清代以來重要的漁業據點，日治時期設立漁港後定名永安，取平安吉祥之意。","","永安漁港位於新屋區新屋溪出海口，是桃園沿海少數具規模的天然漁港之一，地名「永安」取「永遠平安」的吉祥寓意，反映討海人家祈求出海作業平安順利的樸實心願，這種以吉祥字詞為漁村命名的方式，在台灣沿海聚落中相當常見。永安地區清代以來便是新屋一帶重要的漁業與農業並存聚落，居民多兼營近海捕撈與沿岸養殖；日治時期，當局在此闢建漁港設施，正式以「永安」為港口命名，逐漸發展成新屋沿海最重要的漁業據點。如今永安漁港周邊興建了以海洋文化為主題的「海螺文化園區」與觀光魚市，弧形的漁港堤防搭配夕陽美景，加上鄰近的永安濱海自行車道與綠色隧道，讓永安從傳統漁村轉型為桃園沿海知名的觀光景點，每年吸引大量遊客前來品嚐海鮮、欣賞海岸風光。"],
    ["新竹市","千甲","千甲","千甲因清代王世傑家族在此拓墾面積廣達逾千甲田園而得名，見證竹塹早期大規模墾殖的規模。","","千甲地名由來，直接見證了清代竹塹地區最重要的一波拓墾成果：康熙57年（1718年），福建同安人王世傑率族人渡海來台，向道卡斯族竹塹社取得土地展開開墾，短短約三十年間，從頭前溪南岸的樹林頭一路向南拓展到靠近香山的南勢地區，已開闢出逾千甲的田園，「千甲」之名便由此而來，直接以開墾面積作為地名，是台灣地名中相當寫實的計量式命名範例。王世傑家族除了廣闢田園，也修築水圳灌溉良田，其中隆恩圳最初便因可灌溉四百甲土地而稱作「四百甲圳」，可見當時竹塹平原水利建設之發達；王家同時捐地出資興建東瀛福地、新竹城隍廟、竹蓮寺等地方廟宇，奠定竹塹地區信仰與社會發展的基礎。如今千甲一帶已高度都市化，成為新竹市東區重要的住宅與商業區域，但這個源自三百年前拓墾規模的地名，仍持續提醒著人們這片土地開發的歷史起點。"],
    ["台中市","精武","精武","精武因鄰近「台中市體育場」（精武路）一帶，多以「精武」為路名或機關命名，取自精武體育會提倡強身報國之精神。","","精武地區的地名由來，與20世紀初中國興起的一項民間武術推廣運動有關：清末民初，上海成立「精武體育會」，宗旨在於推廣武術強身、培養國民體魄，藉此達到強國保種、報效國家的目標，這項運動風潮也影響到台灣，許多地方在規劃道路或機關命名時，選用「精武」二字以彰顯強身愛國的精神。台中市北區、北屯區交界一帶的精武路，便是循此脈絡命名，加上鄰近設有台中市立體育場、國立台中家事商業職業學校等重要教育體育機構，「精武」逐漸成為這一帶地區的通稱地名，用以指稱路名及周邊生活圈。如今精武商圈因鄰近一中商圈與台中科技大學，也發展成台中市重要的學生消費與夜市聚集地帶，讓這個源自近代中國強身愛國運動的地名，在台灣的日常生活中留下了印記。"],
    ["台中市","五權","五權","五權因鄰近五權路而得名，路名取自國父孫中山「五權憲法」（行政、立法、司法、考試、監察）的政治理念。","","五權地區的地名由來，源自中華民國建國初期重要的憲政理念：國父孫中山先生所提出的「五權憲法」主張，在西方三權分立（行政、立法、司法）的基礎上，另外加入源自中國傳統的考試權與監察權，合稱「五權分立」，這項政治理念在戰後台灣的道路命名中頗具影響力，許多城市皆設有以「五權」為名的道路，台中市的五權路便是其中之一。五權路及周邊地區因鄰近國立台灣美術館、國美館綠園道與勤美誠品綠園道等重要文化設施，加上台中市政府（舊址）曾設於此，逐漸發展成台中市重要的藝文與商業核心地帶，「五權」也因此成為這一帶生活圈的通稱地名。如今五權商圈與草悟道、審計新村共同構成台中市西區最具代表性的文創與生活美學廊帶，讓這個源自憲政理念的路名，演變成台中都會生活中相當熟悉的地標稱呼。"],
    ["彰化縣","永靖","永靖","廣東移民，寓意永久安靖。","","永靖境內清代原有東門、西門、南門、北門四座隘門，是粵籍移民為防禦閩粵械鬥與盜匪侵擾而興建的防禦性聚落設施，其中最初的市街核心稱為「關帝廳」，因當地建有主祀關聖帝君的廟宇而得名，這也是永靖鄉境內至今仍可見的舊地名之一。永靖與員林、社頭等地同屬清代粵籍移民與閩籍移民犬牙交錯的拓墾地帶，族群關係曾一度相當緊張，永靖的命名正是官方試圖以行政手段化解衝突的具體例證。如今永靖鄉境內的餘三館，是台灣少數保存完整的清末閩南式合院建築，也見證了這段閩粵移民共同開發永靖的歷史，加上當地盛產的胡蘿蔔（俗稱永靖菜頭），讓永靖從一個寄託族群和諧願景的地名，發展出兼具歷史建築與農業特產的雙重風貌。"],
    ["嘉義縣","嘉北","嘉北","嘉義之北。"],

    ["新竹市","赤土崎","紅土台地","地處清代竹塹城東側台地邊坡，因表土富含氧化鐵、土色偏紅，且地勢略高如崎坂，故稱赤土崎，今為清華大學、交通大學一帶。","s","赤土崎在清代僅是竹塹城外的紅土台地聚落，日治時期更因地處邊陲，先後被闢為競馬場、靶場、高爾夫球場，甚至一度是新竹地區的公共墓地「雞蛋面義塚」所在，是墾地、墓地與後來校地三種身分交疊的特殊區域。太平洋戰爭末期，日本海軍在此設立第六燃料廠新竹合成部，戰後改由中國石油公司接手，成為台灣重要的煉油與化工研究重地。1955年，中美簽訂原子能和平用途合作協定，清華大學決定在台復校，原先於南港、新竹兩地間擇一設校，最終因新竹縣長朱盛淇積極爭取，加上中國石油公司提撥約四十公頃原屬日本海軍燃料廠的土地，清華便選定赤土崎作為新校址，日後又陸續增撥、收購土地，逐步擴展成今日清華園的規模。有「赤土崎人標」之稱的社會運動家黃旺成，正是誕生於這片紅土台地，讓赤土崎從單純的地形地名，累積出橫跨拓墾、殖民工業、學術與社會運動的多重歷史記憶。"],
    ["新竹市","湳雅","濕軟泥地","湳為閩南語濕軟泥地之意，此地早期地勢低窪多沼澤積水，故以「湳」為名，雅則為後來的近音雅化用字。","s","湳雅原字寫作「湳仔」，因地處頭前溪天然堤防背後的低窪濕地，長年容易積水氾濫、土地泥濘難行，因而得名，日治時期正式書寫為「湳雅」。這裡在清代是南北官道出竹塹城後的必經之地：無論是從金門厝或舊社渡口渡過頭前溪、北上前往艋舺的旅人商賈，都得行經湳雅這處通衢要道，也因此，清代官府旌表節孝烈婦、孝子的石碑坊，多選址立於此地示眾，例如儒士吳國步妻蘇氏的節孝坊、國學生李鍚金的孝子坊（後者現已遷至青草湖）皆曾豎立在湳雅一帶，成為地方教化的重要地標。如今湳雅雖已高度都市化，但這段因低窪濕地而發展成交通要道、進而成為官方表彰節孝場所的歷史，仍是新竹市北區地方史中相當獨特的一頁。"],
    ["新竹市","客雅","道卡斯客雅社","地名可能源自道卡斯族「客雅社」的社名譯音，流經此地的客雅溪即因此得名。","s","客雅地名的確切語源目前仍有討論空間，一般認為與流經當地的客雅溪有關，客雅溪發源於新竹縣寶山鄉，主要流域涵蓋寶山與新竹市，經雙溪匯流後流入青草湖，再蜿蜒穿越新竹市區、由北區進入香山，最終從十七公里海岸線出海，是王世傑當年開墾竹塹的重要根據地之一；有趣的是，這條溪流其實原名「隙仔溪」，「客雅」之名很可能是後來才附加於溪流與周邊聚落的稱呼。1920年，日本殖民政府將客雅庄與水田、苦苓腳、崙仔、樹林頭、湳雅、東勢、赤土崎、埔頂、柴梳山、金山面等十餘個街庄一併併入新竹街，客雅自此成為新竹市區向東南擴展的重要腹地，今日範圍橫跨北區、東區交界，涵蓋客雅里、中雅里、西雅里等多個里，是新竹市區人口稠密的住宅生活圈之一。"],
    ["新竹市","十八尖山","十八尖峰","因山稜連綿起伏，共有十八個尖峰而得名，日治時期閩闢為登山健行步道，現為新竹市著名的森林公園。","s","十八尖山地名的由來相當寫實：這座呈新月形、蜿蜒約七、八公里、環抱新竹市東南郊的丘陵，沿線果真數得出十八個山頭起伏，因而得名，最高處海拔僅131.79公尺，最低處約50公尺，坡度平緩，適合全民健行。日治時期，這片丘陵被規劃闢建為新竹地區的「森林公園」，成為當時市民休閒運動的重要去處，山徑沿途遍植花木，尤其以杜鵑花聞名，每年花季吸引大量賞花人潮。十八尖山山林間至今仍留有一座主祀觀音的「石觀音」，以及可俯瞰新竹市區的「介壽亭」，兩者都是登山健行途中的重要地標。如今十八尖山已是新竹市區保存最完整的自然綠帶，市政府每日清晨至上午八時實施車輛管制，讓這座因十八座山頭而得名的丘陵，持續扮演著新竹市民運動休閒的最佳去處。"],
    ["新竹市","暗街仔","棚架遮陰","清代竹塹城內店家為遮陽避雨，在狹窄街道上方搭建棚架，終日光線昏暗，故稱暗街仔，即今北門街一帶。","s","暗街仔其實是新竹市歷史最悠久的街道，堪稱「新竹第一街」：明永曆36年（1682年），泉州人王世傑入墾竹塹，選擇在這條位於今東前街36巷、寬不足兩公尺、長不到百公尺的窄巷一帶落腳，以此為中心向南北開墾，奠定了新竹城市發展的源頭。這條巷弄因是市集商家聚集的長廊，店家普遍搭建「不見天」的遮棚以利遮陽避雨、方便買賣交易，終年不見天日、光線昏暗，因而被稱為「暗街仔」，這種因商業騎樓遮蔽而得名的街道稱謂，在九份、北港、彰化鹿港等台灣其他老街區也曾出現過類似用法，並非新竹獨有。清代此地以農具、鐵器等民生用品交易為主，日治時期轉型以金銀樓、佛像雕刻聞名，至今巷內仍可見創立於日治時期的錦興金香行等老字號，是新竹市區保存至今、僅存的一小段「新竹第一街」歷史遺跡。"],
    ["台北市","三板橋","三座木板橋","昔日大安一帶因灌溉溝渠密布，居民搭建三座木板橋供人通行，因而得名，範圍約在今林森北路、中山北路一帶。","s","三板橋所在的範圍，大致對應今日台北市中山區林森北路、中山北路一帶，清代因灌溉水圳「大安支渠」流經，居民為了往來兩岸，在渠道上搭建三座簡易木板橋，這片區域因而被稱為「三板橋」。日治時期，這一帶隨都市計畫發展，一度是規模宏大的日人公共墓地「三板橋墓地」所在地，戰後隨著都市發展需要，墓地陸續遷葬、改建，原址周邊逐漸發展為林森公園與康樂公園，公園內至今仍保留林安泰古厝、蒙藏文化中心等具歷史意義的設施，見證這片土地從水圳木橋、日治墓園到現代都會公園的多重身分轉換。三板橋這個描述木橋的舊地名，如今已鮮少在日常生活中被提及，但仍偶爾出現在地方文史考據與老台北人的口述記憶之中。"],
    ["台北市","內湖庄","盆地積水如湖","因地勢四周略高、中央低窪，早期積水成湖，故稱內湖，為今內湖區地名由來。","s","「內湖庄」是內湖地區在清代至日治時期的正式行政區劃名稱，範圍大致涵蓋今日內湖區全境。清代這一帶因地勢低窪、四周丘陵環繞，早期排水不易而積水成湖，先民依此地形特徵稱之為內湖；漢人入墾後，主要沿基隆河沿岸的平坦河谷地帶發展聚落，並修築陂塘、水圳排除積水、闢為良田，內湖庄因而逐漸從沼澤濕地轉型為農業聚落，以茶葉、蔬果種植為主要產業。1920年，日本殖民政府推行地方行政改制，正式設立「內湖庄」，隸屬台北州七星郡管轄；戰後，內湖庄改制為內湖鄉，1968年隨台北市擴大行政區域而併入台北市，成為內湖區。這段從清代積水窪地、到日治行政區劃「內湖庄」、再到今日科技產業重鎮的演變過程，完整呈現了內湖地區三百年來的土地利用變遷史。"],
    ["新北市","二重埔","第二次開墾埔地","清代拓墾依開墾先後次序命名，此地為第二個開發的埔地，故稱二重埔，即今三重、蘆洲一帶。","s","二重埔的命名邏輯與三重埔、頭前埔完全相同：清代先民沿淡水河岸依開墾先後順序為新生埔地編號，最早開發的稱頭前埔，其後依序為二重埔、三重埔。隨著淡水河泥沙淤積、沙洲不斷向外擴展，登陸與開墾地點也隨之外移，二重埔便是在頭前埔之後、三重埔之前開發的一段埔地，大致位於今三重、蘆洲一帶。這種依次序命名的方式，反映了清代漢人沿河系統性拓墾的過程，類似邏輯也可見於新店的頭張、二張、三張等地名。如今二重埔已完全融入三重、蘆洲的都市發展範圍，但仍可從地方志與老地圖中，追溯這段先民一步步向淡水河沙洲拓墾前進的歷史軌跡。"],
    ["新北市","和尚洲","僧侶開墾沙洲","相傳清代有僧侶在此淡水河沙洲地開墾而得名和尚洲，即今蘆洲舊稱，日治時期因諧音改為蘆洲。","s","和尚洲是蘆洲眾多舊稱中流傳最廣的一個，據傳乾隆年間，僧人梅福向官方申請開墾這片淡水河沖積沙洲，並將其做為廟宇的香油錢田產，此後常有僧侶前來巡視、設置公館收取租穀，久而久之，這片沙洲便被稱為「和尚洲」；另一種說法則認為，此地原稱「河上洲」（形容聚落如坐落於河面之上），因「河上」與「和尚」台語發音相近而逐漸混用轉化為和尚洲。日治時期，殖民政府認為和尚洲之名不甚文雅，加上沙洲濕地本吸引大量白鷺鷥棲息，遂改稱較為風雅的「鷺洲」，戰後才依諧音定名為今日的「蘆洲」。從河上洲、和尚洲、鷺洲到蘆洲，這一連串地名演變完整呈現了同一塊沙洲地形，在不同時代被賦予不同意涵與雅化考量的過程。"],
    ["新北市","海山堡","清代行政區堡名","清代在板橋、土城、三峽一帶設置的行政區劃單位，因轄內多山林而得名海山堡。","s","海山堡是清代台灣行政區劃「堡里制」下的一個堡，範圍大致涵蓋今日板橋、土城、三峽及樹林部分地區，因轄內多丘陵山林地形而得名。清代台灣的地方行政區劃由上而下分為府、廳縣、堡（或里、鄉）、莊（街）等層級，「堡」是介於縣廳與基層聚落之間的區域單位，海山堡便是台北盆地西南側、大漢溪流域眾多堡之一。板橋、土城、三峽這幾個今日各自獨立發展的行政區，在清代同屬海山堡管轄，並曾一度由林本源家族的勢力範圍所涵蓋，彼此在水利、信仰、商業網絡上關係緊密，例如枋橋城、三角湧街等市街的興起，都與海山堡整體的拓墾開發脈絡息息相關。隨著日治時期地方制度改革，堡里制逐漸被街庄制取代，「海山」之名雖不再作為正式行政區劃使用，卻仍留存於海山高中、海山煤礦等地方機構與設施名稱中，成為追溯這段清代區域治理歷史的線索。"],
    ["桃園市","桃仔園","遍植桃樹","相傳清初移民在此廣植桃樹成林，花開時節景色動人，因而得名桃仔園，後簡稱桃園。","s","「桃仔園」是桃園地名演變過程中最廣為人知的一個階段：相傳清乾隆年間，墾首薛啟隆率眾拓墾龜山、八德一帶時，在這片新墾土地上大量栽植桃樹，每逢春季花開時節，滿山遍野桃花盛開、如雲似霞，景色美不勝收，因而讓當地人以「桃仔園」稱呼這片美麗的墾地，這也是台灣少數以花卉景觀直接入名、而非依防禦工事、族群或地形命名的特殊案例。乾隆39年（1774年）《續修臺灣府志》中已可見「桃仔園莊」的正式記載，可見這個充滿詩意的地名，至遲在18世紀中葉便已廣為流傳。光緒14年，官方文書進一步簡化為「桃園」，這個因桃花美景而生的地名，最終演變成今日桃園市、桃園區的正式名稱，也讓「桃園」成為全台唯一以花卉命名、且沿用至今的直轄市名稱。"],
    ["桃園市","大嵙崁","泰雅語大水","大溪舊稱，源自泰雅族語意指「大水」，因大漢溪流經此地水勢湍急而得名。","s","「大嵙崁」是大溪地名演變史上維持時間最久、也最廣為人知的一個階段。這個名稱源自泰雅族語，意指「大水」，反映大嵙崁溪（今大漢溪）流經此地時水勢湍急、聲勢浩大的特徵。清末，劉銘傳推行「開山撫番」政策時，選擇在大嵙崁設立撫墾局，作為漢人與泰雅族交涉、開發山地資源的重要據點，當時大嵙崁因是大漢溪航運的終點，來自山區的樟腦、茶葉皆須經此地轉運至艋舺、大稻埕，商船往來絡繹不絕，市街盛極一時，孕育出今日仍完整保存的大溪老街巴洛克式牌樓立面。日治時期，這個名稱簡化為今日通行的「大溪」，但「大嵙崁」之名至今仍常見於地方文史資料、老字號商行招牌，以及大嵙崁溪這個大漢溪的舊稱之中，是認識大溪河運貿易全盛時期歷史的重要關鍵詞。"],
    ["桃園市","南崁","南崁社譯音","地名源自平埔族凱達格蘭族「南崁社」譯音，為桃園最早開發地區之一。","s","南崁其實是整個桃園地區開發史的起點，其知名度與歷史地位甚至超越了行政區劃上管轄它的蘆竹區本身。這個地名源自平埔族凱達格蘭族「南崁社」的社名音譯，是清代漢人進入桃園台地拓墾前，當地原住民的主要聚居地。由於南崁地處南崁溪出海口附近，是早期由海路進入台北盆地、桃園台地的重要登陸據點與交通門戶，漢人移民多由此登岸後再向內陸擴散開墾，因此南崁的漢人開發時間，比桃園、中壢等內陸地區都要來得早。清代南崁因扼守海運要道，一度發展成頗具規模的港口市街，直到河口逐漸淤積、鐵路與公路等陸路交通興起後，南崁的商業機能才逐漸被桃園市區取代。如今南崁因鄰近桃園國際機場與中山高速公路交流道，加上大型購物商場的進駐，已從清代的海運門戶，轉型為桃園市重要的商業與交通樞紐。"],
    ["桃園市","龍岡","滇緬移民聚落","因國民政府時期滇緬地區撤退來台的軍民在此建立眷村而聞名，形成特殊的雲南、緬甸文化聚落。","s","龍岡地名的近代知名度，主要來自一段特殊的移民歷史：1950年代，國共內戰失利後，滯留在雲南、緬甸邊境一帶的國民政府軍隊（俗稱「滇緬孤軍」）分批撤退來台，政府將其中一部分軍民安置在平鎮龍岡一帶，設立忠貞新村等眷村聚落。這些來自雲南、緬甸的軍民，將家鄉的飲食、信仰與生活習慣一併帶入龍岡，逐漸發展出全台獨樹一格的雲南、緬甸文化聚落，忠貞市場周邊的米干、大薄片、椒麻雞等雲南料理，以及潑水節等特殊民俗活動，都是龍岡最具代表性的文化資產。龍岡因鄰近中壢、平鎮交界，加上眷村改建與都市更新的推動，如今雖已從早期克難的眷村聚落轉型為現代化社區，但每逢潑水節或忠貞市場的雲南美食小吃，仍持續向外界訴說著這段跨越國界、落地生根的移民故事。"],
    ["桃園市","三坑仔","三條坑溝匯流","因地形有三條山坑溝流匯集於此而得名，即今龍潭三坑老街一帶，昔日為大漢溪河運貨物集散地。","s","三坑仔地名由來，源自當地三條坑溝匯流的地形特徵：鴨母坑、火劫尾坑與蔗部坑三條山澗坑溝，在此匯入大漢溪畔的河階台地，因而得名「三坑仔」。清代，三坑仔因地處大漢溪水運的重要據點，成為龍潭、關西一帶山區物產運往下游艋舺、大稻埕的集散轉運站，往來船隻、挑夫絡繹不絕，市街因而繁榮一時，形成今日仍保存古樸閩客混合建築風貌的「三坑老街」，老街上的黑白洗（青錢第洗衣池）、永福宮等古蹟，至今仍是了解這段河運貿易歷史的重要見證。隨著大漢溪淤積、鐵路與公路等陸路運輸系統興起，三坑仔的河港機能逐漸沒落，一度歸於平靜，直到近年因老街保存與大漢溪畔的自行車道開發，才重新成為桃園市龍潭區熱門的懷舊觀光景點。"],
    ["新竹縣","鹹菜甕","醃製鹹菜","關西舊稱，相傳因地形似甕，且當地居民多醃製鹹菜維生，故稱鹹菜甕，日治時期取諧音雅化為關西。","s","「鹹菜甕」是關西地名演變史上維持最久、也最具代表性的一個階段，這個充滿生活氣息的名稱，直接反映了當地客家族群的傳統產業與飲食文化：清代此地客家先民擅長將盛產過剩的芥菜（鹹菜）醃製於陶甕中保存，製成方便攜帶、行銷各地的醃漬食品，四處可見的醃菜陶甕成為地方一大特色，因而得名「鹹菜甕」；也有一說指出，地形本身狀似甕口，加上盛產鹹菜，兩相結合而成此名。1920年，日本殖民政府推行地方行政改制，發現「鹹菜甕」的客語發音與日語地名「關西」的發音意外相近，索性直接借用日本本州「關西」之名取代，這種純粹因語音巧合而更換地名的案例，在台灣地名史上相當罕見。如今關西鎮的仙草、柿餅等醃漬與加工農產業依然興盛，某種程度延續了「鹹菜甕」時代流傳下來的醃漬飲食文化根基。"],
    ["苗栗縣","貓貍","貓裏社譯音","苗栗舊稱，源自道卡斯族「貓裏社」譯音，清代設縣治後取其諧音雅化為苗栗。","s","「貓貍」是苗栗舊稱眾多寫法中，近年在地方最具爭議、卻也最深植人心的一個版本。清代文獻中，「貓裏」「貓里」「貓裡」「貓貍」等寫法長期混用並存，並無統一標準；1889年苗栗設縣時，官方雖採近音的「苗栗」二字，但民間口語與部分史料仍持續沿用舊稱。2010年代，苗栗縣政府曾以縣政顧問會議提案，公告將官方統一使用的舊地名版本定為「貓裏」，卻引來苗栗市地方人士的反對聲浪：反對者主張，前任苗栗市長當年廣徵民意後，是依據縣定古蹟「賴氏節孝坊」上的刻字，選定「貓貍」作為統一寫法，且這個版本早已在地方民眾心中建立共識與情感連結，貿然更改恐失去原有意義。這場舊地名寫法之爭，讓「貓貍」二字從單純的音譯用字，意外成為地方文史認同與官方治理之間拉鋸的鮮活案例。"],
    ["苗栗縣","蓬山","蓬山八社","苑裡舊稱，因附近平埔族聚落合稱「蓬山八社」而得名。","s","「蓬山」是苗栗苑裡、通霄一帶平埔族部落聯盟的統稱，清康熙、雍正年間的官方文獻最初稱其為「崩山八社」或「崩山」，乾隆以後才改稱較為文雅的「蓬山八社」或「蓬山」。這八個部落分別是大甲東社、大甲西社（德化社）、宛里社（苑裡社）、房里社、南日社（日南社）、雙寮社（擺陳社）、貓盂社，以及吞霄社，範圍橫跨今日苗栗苑裡、通霄與台中大甲、大安、外埔一帶，是台灣中部平埔族道卡斯族的重要分布區域。1670年，鄭氏部將劉國軒率軍墾殖蓬山八社與後壠五社，是漢人有計畫進入這片區域拓墾的開端；此後，隨著漢人移民日增，蓬山八社的族人逐漸漢化或向內山遷移，但各社的部分社名仍以地名的形式留存至今，例如苑裡鎮的貓盂、房裡等地，都是蓬山八社歷史的直接見證，讓「蓬山」這個統稱，成為追溯苗栗、台中沿海一帶平埔族拓墾史的重要關鍵詞。"],
    ["台中市","大甲東","大甲溪東側聚落","大甲區東側的聚落古地名，因位於大甲溪東岸而得名，清代已是重要農墾聚落。","s","大甲東其實是道卡斯族「大甲東社」的傳統領域，與大甲西社同屬蓬山八社成員，兩社以境內地標「鐵砧山」為界劃分：山以東屬大甲東社，山以西則屬大甲西社。1731年（雍正9年）大甲西社發動反抗清廷的武裝行動（史稱大甲西社事件或林武力事件）時，大甲東社因選擇配合官方、未參與叛亂，事件平定後，大甲西社遭清廷強迫改名為「德化社」以示教化懲戒，大甲東社則因立場不同而得以保留原有社名，成為蓬山八社中少數維持原名的部落，這段選邊站的歷史际遇差異，也讓大甲東這個地名意外承載了清代原住民政策中「順我者存、逆我者改」的政治色彩。如今大甲東因鄰近國道3號大甲交流道，加上緊臨鐵砧山風景區，已從清代的道卡斯族部落，發展成大甲區東側重要的農業與交通節點。"],
    ["台中市","大湳","低窪濕地","大雅區舊稱，湳為閩南語濕軟泥地之意，早期此地地勢低窪多濕地，故稱大湳。","s","大湳是大雅區境內清代便已存在的舊聚落名稱，與大雅本身舊稱「壩仔」同樣反映了這片大甲溪沖積扇地帶早期地勢低窪、排水不易的地形特徵：「湳」在閩南語中意指濕軟泥濘的低窪地，先民依此特徵稱這片區域為「大湳」，與台北八德區、新北蘆洲區等地同樣出現的「湳」系列地名，屬於台灣拓墾史上依地形特徵命名的普遍案例之一。大雅區境內因大甲溪長期沖積，土壤肥沃但排水條件不一，因而同時存在「壩仔」（河邊草埔）與「大湳」（低窪濕地）兩種不同地形特徵所衍生的舊地名，共同勾勒出這片沖積平原早期開墾的地貌樣態。如今大湳一帶因鄰近台中國際機場與大雅都市計畫區的開發，已從清代濕軟難行的低窪農地，轉型為大雅區重要的住宅與商業生活圈。"],
    ["彰化縣","東螺","東螺社譯音","北斗一帶舊稱，源自平埔族巴布薩族「東螺社」譯音，清代因舊街遭洪水沖毀而遷至今北斗鎮重建。","s","東螺社是清代彰化平原巴布薩族的重要聚落之一，清初文獻記載其活動範圍以舊濁水溪（今東螺溪）沿岸為中心，是漢人尚未大規模入墾前，這片區域最主要的原住民部落。東螺社與周邊的眉裡社、二林社等同屬巴布薩族分支，各社之間雖語言文化相近，卻各自擁有獨立的頭目與領域範圍。隨著漢人移民自18世紀起大量湧入東螺溪流域拓墾，東螺社的傳統領域逐漸被侵占，族人被迫與漢人雜居或往內山遷徙，其漢化程度也隨之加深。道光元年（1821年）東螺街遭洪水沖毀後，倖存居民遷至今北斗鎮另闢新街，東螺社的社名雖仍保留在地名之中，其原有的部落組織與文化卻已隨著這次遷徙而逐漸消散，僅留下「東螺」這個詞彙，供後人追溯這片土地上曾經活躍的平埔族歷史。"],
    ["彰化縣","枋橋頭","設隘枋橋","社頭鄉舊稱之一，相傳清代此地設有木造隘門枋橋以防禦盜匪，因而得名。","s","枋橋頭是社頭鄉境內另一個與「社頭」並存的舊地名，兩者分屬同一鄉鎮不同聚落的歷史稱呼。清代社頭一帶因鄰近八卦山區，是漢人拓墾前緣與山區盜匪、原住民出草風險較高的地帶，先民為保護聚落與往來商旅安全，在交通要道上設置木造隘門「枋橋」作為防禦與警戒據點，這座枋橋所在的聚落因而得名「枋橋頭」，與新北市板橋區舊稱「枋橋」（因架設木板橋而得名）雖字面相似，命名緣由卻截然不同——板橋的枋橋指的是橋梁，社頭枋橋頭的枋橋則是防禦性隘門。枋橋頭與社頭鄉境內其他因平埔族「社頭」（大武郡社頭目居所）而得名的區域相互並存，共同勾勒出社頭鄉在清代同時面對族群防禦與拓墾開發的雙重歷史脈絡，如今枋橋頭一帶已完全融入社頭鄉的市街發展範圍。"],
    ["南投縣","埔里社","眉溪流域平埔社","埔里舊稱，因清代眉溪流域聚居多個平埔族社群，統稱埔里社，後成為漢人拓墾入山的重要據點。","s","「埔里社」一詞在清代文獻中，其實兼指狹義的邵族「Poli社」本身，以及廣義涵蓋整個埔里盆地平埔族匯聚生活圈的行政區劃名稱，光緒元年（1875年）清廷在此設置「埔里社廳」，正是取後者的廣義用法，作為開山撫番政策下管理這片內山地帶的行政機構。埔里社廳的設立，標誌著埔里從原本邵族、泰雅族與陸續遷入的西部平埔族群共同生活的邊區地帶，正式納入清朝有效統治範圍的關鍵轉折點；官府同時在此築起土製城垣，稱為「大埔城」，作為行政中心的防禦屏障。日治時期，「埔里社」簡化為「埔里」，沿用至今。如今埔里鎮境內的地名如愛蘭（烏牛欄）、房里等，仍持續訴說著這段清代眾多平埔族社群因西部漢人拓墾壓力而遷徙匯聚於埔里盆地、形成獨特多元族群地景的歷史。"],
    ["南投縣","東埔","布農族溫泉部落","信義鄉東埔村一帶，為布農族傳統部落所在地，因鄰近溫泉、風景秀麗而聞名。","s","東埔位於南投縣信義鄉，是布農族傳統部落所在地，地處陳有蘭溪上游河谷地帶，因鄰近溫泉資源與壯麗山景，自日治時期以來便是知名的高山溫泉勝地，泉質屬弱鹼性碳酸氫鈉泉，是玉山國家公園西側入口的重要中繼站。境內的東埔吊橋橫跨八掌溪河谷，全長約200公尺，是台灣目前最高的吊橋之一，橋面採鏤空木質設計，可俯瞰橋下128公尺深的溪谷雲霧景致，吊橋入口的石雕山豬造型，也呼應了布農族傳統的狩獵文化意象。東埔部落至今仍保留布農族的祭儀傳統與八部合音（Pasibutbut）等珍貴無形文化資產，是南投縣信義鄉境內布農族文化與生態觀光資源兼具的代表性部落，也是攀登台灣最高峰玉山最主要的登山口之一。"],
    ["花蓮縣","奇萊","奇萊平原舊稱","花蓮舊稱之一，源自阿美族語譯音，泛指花蓮溪出海口一帶的平原地帶，今奇萊山之名亦源於此。","s"],
    ["花蓮縣","薄薄社","阿美族部落","吉安鄉舊稱，因當地為阿美族「薄薄社」（Cikasuan）聚落所在地而得名。","s"],
    ["宜蘭縣","蛤仔難","噶瑪蘭族譯音","宜蘭舊稱之一，為清代漢人對噶瑪蘭族自稱的音譯用字，後改以「噶瑪蘭」為正式譯名。","s"],
    ["宜蘭縣","噶瑪蘭","平原之人","宜蘭舊稱，源自當地原住民自稱「Kavalan」，意為「平原的人」，清嘉慶年間設噶瑪蘭廳。","s"],
    ["屏東縣","六堆","客家六聚落聯防","清代六堆客家先民為自保而組成的六個聯防區域（前、後、左、右、中、先鋒堆），為屏東平原重要的客家文化區。","s"],
    ["高雄市","五塊厝","五戶人家開墾","相傳清代最初僅有五戶人家在此開墾定居，因而得名，即今高雄市三民區一帶。","s"],
    ["嘉義市","桃仔尾","嘉義舊街地名","清代嘉義城郊的舊街名，相傳因街尾一帶早期遍植桃樹而得名。","s"],
    ["嘉義縣","水汴頭","水圳分水閘","民雄鄉一帶舊地名，因當地灌溉水圳設有分水閘門（水汴）調節水量而得名。","s"],
    ["金門縣","浯洲","牡蠣沙洲","金門舊稱，因島上盛產牡蠣（蚵）且多沙洲地形，古稱浯洲，明代因軍事地位重要改稱金門。","s"],
    ["連江縣","馬祖","媽祖顯靈傳說","相傳媽祖曾在南竿島顯靈拯救船難漁民，鄉民感念建廟奉祀，島嶼因而得名馬祖（媽祖音轉）。","s"],
    // --- 【擴充：北橫．深山部落 深度考據】 ---
    ["桃園市","巴陵","Balung 巨木","巴陵（泰雅語 Balung，意為巨木）位於北橫公路中點，依海拔高低分為上、中、下巴陵，是知名的水蜜桃產地。","s","巴陵地名源自泰雅族語「Balung」，意指高大巨木。相傳早年泰雅族人沿著大漢溪上游遷徙尋找適合定居的河階地，來到今日中巴陵一帶時，見到倒臥於地的巨大枯木，便以此為地名，記錄下這片山林曾有巨木參天的印象。日治時期文獻中則出現巴崚、巴稜、巴壟、馬崙等不同譯寫，皆是同一泰雅語詞的音譯變體。巴陵位於北部橫貫公路的中點，因地勢由高而低分為上巴陵、中巴陵與下巴陵三段，各自呈現不同風貌：上巴陵鄰近拉拉山，保留大片紅檜與扁柏巨木群，其中1973年由學者發現的神木群，讓巴陵聲名大噪；中巴陵一帶可通往嘎拉賀與爺亨溫泉；下巴陵則有橫跨溪谷的吊橋景觀，橋下即是三光溪匯入大漢溪之處，形成「三龜戲珠」的溪石奇景。如今巴陵也是北台灣重要的溫帶水果產地，每年四、五月水蜜桃花開滿山，暑假則是採收旺季，吸引許多遊客上山賞遊採果，讓這個曾經只是描述巨木倒地的泰雅語地名，成為北橫公路旅遊的重要地標。"],
    ["桃園市","爺亨","Zihing 陽光難照之地","爺亨（泰雅語 Zihing／Ehen）因地形東、南兩側環山，每日上午陽光難以照入，故以此為名，今以梯田與溫泉聞名。","s","爺亨部落位於桃園市復興區三光里，緊鄰玉峰溪與馬里闊灣溪，擁有復興區僅次於角板山的第二大河階台地。關於爺亨地名的由來，目前流傳最廣的說法是源自泰雅語「Zihing」（或寫作Ehen），意指陽光不易照到之地，因為部落東、南兩側都被高聳山頭圍繞，每天要等到接近中午，陽光才會照進谷地，加上森林茂密、雨霧頻繁，此地終年顯得陰涼潮溼。此外還流傳另外兩種說法：一說爺亨意指「溪邊的台地」，描述其地形特徵；另一說則認為當地氣候濕冷，早年溪邊容易滋生水蛭，因此以泰雅語稱水蛭的詞彙音轉而來。儘管擁有廣闊平坦的河階地形，但爺亨溪水礦物質含量偏高，早年不利飲用與大規模農耕，聚落規模因此一直不大，主要部落反而發展在對岸向陽的武道能敢一帶。如今爺亨善用山泉水引灌，開闢出全區最整齊的梯田景觀，曾有「後山穀倉」美稱；附近的巴陵橋溫泉在1997年重新出露後，也以「爺亨溫泉」之名對外開放，成為北橫公路上兼具梯田美景與泡湯體驗的知名景點。"],
    ["桃園市","合流","Hbun-sinqumi 溪流匯口","合流（泰雅語 Hbun-sinqumi）位於復興區羅浮里，因坐落於溪流匯合處而得名。","s","合流部落隸屬桃園市復興區羅浮里，泰雅語稱作「Hbun-sinqumi」，「Hbun」在泰雅語中意指溪流匯合的出口或匯流處，合流之名直接描述了當地位於數條山澗匯入大漢溪支流附近的地形特徵，是台灣山區聚落常見的一種依地形命名方式。根據部落耆老口述的遷徙史，泰雅族祖先自更古老的發源地沿河谷向北遷徙時，曾有家族一支循著三光溪河谷南下，行經此處的溪流匯口而在此暫留、發展成小型聚落，因而留下這個描述性地名。如今合流仍是羅浮里所轄的一個泰雅族部落，由於鄰近北橫公路與大漢溪河谷，加上仍保有相對完整的山林環境，近年發展出「部落獵人學校」等體驗活動，帶領遊客學習泰雅族傳統的狩獵、辨識植物與野外求生知識，讓旅人在認識地名由來的同時，也能親身感受泰雅族與這片溪流山林共存的生活智慧。"],
    ["桃園市","羅浮","雅邦 Kinyopan","羅浮舊稱雅邦（Kinyopan），原為拉號社所屬的一個小社，日治時期整併聚落後逐漸發展成今日的羅浮部落。","s","羅浮位於桃園市復興區羅浮里，地處大漢溪由北轉西流的河階地形上，海拔約250至300公尺。此地原屬「拉號社」（Rahaw，泰雅語意為樹木叢密）的傳統領域，拉號社在大漢溪左岸山腹間又分為雅邦（Keyopan）、卡納、哈卡灣、卡馬告、卡巴庫灣等五個小社，村落分布於今日溪口台與羅浮之間的緩坡地帶。日治時期，日本當局進入拉號社後設置警察駐在所，並在拉號社下方興建水圳、分配梯田，未能分得田地的族人則遷往雅邦另立聚落；其後日方為便於管理，又將駐在所遷移至雅邦，另在溪口設置新的駐在所。台灣光復後，行政區域重新調整，雅邦一帶便改稱為「羅浮」，沿用至今。如今羅浮里是北橫公路沿線重要的聚落據點，除了保留泰雅族部落文化與紅色的羅浮橋、藍色的復興橋等地標景觀，近年更因地下蘊藏豐富的碳酸氫鈉溫泉（俗稱美人湯）而開發出羅浮溫泉與泰雅故事公園，成為結合部落文化體驗與溫泉遊憩的觀光景點。"],
    ["桃園市","小烏來","Ulay 溫泉","小烏來（泰雅語 Ulay，意為溫泉）因位於宇內溪支流會合處，故以此為名，與新北市烏來同源。","s","小烏來位於桃園市復興區義盛里，「烏來」一詞源自泰雅族語「Ulay」，意指溫泉，同樣的語詞也是新北市知名溫泉鄉烏來地名的由來。流經義盛里的這條溪流，泰雅族人原本同樣稱為Ulay，但為了與新北的烏來作出區別，後來便依台語音近改寫為「宇內溪」。宇內溪南、北兩條支流會合之處，正是泰雅族部落Rahu（下宇內）所在的下游河谷地帶，這一帶因此被稱為「小烏來」，以別於規模較大、開發較早的烏來地區。此地因斷層地形發達，形成落差約50公尺、氣勢磅礡的小烏來瀑布，以及風動石、龍鳳瀑布等特殊景觀，加上近年興建的透明天空步道，讓遊客能夠站在瀑布上方70公尺高處俯瞰溪谷美景，成為北橫公路上人氣極高的景點之一。鄰近的義興部落與橫跨大漢溪的義興吊橋，也因電影《賽德克·巴萊》在此取景而聲名大噪，讓小烏來從一個描述溫泉溪流的泰雅語地名，逐漸發展為結合自然景觀、部落文化與影視觀光的複合式旅遊勝地。"],
    ["桃園市","義興","Gihin 陽光普照","義興（泰雅語 Gihin，意為陽光）相傳因先民見此地陽光普照，認為子孫必能興旺，故以此為名。","s","義興部落位於桃園市復興區義盛里，地處大漢溪中游右岸的河階與斜坡地，與對岸的高坡部落隔溪相望。義興的泰雅語舊稱為「Gihin」，也曾寫作宜亨，據部落口傳，原意與陽光有關：早年雪霧鬧社的族人遷移至此，見這片台地終日陽光普照，認為若在此定居，子孫後代必能興旺繁盛，因而以Gihin為名，後來的漢字譯寫便取其吉祥之意定為「義興」。另有說法認為Gihin可能與當地山坡地形、某種草名，或是水蛭有關，但確切語源已難以考證。義興因灌溉水圳「義興一圳」「義興二圳」的開闢而擁有較多水田，山坡地則盛產竹木與香菇；大漢溪上游興建攔砂壩後，也利用水位落差在此設置義興電廠。橫跨溪谷、長約200公尺的義興吊橋，原本只是引水灌溉用的水管橋，2013年整修後開放通行，因外型優美且曾作為電影《賽德克·巴萊》彩虹橋一幕的拍攝場景而聲名大噪，如今已成為小烏來風景區周邊最具人氣的免費景點之一。"],

<script>
// ================= 音效管理員 (SoundManager) =================
const SoundMgr = {
    enabled: true,
    bgm: new Audio('https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112778.mp3'),
    ctx: null,

    init: function() {
        this.bgm.loop = true;
        this.bgm.volume = 0.3;
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        try { this.ctx = new AudioContext(); } catch(e) {}
    },

    setEnabled: function(val) {
        this.enabled = val;
        const btn = document.getElementById('audio-btn');
        if (this.enabled) {
            btn.innerHTML = '🔊 音樂';
            btn.classList.remove('muted');
            this.bgm.play().catch(()=>{});
        } else {
            btn.innerHTML = '🔇 音樂';
            btn.classList.add('muted');
            this.bgm.pause();
        }
        const t = document.getElementById('sound-toggle');
        if (t) t.checked = this.enabled;
    },

    toggle: function() { this.setEnabled(!this.enabled); },

    play: function(type) {
        if(!this.enabled || !this.ctx) return;
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        const now = this.ctx.currentTime;

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.setValueAtTime(880, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'flip') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        }
    }
};

// ================= 設定管理 (Settings) =================
const Settings = {
    netImg: false,
    load() {
        try {
            const s = JSON.parse(localStorage.getItem('twPlaceSettings') || '{}');
            this.netImg = !!s.netImg;
        } catch(e) { this.netImg = false; }
    },
    save() {
        localStorage.setItem('twPlaceSettings', JSON.stringify({ netImg: this.netImg }));
    }
};

// ================= 學習進度 (Stats) =================
const Stats = {
    data: {},
    load() {
        try { this.data = JSON.parse(localStorage.getItem('twPlaceStats') || '{}'); }
        catch(e) { this.data = {}; }
    },
    save() { localStorage.setItem('twPlaceStats', JSON.stringify(this.data)); },
    status(id) { return this.data[id] || 'unseen'; },
    mark(id, correct) { this.data[id] = correct ? 'correct' : 'wrong'; this.save(); },
    reset() { this.data = {}; this.save(); }
};

// ================= 考試範圍 (ExamScope) =================
const ExamScope = {
    counties: null, // null = 全部
    load() {
        try {
            const s = localStorage.getItem('twExamScope');
            this.counties = s ? new Set(JSON.parse(s)) : null;
        } catch(e) { this.counties = null; }
    },
    save() { localStorage.setItem('twExamScope', JSON.stringify(this.counties ? [...this.counties] : null)); },
    has(c) { return !this.counties || this.counties.has(c); },
    isAll() { return !this.counties || this.counties.size === allCounties.length; }
};

let allCounties = [];
let dailyItem;
let qItem;

// ================= 圖片載入 (含離線插圖 / 網路風景照 / 地圖位置圖) =================
function hashColor(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
    const hue = Math.abs(h) % 360;
    return [`hsl(${hue},55%,42%)`, `hsl(${(hue+40)%360},60%,58%)`];
}

function placeholderHTML(item) {
    const [c1, c2] = hashColor(item.c + item.n);
    return `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg, ${c1}, ${c2});color:#fff;">
        <div style="font-size:2.6rem;">📍</div>
        <div style="font-weight:bold;margin-top:8px;padding:0 10px;text-align:center;">${item.c} ${item.n}</div>
        <div style="font-size:0.7rem;opacity:0.8;margin-top:4px;">(單機模式)</div>
    </div>`;
}

function loadingHTML() {
    return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#999;background:#f2f2f2;">載入中...</div>`;
}

// 嘗試抓取維基百科縮圖 (風景照)
async function fetchWikiImg(n, c) {
    const kws = [`${c}${n}`, n, c];
    for (let k of kws) {
        try {
            const url = `https://zh.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(k)}&prop=pageimages&format=json&pithumbsize=500&origin=*`;
            const res = await fetch(url);
            const data = await res.json();
            const pages = data.query.pages;
            const pageId = Object.keys(pages)[0];
            if (pageId !== "-1" && pages[pageId].thumbnail) return pages[pageId].thumbnail.source;
        } catch(e) {}
    }
    return null;
}

// 嘗試抓取地圖位置圖 (Nominatim 地理編碼 + 靜態地圖)
async function fetchMapImg(n, c) {
    try {
        const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(c + n)}`;
        const res = await fetch(geoUrl, { headers: { 'Accept-Language': 'zh-TW' } });
        const arr = await res.json();
        if (arr && arr[0]) {
            const { lat, lon } = arr[0];
            return `https://staticmap.openstreetmap.de/staticmap.php?center=${lat},${lon}&zoom=13&size=600x400&markers=${lat},${lon},red-pushpin`;
        }
    } catch(e) {}
    return null;
}

// 依設定回傳圖片網址；若設定關閉或抓取失敗則回傳 null (由呼叫端顯示離線插圖)
async function getImgUrl(item) {
    if (!Settings.netImg) return null;
    let url = await fetchWikiImg(item.n, item.c);
    if (!url) url = await fetchMapImg(item.n, item.c);
    return url;
}

// 將圖片放入指定容器；containerId 為 <div> 容器
async function renderImageBox(containerId, item) {
    const box = document.getElementById(containerId);
    if (!box) return;
    if (!Settings.netImg) {
        box.innerHTML = placeholderHTML(item);
        return;
    }
    box.innerHTML = loadingHTML();
    const url = await getImgUrl(item);
    if (url) {
        const img = document.createElement('img');
        img.alt = item.c + item.n;
        img.onerror = () => { box.innerHTML = placeholderHTML(item); };
        img.src = url;
        box.innerHTML = '';
        box.appendChild(img);
    } else {
        box.innerHTML = placeholderHTML(item);
    }
}

// ================= 初始化 =================
function init() {
    SoundMgr.init();
    Settings.load();
    Stats.load();
    ExamScope.load();

    if (typeof placesData === 'undefined') {
        alert("錯誤：找不到地名資料庫！");
        return;
    }

    allCounties = [...new Set(placesData.map(x => x.c))];

    document.getElementById('total-count').innerText = placesData.length;
    document.getElementById('settings-total').innerText = placesData.length;
    document.getElementById('net-img-toggle').checked = Settings.netImg;
    document.getElementById('sound-toggle').checked = SoundMgr.enabled;

    // 每日一抽
    const date = new Date();
    const seed = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
    dailyItem = placesData[seed % placesData.length];
    document.getElementById('d-fullname').innerText = dailyItem.c + " " + dailyItem.n;
    document.getElementById('d-old').innerText = labelText(dailyItem) + "：" + dailyItem.o;
    renderImageBox('d-img-box', dailyItem);

    // 列表篩選
    const select = document.getElementById('county-filter');
    allCounties.forEach(c => { select.innerHTML += `<option value="${c}">${c}</option>`; });
    renderList();

    updateScopeInfo();
    initQuiz();

    document.body.addEventListener('click', () => {
        if (SoundMgr.enabled && SoundMgr.bgm.paused) SoundMgr.bgm.play().catch(() => {});
    }, { once: true });
}

function labelText(item) { return item.s ? "由來關鍵字" : "古稱"; }
function questionText(item) { return item.s ? "這個地名的由來線索是？" : "請問這個地方的古地名是？"; }

// 翻牌
function flipCard() {
    const container = document.querySelector('.daily-card-container');
    const isFlipped = container.classList.contains('flipped');
    if (!isFlipped) SoundMgr.play('flip');
    container.classList.toggle('flipped');
}

// ================= 測驗邏輯 =================
function getPool() {
    return placesData.filter(p => ExamScope.has(p.c));
}

function pickNextItem() {
    const pool = getPool();
    if (pool.length === 0) return null;
    const unseen = pool.filter(p => Stats.status(p.id) === 'unseen');
    const wrong = pool.filter(p => Stats.status(p.id) === 'wrong');
    const correct = pool.filter(p => Stats.status(p.id) === 'correct');
    const arr = unseen.length ? unseen : (wrong.length ? wrong : correct);
    if (!arr.length) return null;
    return arr[Math.floor(Math.random() * arr.length)];
}

async function initQuiz() {
    const pool = getPool();
    const content = document.getElementById('quiz-content');
    if (pool.length === 0) {
        content.innerHTML = `<div class="empty-pool">目前考試範圍內沒有題目，請重新設定考試範圍。</div>`;
        return;
    }
    qItem = pickNextItem();
    if (!qItem) {
        content.innerHTML = `<div class="empty-pool">此範圍題目已全部作答完畢！</div>`;
        return;
    }

    content.innerHTML = `
        <div class="quiz-box">
            <div class="quiz-img-box" id="q-img-box"></div>
            <h3 style="color:#666; margin:0 0 10px 0;" id="q-label"></h3>
            <h1 id="q-question" style="font-size:2rem; margin:10px 0; color:var(--primary);"></h1>
            <div id="q-options" class="quiz-options"></div>
            <div id="q-feedback" style="margin-top:15px; text-align:left; display:none; background:#f9f9f9; padding:15px; border-radius:8px;"></div>
            <button id="q-next-btn" style="margin-top:20px; padding:10px 30px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:1rem;">下一題</button>
        </div>`;
    document.getElementById('q-next-btn').onclick = () => { SoundMgr.play('click'); initQuiz(); };

    document.getElementById('q-label').innerText = questionText(qItem);
    document.getElementById('q-question').innerHTML = qItem.c + " " + qItem.n + (qItem.s ? ' <span class="badge-sub">小地名</span>' : '');
    renderImageBox('q-img-box', qItem);

    let opts = [qItem];
    let guard = 0;
    while (opts.length < 4 && guard < 500) {
        guard++;
        const r = placesData[Math.floor(Math.random() * placesData.length)];
        if (!opts.includes(r) && r.o !== qItem.o) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);

    document.getElementById('q-options').innerHTML = opts.map(o =>
        `<button class="q-btn" data-ans="${encodeURIComponent(o.o)}">${o.o}</button>`
    ).join('');
    document.querySelectorAll('.q-btn').forEach(btn => {
        btn.onclick = () => checkQuiz(btn, decodeURIComponent(btn.dataset.ans));
    });
}

function checkQuiz(btn, ans) {
    const btns = document.querySelectorAll('.q-btn');
    if (btn.disabled) return;
    btns.forEach(b => b.disabled = true);
    const fb = document.getElementById('q-feedback');
    fb.style.display = 'block';

    const isCorrect = ans === qItem.o;
    Stats.mark(qItem.id, isCorrect);
    const info = analyzeItem(qItem);

    let head;
    if (isCorrect) {
        SoundMgr.play('correct');
        btn.classList.add('correct');
        head = `<b style="color:green">✅ 答對了！</b>`;
    } else {
        SoundMgr.play('wrong');
        btn.classList.add('wrong');
        btns.forEach(b => { if (decodeURIComponent(b.dataset.ans) === qItem.o) b.classList.add('correct'); });
        head = `<b style="color:red">❌ 答錯了，正確是 ${qItem.o}</b>`;
    }
    const tag = info.researched ? '<div style="font-size:0.72rem;color:#8d6e63;font-weight:bold;margin-bottom:6px;">📚 深度考據內容</div>' : '';
    fb.innerHTML = `${head}<br>${info.brief}
        <div><button class="detail-toggle" onclick="toggleDetail(this, 'q-detail-box')">🔍 看詳細</button></div>
        <div class="detail-box" id="q-detail-box" style="display:none;">${tag}${info.detail}</div>`;
    updateScopeInfo();
}

// ================= 簡介／詳細 兩段式說明 =================
function analyzeItem(item) {
    const d = item.d || '';
    const sentences = d.split('。').map(s => s.trim()).filter(Boolean);
    const brief = sentences.length ? sentences[0] + '。' : d;

    // 若該筆資料已有專門考據撰寫的詳細介紹，優先使用
    if (item.detail) {
        return { brief, detail: item.detail, researched: true };
    }

    const restSentences = sentences.slice(1).map(s => s + '。').join('');
    const detail = (restSentences ? restSentences + ' ' : '') + categoryNote(item);
    return { brief, detail, researched: false };
}

function categoryNote(item) {
    const text = (item.o || '') + (item.d || '');
    if (/平埔|道卡斯|巴布薩|凱達格蘭|洪雅|西拉雅|噶瑪蘭|排灣|阿美|布農|泰雅|馬卡道|卑南|賽夏|邵族/.test(text))
        return '💡 延伸小知識：這類地名多源自臺灣原住民族語的音譯，是追溯當地原住民族群分布與歷史的重要線索。';
    if (/閩南|漳州|泉州|客家|粵|移民|開墾|拓墾|墾號/.test(text))
        return '💡 延伸小知識：此類地名反映清代漢人移民拓墾時，依原鄉地名、姓氏或墾號命名的常見模式，是台灣移墾史的縮影。';
    if (/溪|坑|崙|埔|湖|港|嶼|山|礁|洲|埤|窟|寮|坡|崎|潭/.test(text))
        return '💡 延伸小知識：此類地名多依當地地形、地貌特徵命名，是台灣地名學中最常見的類型之一。';
    if (/日治|日本|神社|州廳|街庄|昭和|大正/.test(text))
        return '💡 延伸小知識：此地名或行政區劃調整，與日治時期推行的地方制度改革有關。';
    return '💡 延伸小知識：地名的形成往往蘊含當地拓墾、族群互動與地理環境變遷的歷史記憶，值得細細探究。';
}

function toggleDetail(btn, boxId) {
    SoundMgr.play('click');
    const box = document.getElementById(boxId);
    const showing = box.style.display !== 'none';
    box.style.display = showing ? 'none' : 'block';
    btn.innerText = showing ? '🔍 看詳細' : '🔼 收合詳細';
}

function updateScopeInfo() {
    const el = document.getElementById('scope-info');
    if (!el) return;
    const pool = getPool();
    const correctCnt = pool.filter(p => Stats.status(p.id) === 'correct').length;
    const pct = pool.length ? Math.round(correctCnt / pool.length * 100) : 0;
    const scopeLabel = ExamScope.isAll() ? '全台灣' : (ExamScope.counties.size ? [...ExamScope.counties].join('、') : '（未選擇）');
    el.innerHTML = `範圍：${scopeLabel}　|　共 ${pool.length} 題　|　答對率 ${pct}%`;
}

// ================= 考試範圍設定 Modal =================
function openScopeModal() {
    SoundMgr.play('click');
    const list = document.getElementById('scope-list');
    list.innerHTML = allCounties.map(c => {
        const checked = ExamScope.has(c) ? 'checked' : '';
        const stat = countyStats(c);
        return `<label class="scope-item">
            <input type="checkbox" value="${c}" ${checked}>
            <span>${c}</span>
            <span class="cnt">${stat.correct}/${stat.total} (${stat.pct}%)</span>
        </label>`;
    }).join('');
    document.getElementById('scope-modal').style.display = 'flex';
}
function closeScopeModal(e) {
    if (e && e.target.id !== 'scope-modal') return;
    document.getElementById('scope-modal').style.display = 'none';
}
function scopeSelectAll(val) {
    document.querySelectorAll('#scope-list input[type=checkbox]').forEach(cb => cb.checked = val);
}
function applyScope() {
    const checked = [...document.querySelectorAll('#scope-list input[type=checkbox]:checked')].map(cb => cb.value);
    ExamScope.counties = checked.length === allCounties.length ? null : new Set(checked);
    ExamScope.save();
    document.getElementById('scope-modal').style.display = 'none';
    updateScopeInfo();
    initQuiz();
}

// ================= 設定 Modal =================
function openSettings() {
    SoundMgr.play('click');
    document.getElementById('net-img-toggle').checked = Settings.netImg;
    document.getElementById('sound-toggle').checked = SoundMgr.enabled;
    document.getElementById('settings-modal').style.display = 'flex';
}
function closeSettingsModal(e) {
    if (e && e.target.id !== 'settings-modal') return;
    document.getElementById('settings-modal').style.display = 'none';
}
function toggleNetImg(val) {
    Settings.netImg = val;
    Settings.save();
    // 重新整理目前畫面的圖片
    if (dailyItem) renderImageBox('d-img-box', dailyItem);
    if (qItem) renderImageBox('q-img-box', qItem);
}
function toggleSoundFromSettings(val) { SoundMgr.setEnabled(val); }
function resetProgress() {
    if (!confirm('確定要清除所有學習進度嗎？此動作無法復原。')) return;
    Stats.reset();
    updateScopeInfo();
    renderList();
    renderAchievements();
    initQuiz();
    alert('已重置學習進度。');
}

// ================= 列表渲染 =================
function statusIcon(status) {
    if (status === 'correct') return '✅';
    if (status === 'wrong') return '❌';
    return '➖';
}
function renderList() {
    const grid = document.getElementById('list-grid');
    const cf = document.getElementById('county-filter').value;
    const kw = document.getElementById('keyword').value.toLowerCase();
    const list = placesData.filter(x => (cf === "" || x.c === cf) && (x.n.includes(kw) || x.o.includes(kw) || x.c.includes(kw)));

    grid.innerHTML = list.slice(0, 150).map(item => {
        const status = Stats.status(item.id);
        return `<div class="grid-item st-${status}" data-id="${item.id}">
            <div class="status-tag">${statusIcon(status)}</div>
            <h3>${item.c} ${item.n}${item.s ? '<span class="badge-sub">小地名</span>' : ''}</h3>
            <div class="old">${labelText(item)}：${item.o}</div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.grid-item').forEach(el => {
        el.onclick = () => {
            SoundMgr.play('click');
            const item = placesData.find(p => p.id == el.dataset.id);
            openModal(item);
        };
    });

    if (list.length > 150) {
        grid.innerHTML += `<div style="grid-column:1/-1; text-align:center; padding:10px; color:#888;">(僅顯示前 150 筆結果，請使用搜尋縮小範圍)</div>`;
    }
}

async function openModal(item) {
    SoundMgr.play('click');
    document.getElementById('m-name').innerHTML = item.c + " " + item.n + (item.s ? ' <span class="badge-sub">小地名</span>' : '');
    document.getElementById('m-old').innerText = labelText(item) + "：" + item.o;
    const info = analyzeItem(item);
    document.getElementById('m-desc').innerText = info.brief;
    const detailBox = document.getElementById('m-detail-box');
    const detailBtn = document.getElementById('m-detail-btn');
    const tag = info.researched ? '<div style="font-size:0.72rem;color:#8d6e63;font-weight:bold;margin-bottom:6px;">📚 深度考據內容</div>' : '';
    detailBox.innerHTML = tag + info.detail;
    detailBox.style.display = 'none';
    detailBtn.innerText = '🔍 看詳細';
    document.getElementById('modal').style.display = 'flex';
    await renderImageBox('m-img-box', item);
}
function closeModal() {
    SoundMgr.play('click');
    document.getElementById('modal').style.display = 'none';
}

// ================= 縣市進度 (成就) =================
function countyStats(county) {
    const items = placesData.filter(p => p.c === county);
    const total = items.length;
    const correct = items.filter(p => Stats.status(p.id) === 'correct').length;
    const pct = total ? Math.round(correct / total * 100) : 0;
    return { total, correct, pct, lit: pct >= 100 };
}

function renderAchievements() {
    const svg = document.getElementById('tw-map');
    const summary = document.getElementById('ach-summary');
    let litCount = 0;
    let svgContent = '';

    Object.keys(countyMapData).forEach(c => {
        const geo = countyMapData[c];
        const s = countyStats(c);
        if (s.lit) litCount++;

        let fill;
        if (s.lit) {
            fill = 'var(--gold)';
        } else if (s.pct <= 0) {
            fill = '#e0e0e0';
        } else {
            // 依答對率從淡藍漸層到深藍
            const t = Math.min(s.pct / 100, 1);
            const r = Math.round(227 - t * (227 - 21));
            const g = Math.round(242 - t * (242 - 101));
            const b = Math.round(253 - t * (253 - 192));
            fill = `rgb(${r},${g},${b})`;
        }

        svgContent += `<polygon class="county-shape ${s.lit ? 'lit' : ''}" data-c="${c}" points="${geo.pts}" fill="${fill}"></polygon>`;
        svgContent += `<text class="county-label" x="${geo.lx}" y="${geo.ly}" data-c="${c}">${c.replace('臺','台')}</text>`;
    });

    svg.innerHTML = svgContent;
    summary.innerHTML = `已點亮 <b style="color:#b8860b;font-size:1.3rem;">${litCount}</b> / ${allCounties.length} 個縣市（該縣市題目全部答對才會點亮）`;

    document.getElementById('ach-detail').style.display = 'none';

    svg.querySelectorAll('.county-shape, .county-label').forEach(el => {
        el.style.pointerEvents = 'auto';
        el.onclick = () => showCountyDetail(el.dataset.c);
    });
}

function showCountyDetail(c) {
    SoundMgr.play('click');
    const s = countyStats(c);
    const box = document.getElementById('ach-detail');
    box.style.display = 'block';
    box.innerHTML = `
        <h3>${s.lit ? '🏆 ' : '📍 '}${c}</h3>
        <div class="pct-big" style="${s.lit ? 'color:#b8860b;' : ''}">${s.pct}%</div>
        <div class="ach-bar-bg"><div class="ach-bar-fill ${s.lit ? 'full' : ''}" style="width:${s.pct}%;"></div></div>
        <div style="color:#888; font-size:0.85rem; margin-top:6px;">${s.correct} / ${s.total} 題答對${s.lit ? '　已全部答對，成功點亮！' : ''}</div>
        <button class="go-quiz-btn" onclick="goQuizForCounty('${c}')">🎯 前往測驗此縣市</button>
    `;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function goQuizForCounty(c) {
    SoundMgr.play('click');
    ExamScope.counties = new Set([c]);
    ExamScope.save();
    updateScopeInfo();
    initQuiz();
    setTab('quiz', document.querySelectorAll('.nav-btn')[1]);
}

// ================= 分頁切換 =================
function setTab(id, btn) {
    SoundMgr.play('click');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
    if (id === 'quiz') { updateScopeInfo(); initQuiz(); }
    if (id === 'ach') renderAchievements();
}

window.onload = init;
</script>
