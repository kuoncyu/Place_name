<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣地名尋根 (深入版)</title>
<style>
:root { --primary: #37474f; --secondary: #c62828; --bg: #eceff1; --card-bg: #fff; --accent: #ff9800; --gold: #d4af37; }
* { box-sizing: border-box; }
body { font-family: "Noto Sans TC", sans-serif; background: var(--bg); margin: 0; padding-bottom: 60px; color: #333; user-select: none; }

header { background: #263238; color: #fff; padding: 30px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
h1 { margin: 0; font-size: 1.8rem; }
header p { color: #b0bec5; font-size: 0.9rem; margin-top: 5px; }

.header-ctrls { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; }
.icon-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35); color: #fff; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; display: flex; align-items: center; gap: 5px; }
.icon-btn:hover { background: rgba(255,255,255,0.35); }
.icon-btn.muted { opacity: 0.6; text-decoration: line-through; }

.nav { display: flex; justify-content: center; gap: 8px; padding: 12px; background: #fff; position: sticky; top: 0; z-index: 90; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; }
.nav-btn { padding: 8px 16px; border: 1px solid var(--primary); border-radius: 20px; background: transparent; color: var(--primary); font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
.nav-btn.active { background: var(--primary); color: #fff; }

.container { max-width: 1200px; margin: auto; padding: 20px; }
.section { display: none; animation: fadeIn 0.5s; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* 每日一抽 */
.daily-card-container { perspective: 1000px; max-width: 400px; height: 520px; margin: 20px auto; cursor: pointer; }
.daily-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.8s; transform-style: preserve-3d; }
.daily-card-container.flipped .daily-card-inner { transform: rotateY(180deg); }
.daily-card-front, .daily-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); overflow: hidden; }
.daily-card-front { background: linear-gradient(135deg, #37474f, #546e7a); color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.front-icon { font-size: 5rem; margin-bottom: 20px; }
.daily-card-back { background: #fff; transform: rotateY(180deg); display: flex; flex-direction: column; }
.daily-img-box { width: 100%; height: 50%; background: #ddd; position: relative; overflow: hidden; }
.daily-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.daily-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

/* 列表 */
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
select, input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
.grid-item { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; border-left: 5px solid transparent; position: relative; }
.grid-item:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.grid-item.st-correct { border-left-color: #4caf50; }
.grid-item.st-wrong { border-left-color: #ef5350; }
.grid-item.st-unseen { border-left-color: #bdbdbd; }
.grid-item h3 { margin: 5px 0; color: var(--primary); font-size: 1.1rem; }
.grid-item .old { color: var(--secondary); font-weight: bold; font-size: 0.9rem; }
.badge-sub { display:inline-block; background:#fff3e0; color:#e65100; font-size:0.7rem; padding:2px 6px; border-radius:10px; margin-left:6px; font-weight:bold; vertical-align:middle; }
.status-tag { position:absolute; top:10px; right:10px; font-size:0.9rem; }

/* 測驗 */
.quiz-top-bar { max-width: 600px; margin: 0 auto 15px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.scope-btn { background:#fff; border:1px solid var(--primary); color:var(--primary); padding:8px 14px; border-radius:20px; cursor:pointer; font-size:0.85rem; font-weight:bold; }
.scope-info { font-size:0.85rem; color:#666; }
.quiz-box { max-width: 600px; margin: auto; background: #fff; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
.quiz-img-box { width: 100%; height: 250px; margin-bottom: 20px; border-radius: 12px; overflow: hidden; background: #eee; }
.quiz-img-box img { width: 100%; height: 100%; object-fit: cover; display:block; }
.quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.q-btn { padding: 15px; border: 1px solid #ddd; background: #fff; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.2s; }
.q-btn:hover:not(:disabled) { background: #f5f5f5; }
.q-btn.correct { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; animation: pop 0.3s; }
.q-btn.wrong { background: #ffebee; border-color: #ef5350; color: #c62828; animation: shake 0.4s; }
.empty-pool { max-width:600px; margin:40px auto; text-align:center; color:#888; background:#fff; padding:30px; border-radius:16px; }

@keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

/* 縣市進度 (成就地圖) */
.map-wrap { max-width: 480px; margin: 0 auto; background: #f5faff; border-radius: 16px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
#tw-map { width: 100%; height: auto; display: block; }
.county-shape { stroke: #607d8b; stroke-width: 1.2; cursor: pointer; transition: filter 0.2s, stroke-width 0.2s; }
.county-shape:hover { filter: brightness(1.08); stroke-width: 2.2; }
.county-shape.lit { stroke: var(--gold); stroke-width: 1.6; filter: drop-shadow(0 0 4px rgba(212,175,55,0.85)); }
.county-label { font-size: 10px; fill: #263238; text-anchor: middle; pointer-events: none; font-weight: bold; paint-order: stroke; stroke: #fff; stroke-width: 2px; stroke-linejoin: round; }
.map-legend { display: flex; justify-content: center; gap: 18px; margin: 12px auto 0; flex-wrap: wrap; font-size: 0.8rem; color: #555; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid #999; }
.legend-swatch.lit-swatch { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 4px rgba(212,175,55,0.8); }
.ach-detail { max-width: 480px; margin: 14px auto 0; background: #fff; padding: 16px 18px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
.ach-detail h3 { margin: 0 0 8px; color: var(--primary); }
.ach-detail .pct-big { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
.ach-bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 6px; margin-top: 10px; overflow: hidden; }
.ach-bar-fill { height: 100%; background: linear-gradient(90deg, #90caf9, #42a5f5); transition: width 0.4s; }
.ach-bar-fill.full { background: linear-gradient(90deg, var(--gold), #f5d76e); }
.ach-detail .go-quiz-btn { margin-top: 12px; padding: 10px 24px; background: var(--primary); color: #fff; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
.ach-summary { max-width:480px; margin:0 auto 16px; text-align:center; background:#fff; padding:16px; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }

/* Modal */
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
.modal-content { background: #fff; width: 100%; max-width: 500px; border-radius: 15px; overflow: hidden; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s; }
.modal-body { padding: 25px; }
@keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-img-box { width:100%; height:250px; overflow:hidden; background:#eee; }
.modal-img-box img { width:100%; height:100%; object-fit:cover; display:block; }

.detail-toggle { display:inline-block; background:#eceff1; color:var(--primary); border:1px solid #cfd8dc; padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.85rem; font-weight:bold; margin-top:6px; }
.detail-toggle:hover { background:#cfd8dc; }
.detail-box { margin-top:10px; padding:12px 14px; background:#f5f7f8; border-left:3px solid var(--accent); border-radius:6px; font-size:0.9rem; line-height:1.6; color:#555; text-align:justify; }

.setting-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #eee; }
.setting-row:last-child { border-bottom:none; }
.setting-label { font-weight:bold; color:var(--primary); }
.setting-desc { font-size:0.8rem; color:#888; margin-top:3px; }
.switch { position:relative; display:inline-block; width:48px; height:26px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:26px; transition:0.3s; }
.slider:before { content:""; position:absolute; height:20px; width:20px; left:3px; bottom:3px; background:white; border-radius:50%; transition:0.3s; }
input:checked + .slider { background: var(--primary); }
input:checked + .slider:before { transform: translateX(22px); }
.danger-btn { width:100%; padding:10px; background:#ffebee; color:#c62828; border:1px solid #ef9a9a; border-radius:8px; cursor:pointer; margin-top:15px; font-weight:bold; }
.scope-list { display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto; margin:15px 0; }
.scope-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:#f7f7f7; }
.scope-item span.cnt { margin-left:auto; font-size:0.8rem; color:#888; }
.scope-actions { display:flex; gap:10px; margin-bottom:10px; }
.scope-actions button { flex:1; padding:8px; border-radius:8px; border:1px solid var(--primary); background:#fff; color:var(--primary); cursor:pointer; font-weight:bold; }
.primary-btn { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; margin-top:10px; font-weight:bold; }
</style>
</head>
<body>

<header>
    <h1>🗺️ 台灣地名尋根 (深入版)</h1>
    <p>完整收錄全台行政區、古地名與細部小地名由來</p>
    <div class="header-ctrls">
        <button class="icon-btn" id="audio-btn" onclick="SoundMgr.toggle()">🔊 音樂</button>
        <button class="icon-btn" onclick="openSettings()">⚙️ 設定</button>
    </div>
</header>

<div class="nav">
    <button class="nav-btn active" onclick="setTab('daily', this)">📅 每日一地</button>
    <button class="nav-btn" onclick="setTab('quiz', this)">✏️ 地名測驗</button>
    <button class="nav-btn" onclick="setTab('list', this)">📖 完整列表</button>
    <button class="nav-btn" onclick="setTab('ach', this)">🏆 縣市進度</button>
</div>

<div class="container">
    <div id="tab-daily" class="section active">
        <div class="daily-card-container" onclick="flipCard()">
            <div class="daily-card-inner">
                <div class="daily-card-front">
                    <div class="front-icon">🎴</div>
                    <h2>今日運勢地名</h2>
                    <p>點擊翻開，探索今日的緣分之地</p>
                    <small style="margin-top:20px; opacity:0.7;">(每日 00:00 更新)</small>
                </div>
                <div class="daily-card-back">
                    <div class="daily-img-box" id="d-img-box"></div>
                    <div class="daily-content" onclick="openModal(dailyItem); event.stopPropagation();">
                        <h2 id="d-fullname" style="margin:0 0 10px 0; font-size:1.5rem; color:var(--primary);"></h2>
                        <div style="color:var(--secondary); font-weight:bold; margin-bottom:10px;" id="d-old"></div>
                        <p style="font-size:0.9rem; color:#666;">(點擊查看詳細故事)</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-quiz" class="section">
        <div class="quiz-top-bar">
            <div class="scope-info" id="scope-info">範圍：全台灣</div>
            <button class="scope-btn" onclick="openScopeModal()">🎯 考試範圍設定</button>
        </div>
        <div id="quiz-content"></div>
    </div>

    <div id="tab-list" class="section">
        <div class="filter-bar">
            <select id="county-filter" onchange="renderList()">
                <option value="">全台縣市</option>
            </select>
            <input type="text" id="keyword" placeholder="搜尋地名..." onkeyup="renderList()">
        </div>
        <div id="list-grid" class="grid"></div>
        <div style="text-align:center; margin-top:20px; color:#888; font-size:0.8rem;">共收錄 <span id="total-count">0</span> 筆資料</div>
    </div>

    <div id="tab-ach" class="section">
        <div class="ach-summary" id="ach-summary"></div>
        <div class="map-wrap">
            <svg id="tw-map" viewBox="0 0 670 720" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="map-legend">
            <span class="legend-item"><span class="legend-swatch" style="background:#e0e0e0;"></span>尚未作答</span>
            <span class="legend-item"><span class="legend-swatch" style="background:#64b5f6;"></span>進行中</span>
            <span class="legend-item"><span class="legend-swatch lit-swatch"></span>全部答對（已點亮）</span>
        </div>
        <div id="ach-detail" class="ach-detail" style="display:none;"></div>
    </div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-img-box" id="m-img-box"></div>
        <div class="modal-body">
            <h2 id="m-name" style="margin:5px 0; color:var(--primary);"></h2>
            <div id="m-old" style="background:#eee; display:inline-block; padding:5px 10px; border-radius:5px; font-weight:bold; margin-bottom:15px;"></div>
            <p id="m-desc" style="line-height:1.6; text-align:justify;"></p>
            <button class="detail-toggle" id="m-detail-btn" onclick="toggleDetail(this, 'm-detail-box')">🔍 看詳細</button>
            <div class="detail-box" id="m-detail-box" style="display:none;"></div>
            <button onclick="closeModal()" style="width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; margin-top:15px;">關閉</button>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal" onclick="closeSettingsModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-body">
            <h2 style="margin:0 0 10px; color:var(--primary);">⚙️ 設定</h2>
            <div class="setting-row">
                <div>
                    <div class="setting-label">🌐 讀取網路圖片</div>
                    <div class="setting-desc">開啟：讀取該地風景照或地圖位置圖（需連網）<br>關閉：單機版，使用離線插圖</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="net-img-toggle" onchange="toggleNetImg(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <div>
                    <div class="setting-label">🔊 背景音樂與音效</div>
                    <div class="setting-desc">操作介面時的提示音與背景輕音樂</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="sound-toggle" onchange="toggleSoundFromSettings(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div style="font-size:0.8rem; color:#999; margin-top:15px;">目前資料庫共 <b id="settings-total"></b> 筆地名資料</div>
            <button class="danger-btn" onclick="resetProgress()">🗑️ 重置學習進度</button>
            <button class="primary-btn" onclick="closeSettingsModal()">關閉</button>
        </div>
    </div>
</div>

<div id="scope-modal" class="modal" onclick="closeScopeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-body">
            <h2 style="margin:0 0 10px; color:var(--primary);">🎯 考試範圍設定</h2>
            <p style="font-size:0.85rem; color:#888; margin-top:0;">勾選要納入測驗的縣市，出題會優先出「未考過」的題目，其次是「答錯過」的題目。</p>
            <div class="scope-actions">
                <button onclick="scopeSelectAll(true)">全選</button>
                <button onclick="scopeSelectAll(false)">全不選</button>
            </div>
            <div class="scope-list" id="scope-list"></div>
            <button class="primary-btn" onclick="applyScope()">套用並開始測驗</button>
        </div>
    </div>
</div>

<script>
// places_db.js
// 為了達到 1000 筆資料並保持效能，採用「陣列壓縮格式」儲存
// 格式定義：[ 0:縣市, 1:名稱, 2:古名/舊稱, 3:由來/典故 ]

const rawPlacesData = [
    // --- 【基隆市】 ---
    ["基隆市","中正區","社寮","中正區舊名社寮，因和平島舊稱社寮島，島與台灣本島間有一狹窄水道「八尺門」而得名。","","中正區位於基隆港東岸，轄內的和平島清代稱作「社寮島」，因島上曾是原住民頭目與通事辦公的社寮所在地而得名；更早的荷西時期，西班牙人也曾在此建造聖薩爾瓦多城。和平島與台灣本島之間有一條寬度僅約八台尺的狹窄海峽，形似出海的門戶，因此被稱為「八尺門」，日治時期此地一帶便以八尺門為地名。戰後國民政府來台，基隆市各區改以「忠孝仁愛信義和平」等政治教化用語命名，八尺門一帶便改稱為「中正區」，沿用至今。中正區同時也是「雞籠」地名最早的發源地之一：清代文獻中，和平島一帶被稱為「大雞籠嶼」，鄰近海上的基隆嶼則稱「小雞籠嶼」，據信與島嶼形似雞籠，或與平埔族「凱達格蘭」（Ketagalan）音轉有關，兩種說法至今仍有爭議。如今和平島已闢為地質公園，海蝕地形與歷史古蹟並存，成為認識基隆早期開發史的重要據點。"],
    ["基隆市","七堵區","七堵","七堵原意眾說紛紜，傳統說法為第七道防禦土牆，近年研究則認為是指基隆河河曲上的小山。","","七堵區地名由來長期眾說紛紜。傳統說法認為，清代漢人沿基隆河向山區拓墾時，為防範原住民出草而修築土牆，土牆「一丈為板、五板為堵」，五堵、六堵、七堵、八堵便依修築順序命名，七堵正是第七道防禦據點。然而近年學者提出質疑：這一帶原屬馬賽族等平埔族群活動範圍，並非文獻所稱兇猛的「野番」，且若真為防禦工事，依台灣慣例應稱「隘」而非「堵」；再從地圖判讀，五堵到八堵剛好都位於基隆河連續河曲、且鄰近小山的地點，因此另有一說認為「堵」其實是閩南人用來比擬河曲旁小山的說法，如同「一堵牆」擋在河道上，數字則可能只是早年標記地形順序所留下的痕跡，未必真與防禦或編號有直接關聯。無論何者為真，七堵因扼守基隆河谷與縱貫鐵路要衝，清代已是漢人與原住民交易往來的重要據點，日治時期更發展成鐵路重鎮，如今是基隆市面積最大、且被規劃為基隆副都心的行政區。"],
    ["基隆市","暖暖區","那那","暖暖源自平埔族凱達格蘭「那那社」音譯，意為淡水與基隆之間的「間隔之地」，與氣候溫暖無關。","","暖暖區地名源自平埔族凱達格蘭（一說馬賽族）「那那社」的社名音譯，與台語字面上「溫暖」的意思其實毫無關係。一種考證認為，「那那」在原住民語言中可能有「間隔之地」之意：早年基隆與淡水一帶的原住民往來，多沿基隆河兼陸路而行，因為海路常受季風、海流影響而不便；但基隆河行至暖暖河段水淺灘急，只能改搭竹筏，旅人通常在此下船，翻越暖暖一帶山區才能抵達基隆，因此暖暖被視為兩地之間的「間隔地帶」，因而得名。清領時期，暖暖是基隆河航運的重要商埠，大船行至暖暖必須換乘小船進入「渡船頭」，也是淡蘭古道中路、北路的起點，商行林立、盛極一時，甚至留下「九萬十八千」形容當地富裕人家的俗語。日治時期，總督府聘請衛生顧問後藤新平規劃基隆自來水系統，選定暖暖溪西側興建水源地，暖暖因此也成為台灣最早的自來水水源地之一，這段水利建設的歷史至今仍留有相關設施可供追尋。"],
    ["基隆市","仁愛區","石硬港","仁愛區境內因南榮河兩岸岩石堅硬而得名「石硬港」，日治時期改稱石牌街，戰後才定名仁愛區。","","仁愛區是基隆港南岸的市中心精華地帶，也是漢人最早在基隆開發的市街區域。境內流貫紅淡山與獅球嶺之間的一條河流，因兩岸岩石堅硬，清代被稱為「石硬港」，後來才改稱南榮河，這也是仁愛區南榮路一帶「石硬港庄」地名的由來。日治時期實施町名改正後，此地改稱「石牌街」，但這個名稱確切的由來已難以考證。1945年台灣光復後，國民政府仿效「忠孝仁愛信義和平」等傳統政治教化用語為基隆各區重新命名，石牌街因此改稱「仁愛區」，沿用至今；同一時期，基隆的「田寮港」改為信義區、「八尺門」改為中正區、「白米甕」改為中山區，都是同一波命名政策下的產物。仁愛區境內的獅球嶺，因地形是台灣東北海岸通往台北盆地的天然屏障，1884年中法戰爭時，法軍雖一度攻占基隆，卻因獅球嶺阻擋而始終無法長驅直入台北，是基隆重要的歷史戰略要地。如今仁愛區以廟口夜市聞名全台，是遊客造訪基隆時必訪的美食重鎮。"],
    ["基隆市","中山區","牛稠港","中山區舊稱白米甕，境內的牛稠港則因清代漳州移民在此搭建飼養牛隻的牛稠（牛舍）而得名。","","中山區位於基隆港北岸，清雍正元年（1723年）曾有一批漳州移民由八里坌輾轉遷居至此，在「牛稠港」與虎子山一帶落腳，並建立崁仔頂街，是基隆市街開發的起點之一；「牛稠」指的正是飼養牛隻的牛舍，因當地曾設有牛舍而得名，這也是基隆早期漢人以「牛稠港」「石硬港」「蚵殼港」「田寮港」等方式，把「港」當作「河」的通稱，為河流沿岸聚落命名的例子之一。中山區另一處著名地標白米甕，是清末日治時期為防禦海上入侵而興建的白米甕砲台所在地，因砲台位置居高臨下、與東岸和平島互為犄角、共同扼守基隆港口而具有重要戰略地位，甚至因傳說十七世紀西班牙人曾在此築城，而有「荷蘭城砲台」的別稱。戰後基隆市重新劃分行政區，原本的「白米甕」一帶便依政治教化用語改稱「中山區」，沿用至今，境內的白米甕砲台如今已列為市定古蹟，成為認識基隆港防禦史的重要景點。"],
    ["基隆市","安樂區","蚵殼港","安樂區境內的蚵殼港，因早年河岸盛產牡蠣，居民燒蚵殼製作石灰塗料而得名。","","安樂區地處基隆西部，境內的蚵殼港河發源於大竿林與內木山溪匯流處，流貫曾仔寮山與佛祖嶺之間的谷地，自古是基隆前往金包里（今金山）的必經之地。「蚵殼港」之名，顧名思義與牡蠣（蚵仔）密切相關：早年沿岸盛產牡蠣，居民採收後將大量蚵殼堆積在岸邊，甚至有人專門收集蚵殼燒製成石灰，作為建築塗牆的材料，因而使這條河與周邊街庄得名蚵殼港。另有一說，蚵殼港河上一座通往大竿林的橋梁因塗上防腐黑漆，或因鄰近運煤路線遭煤炭染黑，而使當地留下與顏色相關的俗稱，但正式地名仍以蚵殼港為主。戰後基隆市政府重新命名各行政區時，這一帶因取吉祥用語「安樂」而定名為安樂區，是基隆少數並非直接沿用日治舊街名、而是另取吉祥字面意義命名的行政區之一，與仁愛、信義、中正、中山等區共同構成基隆特殊的政治教化式地名系統。"],
    ["基隆市","信義區","田寮港","信義區舊稱田寮港，因早期先民在田野間搭建草寮而得名，境內田寮河更是台灣第一條人工運河。","","信義區清代稱為「田寮港庄」，地名由來與早期先民在此開墾田地、於田野間搭建臨時草寮居住有關，加上基隆一帶慣以「港」稱「河」，因而得名田寮港。發源於槓子寮山谷的田寮港，是注入基隆港的四條河川之一，日治時期因應鋸木業與煤礦運輸需求，將河道整治為人工運河，成為台灣史上第一條人工運河，早年更是上游山區煤礦運往港口的重要水道，兩岸堤岸經整治後平直規整，直到今日在地耆老仍習慣稱這條河為「田寮港」，而非後來改稱的田寮河。1931年日治時期實施町名改正，田寮港庄一帶劃分為壽町、幸町、東町等多個町；台灣光復後，國民政府依「忠孝仁愛信義和平」的命名原則，將此地重新命名為「信義區」，沿用至今。如今信義區是基隆市議會與台灣基隆地方法院所在地，境內學校林立，是基隆重要的文教行政區，而流貫市區的田寮河沿岸也整治為親水景觀廊道，成為市民休憩散步的去處。"],
    ["基隆市","八堵","八堵","八堵地名由來與七堵相同，或為清代第八道防禦土牆，或為基隆河河曲上第八座小山，至今仍無定論。","","八堵與五堵、六堵、七堵並列基隆河沿岸依序排列的四個地名，長期以來都以同一套邏輯來解釋其由來：傳統說法認為，清代漢人拓墾時沿河修築防禦土牆抵禦原住民，「一丈為板、五板為堵」，依修築先後編號命名，八堵即為第八道防禦據點；但這個說法近年遭到不少地名學者質疑，原因是這幾處地名之間找不出明確的關聯事件或人物，而且若真是防禦工事，依台灣慣例通常會命名為「隘」而非「堵」。另一派學者則從地形觀察出發，指出五堵至八堵都位於基隆河連續彎曲的河曲地形上，且鄰近皆有小山，因此認為「堵」其實是閩南移民用來比擬河曲旁小山的說法，如同「一堵牆」擋住河道，數字則可能只是早年標記地形或聚落開發順序留下的痕跡。八堵在清代已因位居基隆河谷交通要衝而發展成聚落，日治與戰後時期更因鐵路交會、礦業興盛而一度是基隆與宜蘭之間重要的轉運與維修站，如今仍保有百年歷史的八堵車站，見證這段鐵道發展史。"],
    ["基隆市","百福","百福","百福原是六堵的別稱，因2007年台鐵在此增設車站、鄰近百福社區而正式成為地名。","","百福其實與六堵是同一個地方的兩種稱呼：六堵地區清末屬「六堵莊」，1920年代改隸七堵莊管轄，戰後又劃入基隆市七堵區成為六堵里，行政區劃上一直以「六堵」為正式名稱。然而在地居民與後來新闢建的社區，卻習慣以吉祥用語「百福」（寓意百般福氣具臻）來稱呼這一帶，於是台鐵在2007年因應鐵路捷運化政策，於六堵地區新設一座簡易車站時，便依循當地社區的名稱，將車站命名為「百福車站」，而非依照鄰近五堵、七堵、八堵的編號邏輯稱為「六堵車站」，這也讓不少初次造訪的旅客感到疑惑。六堵地區自1960年代起由政府規劃開發為六堵工業區，是基隆少數的平地腹地，早年以標準廠房、給水廠、污水處理廠等現代化工業設施聞名，如今已轉型為六堵科技園區。百福社區與百福車站周邊也因鄰近縱貫鐵路與省道，交通往來便利，逐漸發展為七堵區重要的生活機能與轉乘據點。"],
    
    // --- 【台北市】 ---
    ["台北市","中正區","城內","中正區舊稱「城內」，即清代台北府城城牆內的區域，因而得名。","","台北市中正區的舊稱「城內」，指的正是清光緒年間興建的台北府城城牆所圍起的範圍。這座台北城於光緒5年(1879年)規劃、光緒8年(1882年)動工，光緒10年(1884年)竣工，城牆周長約1506丈，設有承恩門(北門)、麗正門(南門)、重熙門(小南門)、景福門(東門)、寶成門(西門)五座城門，是當時全台規模數一數二的城池。台北府與淡水縣、乃至日後的台灣巡撫衙門、布政使司衙門等重要官署，都設置在這座城牆之內，使「城內」與艋舺、大稻埕並列清末台北三大聚落，卻是三者中行政地位最高、卻是最晚才發展成商業街市的區域。日治時期，總督府陸續拆除城牆、拓寬為三線道路，並在城內興建總督府（今總統府）、台北州廳等官署建築，奠定今日中正區作為台北行政中樞的基礎；戰後，這一帶依國父孫中山諡號「中正」重新命名為中正區，但「城內」一詞至今仍在部分老台北人口中沿用，用以指稱這片曾經城牆環繞的核心區域。"],
    ["台北市","大同區","大稻埕","大稻埕原為平埔族「奇武卒社」居地，因漢人在此留設曬穀廣場（稻埕）而得名。","","大稻埕清初原是「大加蚋堡」的一部分，最初為平埔族奇武卒社的居住地。漢人遷入開墾後，習慣在水田之間留出一塊地勢較高的空地，供各庄輪流曝曬稻穀，農閒時也兼作臨時市集，閩南移民稱這種曬穀場地為「埕」，因面積廣大，此地便被稱為「大稻埕」。1853年艋舺發生「頂下郊拚」分類械鬥，落敗的同安人被迫遷離艋舺，轉而在大稻埕另闢碼頭與街市，加上1860年淡水開港通商後，大稻埕因臨近淡水河、便於出口茶葉，迅速取代艋舺成為北台灣最重要的商業與貿易中心，享有「小上海」之稱。日治時期，大稻埕持續是台籍商人與知識分子活躍的舞台，蔣渭水等人也在此推動台灣文化協會等社會運動。如今大稻埕範圍涵蓋今日的迪化街、貴德街一帶，保存大量清末至日治時期的洋樓與街屋立面，是台北少數仍保有完整歷史街廓紋理的區域，也是年貨大街與南北貨、中藥材批發的重鎮。"],
    ["台北市","中山區","牛埔","中山區舊稱牛埔，因早期為放牛吃草的荒地而得名，日治時期發展為高級住宅區大正町。","","中山區在清代原是一片供居民放牧牛隻的荒地與草埔，因而被稱為「牛埔」，範圍大致涵蓋今日中山北路一帶。日治時期，隨著台北市區改正計畫的推行，這片原本荒僻的牛埔逐漸被規劃為棋盤式街廓的新興市街，並命名為「大正町」，以紀念當時在位的日本大正天皇；由於鄰近台灣總督官邸（今台北賓館）與圓山一帶的公園綠地，大正町迅速發展成日治時期台灣人與日本人上流階層聚居的高級住宅區，街道兩側廣植行道樹，環境清幽。戰後，國民政府重新劃分台北市行政區，將牛埔、大正町一帶與宮前町等區域合併，並以孫中山先生之名命名為「中山區」，沿用至今。如今中山區仍延續日治時期奠定的都市紋理，中山北路林蔭大道、老洋房與精品店林立，是台北市著名的時尚與文創街區之一。"],
    ["台北市","松山區","錫口","松山舊稱「錫口」，源自巴賽族語「河流彎曲處」，日治時期因發音不雅且景色似日本松山而改名。","","松山區舊稱「錫口」，這個地名源自居住於基隆河畔的巴賽族「Malysyakkaw」社，意指「河流彎曲處」，漢人陸續以「麻里折口」「貓里錫口」等音譯記錄這個地名，清嘉慶年間才簡化定名為「錫口」。當地因基隆河航運之便，在松山慈祐宮附近發展出繁榮的「錫口街」，曾有「小蘇州」之稱。1920年，日本殖民政府推行地方行政改制，決定將「錫口」改名，官方說法是當地風景與日本四國愛媛縣的松山市相似，因而改稱「松山」；但民間也流傳另一種說法，指「錫口」的台語發音與日語中的不雅詞彙過於相近，才促使當局決定另取新名。無論何者為主要原因，松山之名自此沿用至今，戰後國民政府設置松山區作為行政區名稱，錫口舊街則因鄰近饒河街觀光夜市，至今仍保有松山慈祐宮等百年歷史地標，成為認識這段地名變遷史的最佳見證。"],
    ["台北市","大安區","大灣","大安區舊稱「大灣」，因早期陂塘與水圳彎曲環繞而得名，後因閩南語諧音取「大安」吉名。","","大安區在清代原是一片水源豐沛之地，境內瑠公圳等灌溉水圳流經此處時多處彎曲盤繞，加上早年開闢的陂塘（蓄水池）分布其間，因而被稱為「大灣」，意指這片地勢低窪、水流迂迴的區域。「大灣」在閩南語中的發音與「大安」相近，加上「安」字本身帶有平安吉祥的寓意，因此後來逐漸轉寫、雅化為「大安」，並沿用至今。清代到日治初期，大安一帶仍以農業為主，種植水稻與蔬果，直到日治後期及戰後，隨著台北市區向東擴張，加上國立台灣大學、國立台灣師範大學等高等學府陸續設立於此，大安區才逐漸從農業地帶轉型為文教與高級住宅區。如今大安區是台北市人口最稠密、地價也最高的行政區之一，境內的大安森林公園更被視為台北市的「都市之肺」，與清代因水圳彎曲而得名的「大灣」形成有趣的今昔對照。"],
    ["台北市","萬華區","艋舺","萬華舊稱艋舺，源自平埔族語「獨木舟」，日治時期因發音近似日語「萬華」而改稱。","","萬華舊稱「艋舺」，這個地名源自平埔族凱達格蘭族對獨木舟的稱呼「Vanka」或「Mankah」。清代平埔族人常駕獨木舟載運蕃薯、木材等物產，沿淡水河到今日貴陽街、環河南路一帶與漢人交易，因獨木舟聚集雲集，這片河岸便被稱為艋舺，最初的市集甚至直接被稱作「番薯市」。乾隆年間，八里坌開放為正口，可直接與福建對渡，艋舺的商業地位因此大幅提升，十九世紀初已與台南府城、彰化鹿港並列「一府二鹿三艋舺」，是當時台灣第三大港市。然而1853年的頂下郊拚械鬥重創艋舺元氣，加上淡水河逐漸淤積，商業地位逐漸被大稻埕取代。1920年，日本殖民政府進行地方改制，因艋舺的閩南語發音與日語漢字「萬華」音近，且「萬華」二字有「萬年繁華」的吉祥寓意，便將此地正式改名為萬華，沿用至今，境內的龍山寺、剝皮寮老街仍是艋舺歷史的重要見證。"],
    ["台北市","信義區","興雅","信義區舊稱興雅庄，是清代已存在的聚落名，寓意興盛雅致，1990年才從松山、大安兩區劃出獨立設區。","","信義區境內的「興雅」是清代便已存在的舊聚落名稱「興雅庄」，與六張犁、三張犁等同屬大加蚋堡下的墾拓聚落，地名本身帶有興盛雅致的吉祥寓意，但確切的命名緣由已難詳細考證。信義區是台北市十二個行政區中最年輕的一區，直到1990年3月台北市進行行政區重劃，才將原松山區鐵路以南地區，以及大安區和平東路以北的部分區域合併，並依「忠孝仁愛信義和平」的命名慣例定名為「信義區」。信義區境內原本多為農田與眷村聚落，1970年代後配合台北市政府「信義計畫區」的都市開發計畫，逐步興建市政府、世界貿易中心、台北101等地標建築，從昔日的興雅庄農業聚落，蛻變為今日台北最重要的金融商辦與百貨購物核心地帶，也是跨年煙火固定舉辦的地點，與清代默默無聞的興雅之名形成強烈對比。"],
    ["台北市","士林區","八芝蘭","士林舊稱八芝蘭，源自平埔族語「溫泉」，清末因文風鼎盛，取「士子如林」改稱士林。","","士林區舊稱「八芝蘭」，是平埔族凱達格蘭語「Pattsiran」的音譯，意指溫泉，這一帶原為凱達格蘭族麻少翁社的居住地。漢人入墾後，因當地林木茂盛又盛產蘭花，將地名寫作「八芝蓮林」或「八芝連林」，後簡化為「八芝蘭」，清代行政區劃上則稱「芝蘭堡」。相傳嘉慶年間，淡水廳同知胡應魁巡視此地時，見山明水秀，讚嘆「宛如芝蘭之室，堪稱名勝之區」，因而奠定「芝蘭」雅稱的由來。清末，當地士紳潘永清等人在芝山岩設立義塾，加上私塾、社學林立，文風鼎盛、科舉人才輩出，時有「三步一秀，五步一舉」的美譽，於是地方仕紳取「士子如林」之意，將地名改為「士林」，沿用至今。如今士林區以士林夜市、故宮博物院及陽明山國家公園聞名，是台北市面積最大的行政區。"],
    ["台北市","北投區","女巫","北投源自平埔族凱達格蘭語Patauw，意為「女巫」，因地熱噴發、煙霧繚繞如巫覡作法之地而得名。","","北投地名源自平埔族凱達格蘭語「Patauw」，意思是「女巫」。這一帶因大屯火山群地質活動旺盛，地熱谷終年硫磺煙霧瀰漫、溫泉汩汩湧出，景象在當時原住民眼中彷若女巫作法施術的神秘場域，因而以「女巫」為這片土地命名，漢人依音譯記為「北投」。事實上，北投的地熱與溫泉資源不僅只在地名上留下痕跡，更深刻影響了當地的產業發展：清代已有漢人利用硫磺開採謀生，日治時期更因看中北投溫泉的療養價值，仿照日本溫泉鄉規劃興建大量溫泉旅館與公共浴場，其中1913年落成的北投溫泉公共浴場（今北投溫泉博物館）便是當時東亞最大的溫泉浴場之一。如今北投區仍是台北市最重要的溫泉觀光勝地，地熱谷、新北投溫泉區與硫磺產業，恰好呼應了「女巫」這個帶著幾分神秘色彩的古老地名由來。"],
    ["台北市","內湖區","內湖","內湖因地勢四周略高、中央低窪，早期積水如湖而得名。","","內湖區的地名由來相對單純直白，源自其地形特徵：這一帶四周有丘陵環繞，中央則是相對低窪的盆狀地形，早期排水不易，容易積水成湖，因而被稱為「內湖」，意指盆地內部的湖泊窪地。清代漢人入墾此地後，陸續開闢埤塘與水圳排除積水、發展農業，才逐漸將原本濕地般的內湖轉變為可耕種的良田。日治時期，內湖與大直、南港一帶同屬台北近郊的農業地帶，以茶葉、蔬果種植為主；戰後隨著台北市區向東北擴張，加上1980年代以後內湖科技園區的開發，內湖逐漸從農業地帶轉型為台北市重要的科技產業重鎮，成為眾多科技公司總部的所在地。如今內湖區境內仍保有大湖公園、內湖運動公園等以水域景觀為特色的公園綠地，某種程度延續了這片土地與「湖」之間的地理淵源。"],
    ["台北市","南港區","南港","南港因相對於汐止（北港），位於基隆河南岸而得名。","","南港區的地名由來，與同樣位於基隆河沿岸、隔河相對的汐止（舊稱水返腳，昔日也稱北港）有密切關係：南港因位於基隆河南岸，相對於北岸的汐止，因而得名「南港」，是台灣許多以方位詞命名的河港聚落之典型例子。清代，南港因基隆河航運之便，成為茶葉、煤礦等物產運輸的重要口岸，加上文山、深坑一帶所產的包種茶多經此地轉運出口，一度發展出繁榮的港埠街市。日治時期及戰後，隨著鐵路、公路系統逐漸取代河運功能，加上南港一帶蘊藏豐富的煤礦資源，南港轉型為工業重鎮，中央研究院也在此設立院區。近年來，南港軟體園區、南港車站與台北流行音樂中心等建設陸續完工，使南港從昔日的河港與工業區，逐步蛻變為台北市東側重要的交通樞紐與新興商辦中心。"],
    ["台北市","文山區","拳山","文山區舊稱拳山，因山形似拳頭而得名，日治時期因「拳」字不雅，取「文山秀氣」改稱文山。","","文山區舊稱「拳山」，這個地名源自區內一座山丘的形狀，遠望山頭渾圓突起，宛如一隻緊握的拳頭，因而得名。清代這一帶原屬「拳山堡」的行政區劃範圍，涵蓋今日的景美、木柵一帶。日治時期，日本殖民政府在推行地方行政改制時，認為「拳山」二字帶有暴力、粗獷的意涵，不夠文雅，於是取附近山巒「文山秀氣」之意，將地名改為「文山」，這也是台北市文山區名稱的由來。1990年台北市行政區重劃，將原本各自獨立的景美區與木柵區合併，並沿用「文山」之名設立文山區，成為台北市面積第二大的行政區。如今文山區境內仍保有貓空、指南宮等丘陵地景與宗教信仰重鎮，是台北市山林景觀保存最完整的行政區之一。"],
    ["台北市","社子","社仔","社子舊稱社仔，因是昔日凱達格蘭族麻少翁社的聚落所在地而得名。","","社子位於基隆河與淡水河交會口附近，這片沙洲地帶清代原是平埔族凱達格蘭族「麻少翁社」的傳統聚落範圍，漢人習慣以「社」字指稱原住民部落，「仔」則是閩南語表示小型聚落的後綴，兩字合稱「社仔」，意指小型的番社聚落，後來雅化為「社子」。由於地處兩河交會的低窪沖積地帶，社子長期以來地勢低平、容易淹水，加上台北市都市計畫長期將此地劃為限制發展區，因此保留了相對完整的農地與傳統聚落景觀，與周邊快速都市化的士林、大同等區域形成鮮明對比，這片區域也因此被稱為「社子島」。近年來，台北市政府陸續推動社子島的區段徵收與開發計畫，試圖在防洪治水與都市發展之間取得平衡，讓這個保留平埔族記憶的古老地名，未來可能迎來新的地貌變化。"],
    ["台北市","關渡","干豆","關渡源自平埔族語Kantou，早期漢字寫作干豆、甘答等多種音譯，因位居淡水河與基隆河交會口而成要津。","","關渡地名源自原住民語「Kantou」，另有一說是西班牙人所稱的「Casidor」，由於是原住民語言的音譯，清代文獻中出現過干豆、甘答、干荳、肩脰、墘竇、關杜等十餘種不同漢字寫法，直到乾隆25年（1760年）的《臺灣府志》才開始使用「關渡」二字，日治時期一度改稱「江頭」，戰後才恢復關渡舊名並沿用至今。關渡地處淡水河與基隆河交會之處，兩岸分別是大屯山與觀音山的餘脈，山勢相夾形成天然峽口，自古便是進出台北盆地的重要水運關卡與渡口，因而得名。康熙51年（1712年），通事賴科在此募建天妃廟（即今日的關渡宮），主祀媽祖，是台灣北部歷史最悠久的媽祖廟之一，民間更流傳「南有北港媽，北有干豆媽」的諺語，可見關渡宮在北台灣民間信仰中的重要地位。如今關渡因濕地生態豐富，已成為台北市重要的候鳥棲息地與自然公園。"],
    ["台北市","天母","天母","天母原是日治時期「天母教」神社周邊的小地名，並非坊間流傳因美軍問路答「聽無」而來。","","天母舊稱「三角埔」，清代與日治時期官方地名皆以三角埔稱之，「天母」原本只是境內一處極小的地名。1933年，日本人中治稔郎將神道信仰與台灣民間的媽祖信仰結合，在士林三角埔東側山坡興建「天母神社」，供奉天照大神與天上聖母（媽祖），並創立「天母教」，宣稱兩者其實是同一位神明的不同化身；由於神社周邊逐漸聚集商店與溫泉旅館，這一帶便被稱為「天母」，地名因而流傳開來。坊間長期流傳另一種說法，指天母之名源自戰後美軍問路，當地人以台語回答「聽無」（聽不懂），因諧音而得名，但這個說法其實與史實不符，正確的由來仍是日治時期的天母教與天母神社。1945年戰後，神社遭到拆除，原本供奉的媽祖與其他神像先移至附近廟宇安置，1979年信眾另建三玉宮加以奉祀，成為今日天母地區重要的信仰中心。"],
    ["台北市","石牌","石牌","石牌因清乾隆年間官府在此豎立漢番界碑，用以劃分漢人與原住民土地界線而得名。","","石牌地名源自一塊真實存在的石碑：清雍正、乾隆年間，大量漢人移民進入北投一帶開墾，與原本居住於此的凱達格蘭族原住民時常因土地問題發生糾紛。乾隆十至十三年間（1745年至1748年），淡水廳同知曾曰瑛為釐清雙方界線、避免衝突，下令在漢人與原住民土地交界處豎立界碑，碑文寫著「奉憲分府曾批斷東勢田南勢園歸番管業界」，明確劃定雙方可耕作的範圍，這塊界碑就此成為當地的地標，因而得名「石牌」，閩南語稱「石牌仔」。這塊石碑歷經多次遷移，一度移至石牌派出所院內保存，1999年因派出所改建，最終遷至台北捷運石牌站前廣場公開展示，成為台北市少數以清代原漢界碑為名稱由來、且實物仍保存至今的地名案例。石牌一帶因鄰近榮民總醫院與陽明大學等醫學院校，如今已發展成醫療與商業機能兼具的生活圈。"],
    ["台北市","大直","大直","大直因基隆河截彎取直工程完成前，此河段本就相對筆直而得名。","","大直地名由來與基隆河的河道地形密切相關：這一段基隆河流經大直、內湖一帶時，相較於上下游其他蜿蜒曲折的河段而言，河道顯得較為筆直，因而被稱為「大直」。這種以河道形狀直接命名周邊聚落的方式，在台灣早期依水而居的開發模式中相當常見。清代與日治時期，大直因鄰近基隆河與台北盆地邊緣的丘陵地，多為農業與林業用地，開發程度相對較低；直到戰後，隨著美軍協防台灣期間在此設立美軍宿舍區，以及後續中山高速公路、國道等重大交通建設陸續通過，大直才逐漸從邊陲農業地帶轉型為住宅與商業機能兼具的區域。如今大直橋、美麗華百樂園等地標讓這個因河道筆直而得名的地方，成為台北市東北區重要的生活機能與休閒購物去處。"],
    ["台北市","圓山","圓山仔","圓山舊稱大龍峒山、大龍山，因山丘平緩渾圓，後人改稱圓山並沿用至今。","","圓山原名「大龍峒山」或「大龍山」，因鄰近大浪泵社（大龍峒）而得名；相傳因這座小山丘風水形勢如龍盤踞，才選用「大龍」二字為名，而非直接沿用原住民地名「大浪泵」。由於整座山丘地勢平緩、外觀渾圓，後人逐漸改以「圓山」（閩南語稱圓山仔）稱呼這座位於基隆河南岸、標高僅約36公尺的獨立小丘，這個較為通俗直白的稱呼最終取代了原本的雅稱，沿用至今。1897年，台灣總督府在圓山設立全台第一座都會公園，開啟了這座山丘作為公共休憩空間的歷史；1950年代，坐落於鄰近劍潭山上的圓山大飯店落成後，「圓山」一名也漸漸擴大用來泛指周邊的劍潭山一帶。如今圓山不僅有台北市立兒童育樂中心、花博公園等設施，山腳下更保存了距今數千年的圓山史前遺址，見證台北盆地悠久的人類活動歷史。"],
    ["台北市","古亭","鼓亭","古亭地名由來眾說紛紜，包括防禦原住民出草的「鼓亭」、儲糧用的「穀亭」等多種說法，至今仍有爭議。","","古亭地名的由來長期眾說紛紜，最廣為流傳的說法是：清代漢人為防範新店一帶原住民出草，在今日古亭一帶設置哨站，內置大鼓作為警戒示警之用，稱為「鼓亭」，後因閩南語「鼓」與「古」同音，日治時期為求書寫方便而改寫為「古亭」。另一種說法則認為，當地早期設有許多用來儲存稻穀的「穀亭畚」，是家族財富的象徵，因而得名「穀亭」，後同樣因諧音簡化為古亭。然而近年也有學者指出，這兩種說法其實都有時代與地理上的矛盾：文獻中「古亭村」最早出現於十八世紀中葉，早於鼓亭傳說所指涉的十九世紀末原漢衝突事件；且古亭距離傳說中的衝突地點新店相當遙遠，以擊鼓示警在邏輯上也有疑問。無論確切由來為何，古亭作為連接台北市中心與文山、新店的交通要衝，清代已因水圳流經而形成聚落，如今則是南昌路家具街、牯嶺街舊書街等特色街區的所在地。"],
    ["台北市","公館","公館","公館因清代業主在此設立辦事收租的「公館」（管理處）而得名。","","公館地名由來與清代台灣常見的土地拓墾制度有關：早年來台開墾的業戶（地主）為了就近管理佃農耕作、收取田租，通常會在轄下墾地興建一座辦事處，供管理人員或業主本人居住辦公，這樣的建築在民間慣稱「公館」，久而久之便成為周邊聚落的地名，這種命名方式在台灣各地相當常見，不僅台北市有公館，桃園、苗栗等地也都有以公館為名的聚落。台北市的公館位於新店溪畔，清代因鄰近瑠公圳等重要水利設施，加上是台北盆地與文山、新店等山區聯繫的交通要道，逐漸發展成繁榮的市街。日治時期及戰後，隨著國立台灣大學在此設立校區，公館一帶因大量學生與教職員進駐，發展成商店、書店、小吃林立的學生商圈，也是台北捷運公館站的所在地，如今是台北市重要的年輕人消費與生活機能核心區域之一。"],
    ["台北市","景美","梘尾","景美舊稱梘尾，因位於引水灌溉的木製水槽（梘）尾端而得名，後改寫為近音的景美。","","景美舊稱「梘尾」，這個地名與清代的水利工程密切相關：早期為了將新店溪的水引入台北盆地灌溉農田，先民修築了「霧裡薛圳」等水圳，遇到低窪地形時，會架設木製或竹製的大型水槽讓水流通過，這種水槽在閩南語中稱為「梘」（或寫作「笕」）。景美一帶剛好位於這條水圳渠道尾端，因而被稱為「梘尾」，日治時期文獻中也寫作「笕尾」。由於「梘尾」與台語的「景尾」發音相近，加上「梘尾」字面不夠典雅，日治後期逐漸改寫為「景尾」，戰後又進一步雅化為更美觀吉祥的「景美」，並沿用至今。景美因地處台北盆地通往新店、深坑的交通要衝，加上有景美溪流經，自清代以來便是重要的物產集散地，如今則以景美夜市、景美國小旁的仙跡岩登山步道聞名。"],
    ["台北市","木柵","木柵","木柵因早期漢人為防禦原住民出草，在此興建木造柵欄防禦工事而得名。","","木柵地名由來與清代漢人拓墾時期的族群衝突背景密切相關：這一帶鄰近山區，是泰雅族等原住民傳統活動範圍與漢人拓墾前線的交界地帶，雙方時常因土地開墾問題發生衝突。為了防範原住民出草侵擾，當地漢人便在聚落周圍以木材搭建高聳的柵欄，作為防禦工事與警戒之用，這樣的木造防禦設施在閩南語中稱為「木柵」，久而久之便成為這片聚落的地名。清代木柵一帶隸屬「拳山堡」，是台北盆地南側通往深坑、石碇等地的重要山區門戶，也因鄰近丘陵地形而發展出台灣少見的鐵觀音茶產區，貓空一帶至今仍以優質茶葉聞名。1990年台北市行政區重劃，木柵與景美合併為文山區，但「木柵」之名仍廣泛使用於木柵動物園、貓空纜車等知名地標，延續這段因防禦原住民而興建柵欄的歷史記憶。"],
    ["台北市","六張犁","六張犁","六張犁地名源自清代開墾面積單位，以每張犁五甲計算，此地開墾面積共計六張犁（三十甲）。","","六張犁地名源自台灣清代拓墾時期常見的土地計算方式：早期漢人拓墾以「犁」作為計算開墾面積的單位，一張犁約可耕作五甲土地，六張犁便代表這片墾地的總面積約為三十甲，是依據實際開墾規模直接命名的典型範例。這種以犁數命名地方的方式在台北盆地相當常見，新店一帶便有七張、十二張、十四張、二十張等類似地名，都是同一套計算邏輯下的產物。清代六張犁隸屬大加蚋堡下的「六張犁庄」，與大安庄、三張犁庄等聚落相鄰，主要以農業墾殖為主。1990年台北市行政區重劃，六張犁東半部劃入新設立的信義區，西半部則留在大安區，因此六張犁地區現今橫跨大安、信義兩區交界。如今六張犁一帶因鄰近國防醫學院舊址與多處靈骨塔、墓園，加上臨近的和平東路商圈，兼具住宅機能與歷史記憶。"],
    ["台北市","唭哩岸","Ki-Irigan","唭哩岸源自凱達格蘭族語，意為「海灣」，是漢人在台北盆地最早開墾的發源地。","","唭哩岸地名源自平埔族凱達格蘭語「Ki-Irigan」，一般認為意指「海灣」，因這一帶原是舊淡水河向北突出、形似海灣的彎曲地帶；另有一說認為意指「湖岸」，反映台北盆地在地質史上一度是鹹水湖或內海的地形記憶，2003年國立陽明大學鑽探地質時，曾挖出含鹹水貝殼的唭哩岸石，為這個說法提供了有力佐證。根據《淡水廳志》記載「淡水開墾，自奇里岸（唭哩岸）始」，這裡是漢人進入台北盆地開墾的第一站，早在清初便已形成「唭哩岸街」（即今立農街），是淡水河北側最早發展的市街，商業全盛時期甚至有「九萬廿七千」的俗諺，形容當地擁有巨額資產的富戶眾多。除了農業墾殖，唭哩岸山一帶盛產石英砂岩，質地耐酸耐高溫又便於運輸，被稱為「唭哩岸石」，曾是台北地區建築、燒磚窯業的重要建材來源。1997年捷運淡水線通車設站後，這個一度被遺忘的古老地名才重新廣為人知。"],
    ["台北市","大龍峒","大浪泵","大龍峒原稱大浪泵，源自平埔族社名，後因同安人「興隆同安」之意及文風鼎盛而雅化為大龍峒。","","大龍峒是早於大稻埕、僅次於艋舺開發的台北盆地舊聚落，原為平埔族凱達格蘭「巴琅泵社」（又寫作大浪泵社）的居住地，「巴琅泵」是荷蘭文獻中「Pourompon」的音譯。1709年陳賴章墾號取得開墾許可後，漢人才大量進駐這片區域。乾隆年間，因艋舺同安人在地方械鬥中處於劣勢，開始遷移至大浪泵另闢天地，並集資興建俗稱「四十四坎」的商業街（即今哈密街），以及主祀保生大帝、俗稱大浪泵宮的保安宮，取「保佑同安人」之意。此後，同安人取「興隆同安」的期許，將地名雅化為「大隆同」，又因當地文風昌盛、科舉人才輩出，加上圓山仔一帶舊稱「大龍山」，最終演變為兼具吉祥與文雅意涵的「大龍峒」，成為今日台北市大同區地名的由來之一。境內的保安宮與台北孔廟至今仍是大龍峒重要的信仰與文化地標。"],
    ["台北市","劍潭","劍潭","劍潭之名有荷蘭軍人插劍於樹、及鄭成功拋劍伏魚精兩種傳說，實際上以荷蘭插劍說的文獻年代最早。","","劍潭地名的由來流傳著兩種截然不同的傳說。年代較早、文獻記載較完整的說法出自清雍正十年（1732年）成書的《臺灣志略》，記載此地潭岸有一棵高聳的茄苳巨樹，相傳荷蘭軍人曾將佩劍插入樹幹，樹皮逐漸增生包覆，將寶劍完全隱沒其中，因而得名劍潭；《淡水廳志》更記載每逢黑夜風雨，潭面便會浮現紅光，相傳是潭底荷蘭古劍所發出的靈氣，「劍潭夜光」曾被列為淡水八景之一。另一則流傳更廣、卻是日治時期才出現的版本，則將主角換成了民族英雄鄭成功：相傳鄭成功率軍行經此地時，遭遇興風作浪的魚精或蛟龍，鄭成功拔劍擲入潭中降服妖怪，寶劍因此沉入潭底，成為劍潭之名的由來。學者考證後認為，鄭成功插劍或擲劍的傳說並無確切史料佐證，很可能是後人將原本的荷蘭人傳說與鄭成功的歷史形象混合附會而成，但這則故事至今仍是劍潭一帶最廣為人知的地名傳說。"],
    ["台北市","西門町","西門町","西門町因位於清代台北府城西門（寶成門）外而得名，日治時期規劃為仿東京淺草的娛樂商圈。","","西門町地名的由來，直接源自清代台北府城的城門：台北城共設有五座城門，其中西側的「寶成門」由艋舺富商集資興建，是五座城門中最為華麗氣派的一座，因地處連結艋舺商圈與城內的交通要衝而格外重要。1904年，日本殖民政府以推動市區改正與鐵路修築為由，拆除了寶成門及其城牆，但「西門」作為地理位置的稱呼卻保留了下來。1908年，總督府開始整頓西門外原本荒蕪、多為墳地的沙地，並仿效日本東京淺草區的規劃模式，在此興建劇場、市場與商店街，發展成新興的休閒娛樂特區；1922年，這片區域正式以行政區劃名稱「西門町」定名。由於當時鄰近的八角堂（今西門紅樓）、榮座等戲院、劇場林立，加上戰後中華商場的興建，西門町逐漸成為台北市最重要的商業與娛樂中心之一，直到1980年代東區商圈崛起後才漸趨沒落，1990年代末改造為行人徒步區後才又重現生機，如今是台北年輕族群與國際觀光客熱門的朝聖去處。"],
    ["台北市","加蚋仔","加蚋","加蚋仔地名源自平埔族語，意為沼澤地，清代因土質肥沃盛產花卉、蔬菜而聞名。","","加蚋仔是台北市萬華區雙園一帶的舊地名，源自平埔族語「Gala」，意指沼澤或濕地，反映這片區域早期地勢低窪、排水不良的地形特徵，清康熙年間文獻中稱為「加臘仔庄」。由於當地土質鬆軟肥沃，加上鄰近新店溪沖積帶來的沙質壤土，排水良好又保水力佳，清代以來便是重要的農業生產地帶，居民多種植甘蔗、蔬菜與各類瓜果，供應艋舺、大龍峒等鄰近聚落所需；其中又以薰茶用的茉莉花、黃梔花最為知名，可賣給艋舺、大稻埕的茶行加工薰製包種茶。日治後期因戰爭導致茉莉花滯銷，加上地下水質甘美，居民轉而改種麻竹筍與孵製豆芽菜，因而有「加蚋仔三寶」（茉莉、麻竹筍、豆芽菜）的稱號流傳民間。加蚋仔內部又依聚落分為堀仔頭、八張犁、後庄仔、下庄仔、港仔尾等角頭，至今仍延續每年農曆三月十二日迎尪公遶境的「年例」信仰傳統，是加蚋仔重要的地方文化資產。"],
    ["台北市","華山","樺山","華山原名樺山町，日治時期為紀念首任台灣總督樺山資紀而命名，戰後依諧音改為華山。","","華山地區在日治時期稱為「樺山町」，是1922年台北市實施町名改正時所劃定的行政區之一，其命名是為了紀念首任台灣總督樺山資紀——他是1895年日本依馬關條約接收台灣後，第一位赴台就任的最高統治者。樺山町當時範圍大致涵蓋今日忠孝東路、林森南路、金山南路一帶，區內設有台北鐵路貨運樞紐「樺山貨物取扱所」，是日治時期重要的物流轉運據點。戰後，國民政府接管台灣，考量到「樺山」二字帶有濃厚的日本殖民統治色彩，便依其中文發音相近之處，將地名改為較無政治意涵的「華山」，這也是今日華山車站、華山藝文特區等地名的由來。原本的貨運倉庫與酒廠建築，一度荒廢，直到2000年代由文化部門接手活化，轉型為華山1914文化創意產業園區，成為台北市重要的藝文展演與文創聚落，也讓這個源自殖民地總督之名的地名，逐漸轉化出全新的文化意涵。"],
    ["台北市","松山菸廠","松菸","松山菸廠1937年由台灣總督府專賣局興建，是台灣第一座現代化捲菸工廠，因位於松山區而得名。","","松山菸廠全稱「臺灣總督府專賣局松山菸草工場」，於1937年動工興建，1939年正式完工投產，是台灣日治時期第一座具規模的現代化捲菸工廠，因廠址位於當時的松山庄（今松山區、信義區交界一帶）而得名。菸廠採用「工業村」的規劃概念，除了生產線廠房，也一併考量員工福祉，興建了員工宿舍、澡堂、育嬰室與大片庭園綠地，建築風格屬於強調簡潔線條的「日本初現代主義」，在當時的工業廠房建築中相當前衛先進。戰後，這座工廠由台灣省菸酒公賣局接手經營，持續生產長壽、新樂園等知名香菸品牌，直到1998年因產能整併而停止生產。松山菸廠舊址在停產後保留了大片綠地，2001年獲台北市政府指定為市定古蹟，2010年正式轉型為「松山文創園區」對外開放，成為台北市東區重要的藝文展演與文創聚落；廠區內另有台北文創大樓與台北大巨蛋等新建設施，與保存完整的日治廠房古蹟比鄰而立，形成新舊並存的獨特城市地景。"],

    // --- 【新北市】 ---
    ["新北市","板橋區","枋橋","板橋舊稱枋橋，因清代先民在公館溝上架設木板橋供人通行而得名，日治時期雅化為板橋。","","板橋區舊稱「枋橋」，這個地名的由來與一座實際存在過的木橋有關：清代板橋一帶原是平埔族擺接社的活動範圍，漢人入墾後，商旅貨物在「湳仔港」上岸，須經由「公館溝」才能運往聚落，先民便在溝渠上搭建一座木板橋，供人貨通行，這座橋所在的位置便被稱為「枋橋頭」，閩南語「枋」即木板之意。板橋開發史上最關鍵的推手是林本源家族：這個原籍漳州的家族在19世紀中葉遷居枋橋，並沿著公館溝東南岸興建「枋橋城」，設置城門與防禦工事，使枋橋逐漸發展成擺接十三庄的商業與信仰中心，林家花園（林本源園邸）至今仍是板橋最重要的古蹟地標。1920年，日本殖民政府推行地方行政改制，將「枋橋」正式改為日式讀音相近的「板橋」，戰後沿用至今，但台語仍習慣讀作「枋橋」（pang-kiô），保留著這段木板橋的歷史記憶。"],
    ["新北市","三重區","三重埔","三重舊稱三重埔，是清代依淡水河沿岸開墾先後次序命名的第三段埔地。","","三重地名的由來，反映了清代淡水河沿岸拓墾聚落的一種常見命名方式：先民沿河開發土地時，依墾殖先後順序為各段埔地（未開墾的河濱平地）編號命名，最早開發的稱為「頭前埔」，其後依序為「二重埔」「三重埔」，三重正是這套次序中的第三段，意指位於二重埔外側、更晚開發的埔地。隨著淡水河逐漸淤積，原本可供船隻停靠的頭前埔碼頭機能喪失，泥沙沖積形成的新生沙洲不斷向外擴展，登陸地點也隨之向外遞移，三重埔便是在這樣的過程中逐漸成形的聚落。日治時期，三重埔簡化為「三重」，因與台北大稻埕、大龍峒等艋舺對岸聚落隔淡水河相望，加上鐵路、公路等交通建設帶動，戰後迅速發展為台北都會區重要的衛星市鎮，如今是新北市人口密度最高的行政區之一。"],
    ["新北市","中和區","漳和","中和舊稱漳和，因漳州人移民在此定居、祈求「漳州人和睦」之意而得名，後諧音轉為中和。","","中和地名的由來有兩種主要說法。第一種說法指出，中和一帶清代原稱「漳和」（或寫作彰和，1764年文獻已見記載），是由漳州籍移民所建立的聚落，取「漳州人和睦相處」之意命名；由於「漳和」與「中和」的台語發音相近，後來便逐漸轉寫為「中和」。另一種說法則認為，「中和」這個地名是從境內「中坑」與「漳和」兩個聚落名稱中，各取一字組合而成。中和地區清代隸屬擺接堡，與板橋、土城同屬林本源家族勢力範圍，因鄰近新店溪與景美溪，農業與樟腦業曾是重要產業。1958年，因人口增加，中和鄉劃出頂溪、上溪、網溪等地成立永和鎮，兩地雖已分治，但地名典故中「和睦」的期許，至今仍隱含在中和、永和這兩個相鄰行政區的名稱之中。"],
    ["新北市","永和區","溪洲","永和舊稱溪洲，1957年由地方耆宿楊仲佐取名，期許各籍移民和睦共處、追求「永久的和平」。","","永和地區清代原屬中和鄉的一部分，因位於新店溪沖積形成的沙洲地帶，舊稱「溪洲」。1947年，隨著人口增加，溪洲一帶劃出頂溪、上溪、網溪三村，1958年正式分鄉設鎮，脫離中和鄉獨立。關於「永和」這個新地名的由來，據地方文獻記載，是由地方耆宿楊仲佐先生所提議：他認為無論是本地原有的泉州籍居民、鄰近中和的漳州籍居民，或是戰後遷入的各省籍新移民，都應體認和睦團結的重要性，才能共同建設繁榮的家園，因此取「永久的和平」之意，將這座新設立的行政區命名為「永和」。這個充滿理想色彩的地名，恰好與同樣帶有「和」字、卻源自漳州移民期許的鄰居「中和」相互呼應，成為新北市地名中少見、直接寄託族群和諧願景的命名案例。1979年，永和鎮升格為縣轄市。"],
    ["新北市","新莊區","新莊","新莊因清代雍正年間漢人在淡水河畔建立新興聚落而得名，是清代台北盆地最早開發的市街之一。","","新莊地名的由來相對直白：清康熙末年已有漢人進入此地開墾，雍正年間，隨著人口增加、聚落逐漸成形，因這是一處新興建立的莊社，便直接以「新莊」為名，另有一說認為是由原本的「新的武勞灣莊」簡化而來，武勞灣則是當地平埔族社名的音譯。新莊憑藉淡水河的航運之利，成為清代台北盆地開發最早、也最繁榮的市街之一，一度是北台灣的行政與商業中心，直到淡水河逐漸淤積、加上艋舺興起分食商機後，新莊的地位才逐漸被取代。境內的新莊慈祐宮、新莊武聖廟與新莊文昌祠並列台閩地區三級古蹟，見證了新莊作為早期市街的信仰與文教發展。戰後新莊迅速工業化，人口大量移入，1980年由鎮升格為市，2010年隨台北縣升格為新北市而改制為區，是新北市人口最多的行政區之一。"],
    ["新北市","新店區","新店","新店因清代嘉慶、道光年間移民在碧潭東岸新建店舖成街，有別於既有的舊店街而得名。","","新店地名的由來流傳著幾種說法，但核心都圍繞著「新建的店舖街」這個概念。一種說法是嘉慶、道光年間，墾首陳合發、李詳記等十餘人合資，招募泉州佃戶向泰雅族傳統領域拓墾，在碧潭東岸一帶興建店舖形成街市，因有別於大坪林原有的「店仔街」，故稱「新店」；另一說則指道光年間泉州人林章存在碧潭東岸開墾的店舖街曾遭山洪沖毀，重建後為區分新舊而稱新店；還有一說認為，光緒年間官府在上游屈尺設置撫墾機構，漢人因而在此新設店舖與原住民交易，故稱新店。新店溪由源自烏來的南勢溪與源自坪林的北勢溪匯流而成，是淡水河系最重要的支流之一。日治時期興建的新店線鐵路，帶動沿線木材、茶葉、煤礦的運輸，也讓碧潭一帶發展成台北近郊著名的觀光勝地。"],
    ["新北市","樹林區","風櫃店","樹林因清乾隆年間先民在水圳堤岸廣植林木以固岸護堤，樹木繁茂而得名。","","樹林地名由來與清代的水利建設密切相關：乾隆31年（1766年），業戶張沛世、張必榮開鑿「永安陂」（俗稱張厝圳）灌溉農田時，為了鞏固水圳東側的護岸，在堤岸上栽種了大量樹木，這些樹木日漸繁茂成林，因而使這片區域得名「樹林」。隨著往來的商販與居民增多，人們逐漸砍伐林木闢地開店，形成小型市街，但圳岸上游一帶的樹林依然茂密，直到1910年因水圳改修工程才被砍伐殆盡。樹林另有一個更為人熟知的舊稱「風櫃店」，據考證是因當地曾有店鋪使用「風櫃」（一種手拉式鼓風設備）從事打鐵業，鍛造農具鐵器而得名；日治時期文獻也記載此地確實曾有打鐵店經營的紀錄。1920年，樹林區一度與鶯歌石區、三角湧區部分合併為「鶯歌庄」，直到後來才又獨立設區，如今是新北市重要的工商業重鎮之一。"],
    ["新北市","鶯歌區","鶯歌石","鶯歌因山上一塊巨石形似展翅的鷹鳥而得名，相傳鄭成功曾發箭降伏鶯歌與鳶山兩隻興風作浪的妖鳥。","","鶯歌地名源自區內一塊高約十公尺的巨大砂岩「鶯歌石」，這塊岩石因風化侵蝕露出山坡，外形宛如一隻收攏羽翼、引頸而立的猛禽，清代文獻最早記為「鷹哥石」，後因「鷹」與「鶯」發音相近，加上「哥」字被認為是無意義的語助詞，逐漸演變為今日的「鶯歌」。民間流傳一則生動的傳說：相傳鄭成功率軍北上時，鶯歌與三峽的鳶鳥相互鬥法，競吐瘴氣毒害往來行人，鄭成功聞訊後在樹林太平橋搭弓射箭，將兩隻妖鳥射死，化為今日的鶯歌石與鳶山。不過學者林衡道指出，鄭成功一生活動範圍僅止於台南一帶，這則傳說很可能是福建、廣東一帶巨石成精故事的在地化版本。饒富趣味的是，當地原住民則流傳另一種說法：相傳其祖先曾躲藏在鶯歌石中狙擊漢人，卻不敵砲火而被迫離開家園，反而被漢人誤傳為鳥妖作怪。如今鶯歌以陶瓷產業聞名全台，有「台灣景德鎮」之稱。"],
    ["新北市","三峽區","三角湧","三峽舊稱三角湧，因大漢溪、三峽河、橫溪三條溪流在此匯合形成三角形沖積平原而得名。","","三峽舊稱「三角湧」，這個地名直接描述了當地的地理特徵：大漢溪（舊稱大嵙崁溪）、三峽河（舊稱三角湧溪）與橫溪三條河流在此交會，沖積出一片三角形的平原地帶，加上溪水在匯流處激盪翻騰、水勢洶湧，閩南語稱水流翻騰為「湧」，因而得名三角湧。清初，泉州人陳瑜自鶯歌招募佃丁進墾此地，其後泉州安溪人董日旭也率族人前來拓墾，逐漸在這片三角沖積平原上形成聚落。三峽因群山環繞、氣候濕潤，清代以來便是重要的樟腦與藍靛（大菁染料）產地，加上1860年淡水開港通商後，樟腦貿易更加興盛，帶動了三峽老街的繁榮發展，1767年興建的三峽祖師廟也成為地方信仰核心。1920年，日本殖民政府將「三角湧」簡化雅化為「三峽」，取其溪流匯聚如峽谷之意，沿用至今。"],
    ["新北市","淡水區","滬尾","淡水舊稱滬尾，「滬」指石滬（利用潮汐捕魚的石堤），滬尾即石滬設置範圍的末端。","","淡水舊稱「滬尾」，關於這個地名的由來主要有兩種說法：一說「滬」是指早期漁民在海濱或河口以石塊堆砌而成、利用潮水漲退捕魚的「石滬」，滬尾便是這類石滬分布範圍最末端之處；另一說則認為閩南語中「滬」與「雨」發音相近，意指此地多雨，但經過這裡雨勢便會停歇，故稱滬尾。淡水地處淡水河出海口，17世紀西班牙人、荷蘭人相繼在此興建聖多明哥城、紅毛城等要塞，是台灣最早與西方接觸的據點之一。1860年天津條約簽訂後，淡水開港通商，一躍成為19世紀台灣最重要的國際貿易港口，茶葉、樟腦等物產由此出口，馬偕博士也在此展開傳教與醫療、教育事業，留下滬尾偕醫館、淡江中學等歷史建築。1920年，日本殖民政府依淡水河之名，將滬尾正式改稱「淡水」，沿用至今，如今仍是台灣著名的歷史文化與夕陽觀光勝地。"],
    ["新北市","汐止區","水返腳","汐止舊稱水返腳，因基隆河潮汐漲潮時海水可溯河而上，至此處便回流退去而得名。","","汐止地名的由來，直接描述了基隆河下游受潮汐影響的水文特徵：每當滿潮時分，海水會沿著淡水河溯流進入基隆河，一路上溯直到今日汐止一帶，潮水漲勢便到此為止而開始回退，因而得名「水返腳」，意指潮水返回之處。這種因應潮汐現象命名地方的方式，反映了先民對河川水文特性的細膩觀察。水返腳因扼守基隆河航運要衝，清代以來便是台北盆地與基隆之間重要的水陸轉運據點，加上鄰近山區盛產煤礦、茶葉，一度發展成繁榮的河港市街。1920年，日本殖民政府推行地方行政改制時，取「潮汐至此而停止」之意，將「水返腳」簡化雅化為「汐止」，沿用至今。如今汐止因鄰近台北市，加上高速公路、捷運系統陸續完工，已從昔日的河港小鎮轉型為新北市重要的科技產業與住宅聚落。"],
    ["新北市","瑞芳區","瑞芳","瑞芳是全台唯一以商店店名作為地名的鄉鎮，源自清末一家兼作淘金補給站的雜貨店店號。","","瑞芳是台灣三百多個鄉鎮市中，唯一以「商店名稱」直接作為地名的特例。清光緒年間，由於陸路交通不便，往來台北與噶瑪蘭（今宜蘭）之間的旅人，多仰賴基隆河水運補給，河岸渡口「柑仔瀨」附近，有陳姓、賴姓商家開設一間名為「瑞芳」的雜貨店，店內南北雜貨齊備，成為往來旅客與後來淘金客的中途補給休息站。由於往來者眾多，大家不約而同以「去瑞芳」「從瑞芳回來」相稱，久而久之，「瑞芳」便從一間商店的店號，演變成整個聚落的地名。光緒19年（1893年）九份溪發現砂金，隔年金瓜石也傳出金礦，瑞芳因地處往返礦區的必經之路，隨著淘金熱潮迅速發展，加上後來鐵路在龍潭堵設站，發展重心也隨之轉移到車站周邊，奠定今日瑞芳作為新北市東北角交通樞紐與觀光門戶的地位。"],
    ["新北市","土城區","土城","土城因清代先民為防禦擺接社原住民出草，在聚落周圍構築土牆防禦工事而得名。","","土城地名由來與清初漢人拓墾時期的族群關係有關：這一帶原是平埔族擺接社的漁獵領域，清初已有先民入墾，但因與原住民時常發生衝突，為了自保，墾民便在聚落四周構築土牆作為防禦工事，這座土牆聚落因而被稱為「土城」，沿用至今。土城因地處大漢溪畔，清代以來即是重要的農業與煤礦產地，日治及戰後時期，境內天上山、大暖尖山一帶開採的煤礦，透過鐵道運往板橋、樹林等地轉運，帶動地方經濟發展。境內的「媽祖田」與「媽祖坑古道」等地名，相傳與清代原墾戶將田產捐獻給媽祖廟宇作為廟產有關，反映當地移民社會濃厚的民間信仰色彩。如今土城因鄰近台北市及三峽北大特區，加上台北捷運土城線、頂埔延伸線的通車，已從昔日的防禦聚落轉型為新北市重要的住宅與工業區域。"],
    ["新北市","蘆洲區","鷺洲","蘆洲因淡水河沙洲地帶蘆葦叢生、鷺鷥棲息，早期曾稱河上洲、和尚洲，後定名蘆洲。","","蘆洲位於淡水河下游西岸，是大漢溪與新店溪沖積而成的沙洲地帶，因地勢低平、常年積水，河岸兩側蘆草叢生，因而最早被稱為「河上洲」，形容聚落彷彿坐落在河面之上。乾隆年間，僧人梅福向官方申請開墾這片沙洲地，並將其作為廟產，向租戶徵收租穀，由於土地多由僧侶管理，加上「和尚」與「河上」發音相近，這片沙洲又被稱為「和尚洲」。日治時期，日本殖民政府認為「和尚洲」的稱呼不夠文雅，加上沙洲濕地本就吸引大量白鷺鷥棲息覓食，遂簡化改稱「鷺洲」（當時範圍涵蓋今三重一帶），戰後才依諧音正式定名為「蘆洲」。每當蘆花盛開時節，白鷺翱翔於蘆葦叢間的景象，曾被列為淡水八大奇景之一，稱作「蘆荻泛月」。如今蘆洲因鄰近台北市，已發展成人口稠密的都會型行政區。"],
    ["新北市","五股區","五穀坑","五股因清代五位墾戶合股出資開墾此地，原稱五穀坑，後簡化演變為五股。","","五股地名的由來，經學者尹章義考證清乾隆38年（1773年）的古契文，證實原始地名應為「五榖坑」，記載於「興直山下外庄五榖坑口」的田契合同中，顯示這裡最初可能與五穀豐收的墾殖範圍有關，另一種民間流傳的說法則認為，是因清代有五位墾戶合股出資，共同開墾這片山谷坑地，故稱「五股坑」。清代道光、咸豐年間，隨著客家移民逐漸外移、閩南移民遷入，「五榖坑」的用字簡化為「五谷坑」，再轉音演變為「五股坑」，日治時期進一步簡化定名為「五股」，沿用至今。五股丘陵自清領中葉起便是茶葉與柑橘的重要產地，五股坑尾一帶更曾是同安陳氏家族製茶產業的重鎮，茶葉一度外銷至東南亞，直到戰後才逐漸沒落。如今五股因鄰近台北港與二重疏洪道，已發展成工商業與物流機能並重的行政區。"],
    ["新北市","泰山區","山腳","泰山舊稱山腳，因位於平頂山（今林口台地）山下而得名，後因「頂泰山巖」廟宇香火鼎盛，取「登泰山而小天下」之意改稱泰山。","","泰山地名的由來歷經一次饒富文化意涵的轉變：這一帶因座落於平頂山（今林口台地）山腳下，加上境內大窠坑溪、貴子坑溪流經，具備「地勢較高而鄰近溪澗淡水」的優越條件，成為早期移民開墾水田的首選之地，因而依地理位置直接稱為「山腳」，並發展成新莊平原最早開發的地區之一，區內的明志書院更有「北台首學」之稱，人文薈萃、文風鼎盛。後來，因境內三級古蹟「頂泰山巖」（供奉清水祖師）香火鼎盛、廟貌巍峨，信眾登臨其境、俯瞰台北盆地全景時，油然生出「登泰山而小天下」之慨，這句出自《孟子》、借用中國五嶽之首泰山的典故，逐漸深植人心，「山腳」之名便相沿改稱為更具氣勢的「泰山」，沿用至今。1950年，泰山正式從新莊分治設鄉，2010年隨新北市升格改制為區。"],
    ["新北市","林口區","樹林口","林口舊稱樹林口，因林口台地早期森林茂密，是進入山區樹林地帶的入口而得名。","","林口地名的由來與其早期的自然地貌密切相關：林口台地位於台北盆地西側，早期整片台地覆蓋著茂密的森林，對於從泰山、新莊一帶往台地方向開墾的先民而言，這裡正是進入深山樹林的必經入口，因而被稱為「樹林口」，後簡化為「林口」。林口台地由於地勢較高、土壤貧瘠且缺乏地表逕流，早期農業開發程度不若台北盆地平原地帶，直到日治及戰後時期，隨著相思樹造林與茶葉種植的推廣，才逐漸發展出農林經濟。1970年代起，政府推動林口特定區與林口新市鎮開發計畫，加上高速公路林口交流道的設立，使林口從原本開發較晚的邊陲台地，轉型為台北都會區重要的衛星市鎮，境內三井Outlet、竹林山觀音寺等地標，也讓這個因森林入口而得名的地方，成為新北市西側熱門的購物與信仰去處。"],
    ["新北市","深坑區","深坑","深坑因地處景美溪河谷之中，四周山勢環繞、地形深陷如坑谷而得名。","","深坑地名由來相對直白，「坑」在閩南語地名中泛指山間匯水而下的溝谷，深坑因地處景美溪河谷之間，四周群山環繞、地勢低陷，形成一處深邃的坑谷地形，因而得名。清代深坑一帶原屬平埔族秀朗社（雷朗社）的傳統領域，漢人入墾必須先取得社番土目的同意並支付相當代價，才能取得開墾權。乾隆30年（1765年），泉州人張萬順開闢今日萬順里一帶土地，是深坑最早的拓墾中心之一；隨後大批安溪移民陸續進入，向平埔族業戶繳納費用取得土地，逐步建立起萬順寮、阿柔、烏月等聚落。深坑因地勢限制，早期以茶葉、木材與豆腐加工為主要產業，其中深坑豆腐更因水質甘美、製作技藝代代相傳，成為全台聞名的特色小吃，深坑老街也因此發展成著名的豆腐美食觀光街區，讓這個因地形得名的山谷小鎮聲名遠播。"],
    ["新北市","石碇區","石碇","石碇因溪水湍急，早期先民須在溪底繫石作為船隻停泊的「碇」，或以石塊墊作過河踏腳石而得名。","","石碇地名的由來主要有兩種說法。第一種說法認為，石碇一帶昔日溪水深且湍急，小船雖可溯溪而上載運貨物，但停泊時必須以繩索繫住石塊沉入水底作為「碇」（船錨的一種形式），才能穩固船身，因而得名石碇。第二種說法則從地形出發，指出當地溪流中遍布石塊，這些石塊被當地居民安置在溪谷中做為過河時的踏腳石，其功能類似傳統房屋大門口用來擋水、防塵的石質門檻（閩南語稱「戶碇」），因而以「石碇」為地名。石碇區地處台北盆地南緣山區，清代與深坑、坪林同屬拳山堡範圍，因山多田少，早期以種植茶葉、大菁（藍染原料）與伐木為主要產業。境內至今保留完整的石碇老街，特殊的「不見天街」建築形式（店屋二樓向外延伸遮蔽街道）與百年茶行，見證這座山城因茶業而興盛的歷史風貌。"],
    ["新北市","坪林區","坪林","坪林因地形多平坦的河階台地，且沿岸早期樹林茂密而得名。","","坪林地名由「坪」與「林」兩個描述地形與地貌的字組合而成：「坪」在閩南語地名中意指平坦的河階台地或高地平原，「林」則指樹林茂密之地，坪林區地處北勢溪流域，沿岸分布著多處因溪流沖積、堆疊而成的平坦河階地形，早期這些台地與岸邊林木茂盛，因而合稱「坪林」。坪林因地處台北盆地與宜蘭之間的山區要衝，清代已有先民沿淡蘭古道往來拓墾，日治及戰後時期，隨著北宜公路開通，坪林一度是台北通往宜蘭的必經之地，帶動沿線茶葉貿易與商業活動。坪林因氣候濕潤多霧、日夜溫差大，成為台灣重要的包種茶產區，「坪林包種茶」更享有盛名，境內設有坪林茶業博物館，展示茶葉產製的歷史與文化。隨著北宜高速公路雪山隧道通車，坪林過境交通功能雖已減弱，卻也因此保留了較為純樸的山城與茶鄉風貌。"],
    ["新北市","三芝區","小雞籠","三芝原為凱達格蘭族小雞籠社領域，日治時期取「芝蘭三堡」中的「三」「芝」二字合併定名。","","三芝區清代以前原為凱達格蘭族「小雞籠社」的傳統領域，漢人入墾後，最初稱這一帶為「小雞籠莊」（雞籠又寫作圭籠），與基隆的舊稱「大雞籠」相對應，顯示兩地在平埔族分布上的關聯性。清末光緒年間，這一帶行政區劃上隸屬「芝蘭三堡」，是當時淡水廳下轄多個以「芝蘭」為名的堡里之一（士林一帶則為芝蘭一堡）。1920年，日本殖民政府推行地方行政改制，將原本「芝蘭三堡」中的「三」與「芝」兩字擷取組合，正式定名為「三芝」，沿用至今，這種取行政區劃舊稱局部文字重新組合命名的方式，在台灣地名史上相當獨特。三芝區地處大屯山北麓與台灣海峽之間，因日照充足、土壤肥沃，是北台灣重要的茭白筍與海芋產地，近年更以每年春季盛開的海芋花田聞名，吸引大量遊客前來賞花，為這個源自平埔族古地名的濱海小鎮注入新的觀光活力。"],
    ["新北市","石門區","石門","石門因海岸礁岩受海水長年侵蝕，形成一座狀似拱門的海蝕洞而得名，是台灣本島最北端的行政區。","","石門地名最早可追溯至清康熙33年（1694年）鄭開極所編纂的《福建通志》，書中記載「石門山：旗干石西，一石中空如圓門，故名」，顯示這個地名早在三百多年前便已見於官方文獻。石門洞是由火山碎屑岩層經過長期海蝕作用形成的「海蝕拱門」，洞高約五至十公尺，因地殼隆升作用，如今已高出海平面十餘公尺，成為地殼變動的活教材，清同治年間更被選為「淡水外八景」之一。日治時期，日本人對這處奇特的海蝕地形大為驚嘆，於大正9年（1920年）設置街庄制時，正式將此地命名為「石門庄」，1934年更指定石門洞為天然紀念物「海蝕石門」，戰後沿用「石門」之名迄今。石門區地處台灣本島最北端，境內的富貴角是台灣本島最北的岬角，清代以來也是北台灣重要的茶葉產地，鐵觀音茶至今仍是當地特色農產。"],
    ["新北市","八里區","八里坌","八里舊稱八里坌，源自平埔族「八里坌社」音譯，是早於艋舺、新莊開發的台北盆地早期漢人市街。","","八里地名源自平埔族社名的音譯，荷蘭時代文獻記載為「Parihoon」，清領時期漢字寫作「八里分」或「八里坌」，即凱達格蘭族「八里坌社」的所在地。八里因地處淡水河出海口南岸，是漢人進入台北盆地拓墾最早的據點之一，開發時間甚至早於新莊、艋舺。雍正9年（1731年），清廷在此設立「八里坌巡檢」，是當時管轄整個大台北及基隆一帶事務的重要文官機構；乾隆2年（1737年），八里坌莊民更合力集資構築土牆城堡，將巡檢辦公廳舍圍起作為駐地，可惜這座土城後因風災損毀、巡檢遷署而逐漸荒廢，僅存殘蹟。1920年，日本殖民政府將地名簡化為「八里庄」，戰後改制為八里鄉，2010年隨新北市升格改為區。如今八里以十三行博物館、渡船頭老街及左岸自行車道聞名，十三行遺址更見證了此地距今千年的史前煉鐵文化。"],
    ["新北市","平溪區","石底","平溪因基隆河上游溪谷多急流瀑布，流至此地趨於平緩而得名，舊稱石底則因盛產優質煤層而聞名。","","平溪地名由來直接描述其水文特徵：基隆河上游流經山區時溪谷狹窄、多瀑布與急流，但流抵平溪一帶後，河道趨向開闊平緩，因而得名「平溪」。平溪區境內另有一個重要的舊稱「石底」，源自當地保存最完整的地層命名——因蘊藏豐富煤層與油氣，「石底層」在礦業史上占有重要地位，清領末期至日治時期，平溪因煤礦業興盛而繁榮一時，1918年礦業家顏雲年創立台陽礦業株式會社，全面開採本區煤礦，並斥資興建平溪線鐵路，帶動十分、石底（今平溪）、菁桐三大聚落的形成。相傳清代道光年間，十分寮一帶因盜匪橫行，居民為了在擊退土匪後向躲避山區的老弱婦孺報平安，會在元宵節施放天燈作為訊號，這項習俗流傳至今，發展成每年吸引大量海內外遊客的「平溪天燈節」，讓這個因溪流平緩而得名的礦業山城，轉型為台灣最具代表性的節慶觀光地之一。"],
    ["新北市","雙溪區","頂雙溪","雙溪因平林溪與牡丹溪兩條溪流在此匯合而得名，因位於下游「下雙溪」之上游，故又稱頂雙溪。","","雙溪地名由來直接取自當地的水文地貌：平林溪與牡丹溪兩條溪流在此交會匯流，形成雙溪河，因而得名「雙溪」；由於下游貢寮區雙龍里一帶另有「下雙溪」之稱，位於上游的雙溪聚落便相對稱為「頂雙溪」，日治時期簡化為「雙溪」沿用至今。雙溪河流域的開發約始於清乾隆、嘉慶年間，相傳曾有平埔族人白蘭開闢自暖暖經十份寮、楓仔瀨至雙溪的道路，嘉慶12年台灣知府楊廷理又闢建經四腳亭至雙溪的官道，道光年間林平侯之子林國華再重修三貂嶺、草嶺古道，逐步改善交通條件，吸引漳州籍移民連喬、吳爾等人於乾隆末年入墾，至嘉慶初年已形成街肆。雙溪因地處淡蘭古道要衝，加上煤礦與茶葉貿易的帶動，一度是台灣東北角重要的山區市鎮，境內主祀文天祥、陸秀夫、張世傑的三忠廟，也是當地重要的信仰與歷史地標。"],
    ["新北市","貢寮區","摃仔寮","貢寮舊稱槓仔寮，因早期山豬眾多，先民設置捕獸陷阱（槓仔）並在旁搭建茅寮而得名。","","貢寮地名源自平埔族語與漢人拓墾習俗的結合：這一帶早期山豬等野獸眾多，平埔族人與漢人先民會在山林間設置捕獸陷阱，這種陷阱在平埔族語（可能為凱達格蘭語）中讀作近似「kona」的音，漢人依音譯記為「槓仔」，並在陷阱旁搭建簡易茅寮供人看守，因而得名「槓仔寮」。1920年，日本殖民政府推行地方行政改制，將「槓仔寮」簡化為「貢寮」，但當地居民至今仍習慣以舊稱「槓仔寮」稱呼這片土地，可見古地名的生命力之強韌。貢寮區地處新北市東北角海岸，境內的鹽寮、福隆一帶海岸線綿長優美，福隆海水浴場與福隆便當是著名的觀光名產；每年夏季在此舉辦的貢寮國際海洋音樂祭，更讓這個以捕獸陷阱得名的偏鄉聚落，轉型為台灣獨立音樂文化的重要發源地之一。"],
    ["新北市","金山區","金包里","金山舊稱金包里，源自平埔族凱達格蘭族「金包里社」音譯，日治時期取其地倚山而改稱金山。","","金山地名源自平埔族凱達格蘭族「金包里社」（巴賽語：Ki-taparri）的社名音譯，這一帶自17世紀中葉以前，便已是金包里社群的傳統聚居地，古籍中也因大屯山盛產硫磺，而以「採硫之地」形容此地。清雍正年間，金包里已聚集成街市，其後福建漳、泉移民陸續前來拓墾定居，形成閩南、平埔族群交融的聚落樣貌。1920年，日本殖民政府推行地方行政改制，考量此地三面環山，便保留「金包里」中的「金」字，另加上「山」字，重新命名為「金山」，戰後沿用至今。金山老街（金包里老街）已有三百多年歷史，是北海岸僅存的清代商業老街，街上的慈護宮主祀媽祖，相傳廟中所供二媽神像是嘉慶初年漁民在野柳海邊石洞中拾獲，成為金山重要的信仰中心。境內的金山溫泉是台灣位置最北的溫泉，加上地瓜、芋頭、茭白筍合稱「金山三寶」，讓金山成為北海岸兼具人文與物產特色的觀光重鎮。"],
    ["新北市","萬里區","瑪鋉","萬里舊稱瑪鋉，源自居住當地的平埔族馬賽（巴賽）族社名音譯，境內瑪鋉溪、瑪鋉路等地名至今沿用舊稱。","","萬里地名源自平埔族「馬賽族」（Basay，又稱巴賽族，屬凱達格蘭族系統）的社名音譯「瑪鋉」，這條流貫萬里市區、注入台灣海峽的溪流至今仍稱為「瑪鋉溪」，市集主要道路瑪鋉路及其上、下街也都沿用這個古老的平埔族地名。萬里另一個舊名「萬里加投」，據傳與17世紀漢人聚落發展有關；1626年西班牙人占領基隆後，已有漢人在此定居，相傳明鄭時期鄭成功討伐荷蘭東印度公司時，曾由萬里加投一帶的小澳灣登陸，隨軍而來的閩南人洪水閣在此屯墾並經營漁業，成為地方開闢之始。戰後，萬里加投簡化為萬里，設立萬里鄉，2010年隨台北縣升格為新北市而改制為萬里區。萬里因地質構造特殊，東北側砂岩層經海水長期侵蝕，形成著名的野柳岬地質景觀，是新北市北海岸最重要的觀光資源之一。"],
    ["新北市","烏來區","烏來","烏來源自泰雅族語Ulay，意指溫泉，相傳因泰雅族人發現終年冒著熱氣的水窟而得名。","","烏來地名源自泰雅族語「Ulay」，意指溫泉。相傳最早是泰雅族人在南勢溪畔發現一處終年冒著熱氣、水溫滾燙的水窟，驚呼「Kilux Ulay」（意即水在滾燙），此後便以Ulay稱呼這處溫泉源頭，地名因而流傳並沿用至今。烏來原為泰雅族傳統領域，是台灣少數保有完整泰雅族部落文化的地區之一，日治時期便因溫泉資源開發成觀光地，戰後更興建纜車、台車等特殊交通設施，方便遊客往返老街、瀑布與雲仙樂園之間。境內的烏來瀑布落差約80公尺，是台灣少數能從市區道路直接眺望的瀑布景觀之一；南勢溪與桶后溪沿岸露天溫泉屬弱鹼性碳酸氫鈉泉，終年吸引大量遊客前來泡湯。前面提過的桃園復興區「小烏來」，其地名同樣源自這個泰雅語詞彙，因兩地皆擁有溫泉與瀑布景觀，遂借用其名以資區別，讓兩處分屬不同縣市的地方，共享著同一段泰雅語地名的淵源。"],
    ["新北市","九份","九份","九份因早期僅九戶人家聚居，物資上岸須均分九份而得名，另有一說源自製樟腦業有九十口灶、十灶一份而來。","","九份地名由來流傳著兩種主要說法。最廣為人知的「九戶說」認為，清代九份溪與大竿林溪附近山坡最早僅有九戶人家開墾定居，交通不便，日常物資須從遠方的焿仔寮港運上岸，再均分成九份，分送各戶，久而久之，「九份」便成為這處聚落的代稱。學者考證後則提出另一種「樟腦說」，認為在金礦業興盛之前，九份一帶以採樟煮腦為業，共設有九十口熬煉樟腦的灶，依當時慣例十口灶為一「份」，恰好湊足九份，因而得名，此說法被認為在文獻與邏輯上更為可信。饒富趣味的是，1920年日本殖民政府實施街庄改制前，「九份」與「金瓜石」兩個地名一度所指相反，即今日的金瓜石在清代文獻中反被稱為九份，直到行政區劃調整後才確立今日的對應關係。九份因清末發現金礦而繁榮一時，礦業沒落後又因電影《悲情城市》與動畫《神隱少女》的場景聯想而重新聲名大噪，成為國際知名的山城觀光勝地。"],
    ["新北市","金瓜石","金瓜石","金瓜石因山頭岩石形狀渾圓，狀似南瓜（金瓜）而得名，曾與鄰近九份互換地名。","","金瓜石地名由來普遍認為，是因為當地一座山頭的岩石外形渾圓，狀似閩南語稱為「金瓜」的南瓜，因而得名。金瓜石與九份同屬台灣清末至日治時期最重要的金礦產地，兩地合稱「金九」：光緒19年（1893年）九份溪發現砂金後，隔年金瓜石也傳出淘金熱潮，吸引大批礦工湧入開採。饒富趣味的是，根據地方文史工作者考證，清代文獻中原本以「九份」指稱今日金瓜石一帶，而以「焿仔寮」稱呼今日的九份，直到1920年日本殖民政府實施街庄改制，才依現況重新劃定，使「九份」與「金瓜石」正式定型為今日所熟知的對應關係。金瓜石在日治時期由財團經營開採，礦業全盛時期曾有「東亞第一金都」之稱，如今已闢為黃金博物館園區，保留太子賓館、本山五坑等歷史建築，讓這個因岩石形狀得名的礦山，轉型為認識台灣近代礦業史的重要場域。"],
    ["新北市","十分","十分寮","十分因早期依股份計算開墾或製腦規模，恰好湊足十份而得名，今以十分瀑布與天燈聞名。","","十分地名的由來，與台灣清代慣以「份」計算開墾或產業規模的命名方式有關，和鄰近瑞芳的「九份」屬於同一套邏輯。一般認為，十分早期是漢人合股拓墾，或是從事製腦、製茶產業的據點，依股份或灶數計算恰好湊足十份，因而得名「十分寮」，後簡稱十分。十分因地處基隆河上游的開闊河階台地，加上平溪鐵路支線行經，發展成沿鐵軌兩側而建的特殊「十分老街」，火車行駛時幾乎貼著店家門口通過，是台灣少數保留鐵道與街道共構景觀的老街之一。境內的十分瀑布因水量豐沛、瀑潭寬闊，有「台灣尼加拉瀑布」之稱，是全台最寬的簾幕式瀑布。每年元宵節前後，十分也是新北市平溪天燈節主要施放地點之一，遊客可親手寫下願望、施放天燈，讓這個原本描述拓墾規模的地名，成為台灣最具代表性的節慶觀光印象之一。"],
    ["新北市","猴硐","猴洞","猴硐因早期山洞有大量猿猴聚居而稱猴洞，後因採煤忌諱帶水的「洞」字不吉，改為猴硐。","","猴硐地名的由來相對直白：這一帶早期山區岩洞中棲息著大量猿猴，因而被稱為「猴洞」。然而，隨著清末煤礦業在此興起，礦工普遍忌諱與水相關的字眼，認為帶有水部的「洞」字不吉利、容易聯想到坑道淹水等礦業意外，於是將地名改為「猴硐」，以山字邊的「硐」字取代帶水的「洞」字，這種因產業忌諱而調整用字的地名演變方式，在台灣礦業聚落中並不少見。猴硐因煤礦資源豐富，日治及戰後時期曾是台灣重要的產煤重鎮，隨著礦業於1990年前後沒落，人口大量外移，聚落一度沉寂。近年來，因大量流浪貓群聚於車站周邊廢棄礦工宿舍一帶，加上鐵道文化與貓咪意象的結合，猴硐搖身一變成為國際知名的「貓村」，曾獲美國有線電視新聞網（CNN）評選為全球六大賞貓景點之一，讓這個因猿猴洞穴得名、又因採礦忌諱改字的小鎮，以貓聞名於世。"],
    ["新北市","野柳","野柳","野柳地名由來眾說紛紜，包括平埔族社名音譯、西班牙文「魔鬼岬角」的音轉，以及台語諧音的趣味傳說。","","野柳地名的由來流傳著三種不同的說法。第一種說法認為源自平埔族社名的音譯；第二種說法則指出，大航海時代西班牙人的船隻經常在此觸礁擱淺，甚至遭原住民洗劫，因而在地圖上將此地標示為西班牙語「Punto Diablos」，意即「魔鬼之岬角」，荷蘭人逐出西班牙人後，也沿用類似的稱呼，「野柳」（台語ia-liu）可能便是從「Diablos」一詞省略部分子音後音轉而來；第三種說法則富有生活趣味：相傳當地居民早期須仰賴中國沿海米商供應稻米，運米途中，搬運工人身後的米袋經常遭當地人以削尖的細竹筒戳破偷取，米商間便流傳「又被野人給柳去了」的說法，因而得名野柳。野柳因地處大屯山餘脈延伸入海的岬角，長期受海蝕與風化作用形成女王頭、仙女鞋等奇特地景，是台灣最富國際知名度的地質景觀之一。"],
    ["新北市","碧潭","獅山邊","碧潭因新店溪水流至此匯聚成一潭碧綠深潭而得名，是新店最具代表性的地標景觀。","","碧潭地處新店溪流經新店市區前的一段河谷，因兩岸青山夾峙、水流至此趨緩並匯聚成一潭碧綠清澈的深潭，故稱「碧潭」，是新店最具代表性的地標景觀。潭西岸有一片因河流侵蝕作用形成的岩壁，因外形類似長江三峽的赤壁景觀，被稱為「小赤壁」，岩壁上散布的巨石，早期居民依形狀分別命名為虎嘴石、豬母石、印斗石等趣味稱呼。1937年完工的碧潭吊橋橫跨東西兩岸，橋身造型優美，是台灣現存少數仍在使用的歷史吊橋之一，也是無數台灣人共同的旅遊記憶。日治時期，台北經新店的私設鐵路「新店線」通車後，碧潭因交通便利、風景秀麗，成為台北近郊著名的划船與郊遊勝地，時至今日，碧潭仍是新北市新店區重要的觀光休憩景點，湖面上仍可見遊客划船遊湖的悠閒景象。"],
    ["新北市","江子翠","港仔嘴","江子翠舊稱港仔嘴，因位於新店溪與大漢溪匯流處的尖嘴狀地形而得名，後取台語近音雅字改稱江子翠。","","江子翠地處大漢溪與新店溪匯流之處，因兩河交會形成一處河岸開闊、狀如尖嘴突出的地形，清代先民便稱此地為「港仔嘴」，是平埔族凱達格蘭族武朥灣社的傳統聚居地之一。清代後期，隨著江子翠地區人口增加，逐漸從港仔嘴庄獨立發展成庄，由於「港仔嘴」（台羅：káng-á-tshuì）與「江仔翠」（kang-á-tshuì）閩南語發音極為相近，為了區別兩地，人們便採用較為文雅的近音字「江仔翠」來稱呼這片新興聚落，後演變為今日的「江子翠」，而維持舊稱的區域則另稱「崁頂」。江子翠因鄰近台北市，加上台北捷運板南線在此設站，逐漸發展成板橋區東北側重要的住宅與商業區域，雖曾因兩起社會矚目案件而讓地名蒙上陰影，但這些事件其實與當地治安並無直接關聯，無損於這個因河岸地形得名之處的發展。"],
    ["新北市","秀朗","秀朗","秀朗源自平埔族秀朗社社名，是清代永和、中和一帶重要的平埔族聚落。","","秀朗地名源自居住於新店溪畔的平埔族「秀朗社」（另有繡朗、雷朗等音譯寫法），是清代大加蚋堡境內重要的平埔族聚落之一，活動範圍大致涵蓋今日永和、中和沿新店溪一帶。漢人入墾這一帶後，秀朗社逐漸與周邊擺接社、里族社等平埔族群融合，統稱「雷朗族」，隨著漢化程度加深，其語言與文化特徵也逐漸消失於歷史記載中，僅留下秀朗這個地名作為見證。如今秀朗一帶已完全融入永和、中和的都市發展範圍內，秀朗國小、秀朗橋等公共設施仍沿用這個源自平埔族社名的古老地名，成為後人追溯這片土地上原住民族歷史痕跡的重要線索，也呼應了新北市境內許多地名皆源自平埔族凱達格蘭族分支社名的普遍現象。"],
    ["新北市","頂埔","頂埔","頂埔因位於地勢較高的平原（埔）而得名，與依開墾先後命名的頭前埔、二重埔等地名同屬一套系統。","","頂埔是台灣鄉鎮地名中常見的「埔」系列地名之一，「埔」字在閩南語中泛指未經開墾的平坦草地或河邊沙洲，先民拓墾時常依開墾先後順序或地勢高低為這類埔地命名，例如三重的頭前埔、二重埔、三重埔，便是依開墾次序命名；而頂埔則是依地勢高低命名的例子，「頂」在閩南語中意指位置較高之處，相對於地勢較低的其他埔地，這片位於土城區地勢相對較高的平原便被稱為「頂埔」。清代這一帶因鄰近大漢溪沖積平原，土質肥沃，適合農耕，逐漸發展成漢人拓墾聚落。隨著台北捷運土城延伸線在此設立頂埔站，加上鄰近的三峽北大特區發展，頂埔近年已從農業聚落轉型為捷運沿線的新興住宅區，成為土城區向西南延伸發展的重要生活機能節點。"],
    ["新北市","迴龍","迴龍","迴龍因當地山勢蜿蜒起伏、狀似回轉的龍形而得名，境內樂生療養院曾是台灣重要的漢生病醫療機構。","","迴龍地名由來與當地地形特徵有關：這一帶山巒地勢起伏蜿蜒，遠望山脈走勢彷彿一條盤旋回轉的巨龍，因而得名「迴龍」，是台灣常見以山形、水流意象命名地方的例子之一。迴龍位於新北市新莊、泰山、樹林三區交界處，清代因地處交通要衝，逐漸發展成聚落。台灣總督府自1916年起在此設立「樂生療養院」，是台灣第一座專門收容漢生病（痲瘋病）患者的公立醫療機構，讓迴龍這個地名長期與這段特殊的台灣公共衛生史緊密相連，也曾因捷運新莊線施工路線爭議引發保存樂生院區的社會運動。隨著台北捷運新莊線於2010年通車、設立迴龍站作為端點站，加上鄰近的丹鳳、輔仁大學周邊發展，迴龍逐漸從邊陲地帶轉型為捷運沿線的住宅生活圈。"],
    ["新北市","丹鳳","丹鳳","丹鳳因當地山形宛如一隻展翅的紅色鳳凰而得名，如今是新莊區西側重要的文教與住宅聚落。","","丹鳳地名由來源自地形意象：當地一座山丘的稜線起伏，遠望形狀彷彿一隻展翅欲飛的鳳凰，「丹」則有紅色、吉祥之意，兩字合稱寓意吉祥美好的山勢景觀。丹鳳位於新北市新莊區西側，鄰近迴龍、泰山一帶，清代開發程度較低，多為丘陵與農業用地。戰後隨著新莊都市計畫的擴張，加上鄰近輔仁大學等學術機構的設立，丹鳳逐漸發展為住宅聚落，並設有丹鳳國小、丹鳳高中等教育設施，是新莊區西側重要的文教與生活機能區域。台北捷運新莊線於此設有丹鳳站，進一步帶動周邊房地產與商業機能的發展，讓這個以山形意象命名的古老地名，成為捷運沿線新興的生活聚落代表。"],
    ["新北市","山佳","山仔腳","山佳舊稱山仔腳，因聚落位於山腳下而得名，境內山佳車站是台灣少數保存完整的日治磚造車站。","","山佳舊稱「山仔腳」，是台灣典型依地形位置命名的地名之一：「山仔」指附近的小山丘，「腳」則是閩南語表示「底下、附近」之意，兩字合稱意指聚落坐落於山腳下的位置，這樣的命名邏輯在台灣各地相當常見，例如泰山區的舊稱同樣也是「山腳」。山佳所在的樹林區山佳里，清代因鄰近大漢溪河運與丘陵地形，早期以農業與礦業為主要產業。1903年，台灣總督府鐵道部在此設立「山仔腳驛」，是縱貫鐵路的重要車站之一，戰後改稱山佳車站；車站建築歷經多次整建，現存站舍建於1931年，採用西洋式風格與唭哩岸石砌造，2011年被指定為新北市市定古蹟，是台灣少數保存完整的日治時期磚造車站之一，讓「山仔腳」這個描述地形位置的地名，透過百年車站建築流傳至今。"],
    
    // --- 【桃園市】 ---
    ["桃園市","桃園區","虎茅庄","桃園原稱虎茅庄，因早期茅草叢生如虎傷人而得名，後因遍植桃樹、花開似紅雲而改稱桃仔園。","","桃園區現址在清乾隆年間文獻中最初稱為「虎茅莊」，是淡水廳下轄三十五莊之一，因開墾前這一帶長滿茂密的茅草，銳利如虎爪、容易劃傷行人，因而得名。乾隆30年（1765年）前後，隨著閩粵移民與龜崙社平埔族交易日益頻繁，原本的荒草地逐漸形成店舖聚集的市街；同一時期，墾首薛啟隆率眾拓墾龜山、八德一帶土地時，在此廣植桃樹，每逢花季，滿山桃花如紅雲搖曳，因而博得「桃仔園」的美稱，乾隆39年（1774年）《續修臺灣府志》已可見「桃仔園莊」的記載，光緒14年官方文書則簡化為「桃園」，沿用至今。桃園區是全台唯一與所屬直轄市同名的市轄區，也是桃園市政府所在地，境內桃園車站周邊商圈及桃園藝文特區，是全市最重要的政治、經濟與交通核心。"],
    ["桃園市","中壢區","澗仔壢","中壢舊稱澗仔壢，因老街溪、新街溪切割出的谷地而得名，又因地處竹塹與淡水間的中點，加取「中」字而成中壢。","","中壢地名由來與當地的河谷地形及地理位置密切相關：境內老街溪、新街溪兩條溪流貫穿，切割出深峻的澗谷地形，客語稱這種谷地為「壢」，因而先民最初稱此地為「澗仔壢」。乾隆年間，漳州人郭樽先在大園開墾，其後率族人自南崁、桃園一帶南下，開闢橋路，為中壢的發展奠定根基，吸引大批福建、廣東移民陸續進駐。由於澗仔壢恰好位於清代北台灣兩大城鎮——竹塹（新竹）與淡水（原指新莊，後指台北）之間的中途站，是商旅往來歇腳的必經之地，加上境內多壢谷地形，遂取其居中的地理位置，將「澗仔壢」簡化改稱為「中壢」，沿用至今。中壢因族群結構多元、以客家人居多，加上工業區設立帶動人口成長，如今是桃園市人口第二多的行政區，牛肉麵、花生酥糖與鐮刀並稱「中壢三寶」。"],
    ["桃園市","平鎮區","安平鎮","平鎮舊稱安平鎮，因清代設「張路寮」守望盜匪，或因瘟疫後改名求平安，取平安鎮守之意。","","平鎮地名的由來，流傳著幾種與「求平安」密切相關的說法。一種說法認為，這一帶最初稱為「廣興庄」，是乾隆9年（1744年）廣東嘉應州客籍移民宋姓、戴姓兩族拓墾興業而得名；另一種較廣為流傳的說法指出，此地原稱「西勢」，因客語發音與「死屍」諧音不祥，加上曾經連年爆發瘟疫，先民向土地公祈求後，依神明指示改稱「安平鎮」以求平安。也有記載指出，乾隆25年（1760年），為保護往來桃園與中壢間行旅的安全，先民在交通要道設置稱為「張路寮」的瞭望守衛設施，防範盜匪與原住民出草，設寮後治安好轉，因而改稱「安平鎮」。1920年日本殖民政府推行地方改制，為與台南安平有所區別，將「安平鎮」去「安」字簡化為「平鎮」，沿用至今，境內龍岡因滇緬孤軍撤台後在此落腳，形成獨具特色的雲南、緬甸文化眷村聚落。"],
    ["桃園市","八德區","八塊厝","八德舊稱八塊厝，因清乾隆年間有謝、蕭、邱、呂、賴、黃、吳、李八姓移民各建一屋而得名，與「四維八德」無關。","","八德地名由來與「四維八德」的道德教條其實毫無關聯：據傳清乾隆6年（1741年）此地已建有八棟建築，另一說則指乾隆10年（1745年），來自閩、客不同籍貫的謝、蕭、邱、呂、賴、黃、吳、李八個姓氏的移民先後在此落地生根，每個家族各自興建一座房舍，聚落因而得名「八塊厝」。戰後初期，這一帶依台語發音簡稱為「八塊鄉」，後來才取「八德」之名重新命名，恰好與傳統道德「八德」諧音，賦予地名新的文化意涵，但這只是後來的巧合附會，並非最初命名的本意。八德境內另有「霄裡」一地，得名於當地平埔族「霄裡社」的社名，是八德開發甚早的舊地名之一；「大湳」則因大漢溪改道後地下水位偏高、雨後容易形成泥濘濕地（湳）而得名，是八德目前最繁華的區域。"],
    ["桃園市","楊梅區","楊梅壢","楊梅因清乾隆年間先民在澗谷地遍植楊梅樹而得名，因地處谷地（壢），舊稱楊梅壢。","","楊梅地名由來相當直白：清乾隆年間，漢人移民進入這片位於社仔溪上游、介於伯公崗、乳姑山與平鎮台地之間的谷地開墾時，發現當地遍植楊梅樹，因而以「楊梅」為名；又因這片谷地由老坑溪與崎頂溪切割而成，客語稱谷地為「壢」，故舊稱「楊梅壢」，直到1920年才簡化定名為「楊梅」。楊梅境內地名故事豐富：「秀才窩」一帶因窪地村落坐落於山凹出口而稱「窩」，相傳因鄰近一位清光緒年間考取武秀才的李祥謹住家，或因某位路過秀才讚嘆此地風水寶地而得名；「富岡」在日治時期原稱「伯公岡」，伯公是客家人對土地公的稱呼，意指設有土地公廟的小台地，1929年鐵路改道設站後，帶動站前老街的繁榮發展，戰後才改稱富岡。這些地名共同交織出楊梅這座客家山城的拓墾與信仰記憶。"],
    ["桃園市","蘆竹區","蘆竹厝","蘆竹因清雍正年間福建移民以蘆竹搭建屋舍而得名，是南崁與大竹兩地爭執地名未果後的折衷結果。","","蘆竹地名由來頗具地方協調色彩：這一帶原是南崁與大竹兩處知名聚落之間的小型墾地，相傳因兩地對於這片新興聚落的命名各有堅持、爭執不休，最終折衷選用當地隨處可見、且與兩者皆無關的植物「蘆竹」為名。清雍正8年（1730年），福建南安人陳仲及其兄弟四人來此開墾，以蘆竹搭建簡易屋舍居住，因而稱作「蘆竹厝」，1920年簡化為蘆竹，沿用至今。蘆竹境內的「南崁」，其實是比蘆竹本身更具知名度、也更早開發的聚落，地名源自平埔族「南崁社」，是桃園最早開發、也是早期由海路進入台北盆地的必經之地，可說是整個桃園地區的開發起點；境內另有「坑子」，可能源自平埔族「坑子社」，也可能因地處林口台地西側坑子溪谷而得名，如今是桃園捷運機場線的重要站點。"],
    ["桃園市","大溪區","大姑陷","大溪原稱大姑陷，源自原住民語「發大水」的譯音，因「陷」字不雅屢經改名，最終於日治時期定名大溪。","","大溪地名歷經多次演變，最初稱為「大姑陷」，是當地原住民語言中形容「發大水」的譯音，反映大嵙崁溪（今大漢溪）水勢湍急、時常氾濫的特性。因「陷」字帶有負面意涵，後改稱較為中性的「大姑崁」；1866年，大溪士紳李騰芳考中科舉，地方為此增光，遂將「姑」字改為帶有文教意涵的「科」，稱作「大科崁」；清末劉銘傳治台推行「開山撫番」政策，在此設置撫墾局，又改回「大嵙崁」。直到日治時期，才簡化定名為今日通行的「大溪」。大溪境內河階地形發達，「三層」即因由下而上數來第三層河階、地勢最高而得名；「月眉」因大漢溪流至此形成彎曲如月眉的曲流而得名；「烏塗窟」則因蘊藏烏黑的煤炭（烏塗）而得名，見證大溪清代以來煤礦開採的產業歷史，如今大溪老街的巴洛克式牌樓立面，仍是全台保存最完整的老街建築群之一。"],
    ["桃園市","龍潭區","菱潭陂","龍潭原稱菱潭陂，因潭中盛產菱角而得名，後因大旱不涸、傳說有黃龍飛騰於潭面，改稱靈潭、龍潭。","","龍潭地名的演變過程頗具傳奇色彩：這座位於桃園台地上的天然大池塘，最初因潭中盛產菱角，被稱為「菱潭陂」；相傳雖然歷經多次大旱，這座池塘卻從未乾涸見底，居民認為必有靈氣庇佑，因而改稱「靈潭陂」，《淡水廳志》更記載乾隆13年（1748年）霄裡社通事知母六招佃開闢此陂，村民逢旱祈雨常能應驗；後因「靈」與「龍」在閩南語泉州腔及客語發音相近，加上曾有人在風雨交加之際目睹潭面彷彿有黃龍飛騰而過，地名便逐漸轉化為今日的「龍潭」。龍潭境內「三坑子」因鴨母坑、火劫尾坑、蔗部坑三條坑溝匯入大漢溪台地而得名，昔日曾是重要的水運集散地，三坑老街至今仍保留古樸的閩客混合建築風貌；「八張犁」則沿用清代以「張犁」為單位計算開墾面積的命名邏輯，因當地開墾農地達四十甲（一張犁約五甲），故稱八張犁，與台北六張犁屬同一套命名系統。"],
    ["桃園市","龜山區","龜崙社","龜山地名源自平埔族龜崙社，日治時期將「崙」改為「山」，簡化定名為龜山。","","龜山地名源自居住於此的平埔族凱達格蘭「龜崙社」（音譯自Kouroumanangh），這一帶原是龜崙社世代狩獵的荒蕪領域，直到康熙年間才有漳、泉籍移民相繼遷入拓墾。1920年，日本殖民政府推行地方行政改制，將原本的「龜崙」簡化，以字形相近、且更貼近當地丘陵地貌的「山」字取代「崙」字，正式定名為「龜山」，沿用至今。龜山境內因坑谷地形眾多，衍生出許多以「坑」命名的地方：「塔寮坑」因昔日先民搭建形似高塔的守望寮舍以保護行旅安全而得名；「兔子坑」原稱「社后坑」，因地處龜崙社後方而得名，清末發現煤礦後改稱「崁坑」，日本人依諧音誤讀為「兔子坑」，流傳至今。龜山因鄰近台北，加上桃園國際機場周邊產業發展，如今已從昔日的平埔族狩獵領域，轉型為工商業與住宅機能兼具的重要行政區。"],
    ["桃園市","大園區","大坵園","大園舊稱大坵園，「坵」為劃分田地的單位，「園」指旱田，大坵園即指大片旱作田地。","","大園地名由來相對單純，源自清代對土地分類與計量的用詞：「坵」是劃分田地區塊的計算單位，「園」則專指不需灌溉、種植雜糧或經濟作物的旱田（與需要灌溉的水田「田」相對），這一帶因擁有大片連續的旱作田地，因而被稱為「大坵園」，1920年日本殖民政府推行地方改制時簡化為「大園」，沿用至今。大園境內的「許厝港」，是清代開墾桃園沿海地區先民最初登岸的港口之一，康熙年間許鳳率族人於此開墾，逐漸發展成大地主，港口因而以許姓命名，全盛時期商賈雲集，後因泥沙淤積與鐵路興建而沒落，如今已闢為濕地生態園區；「橫山」則因老街溪與新街溪之間隆起一道橫向的台地岡阜而得名。大園因緊鄰台灣海峽，加上桃園國際機場座落於此，是桃園市對外交通的重要門戶。"],
    ["桃園市","觀音區","石觀音","觀音因清咸豐年間農民在溪中拾得一塊狀似觀音的石頭並建廟供奉，原稱石觀音，日治時期簡化為觀音。","","觀音地名由來源自一則充滿民間信仰色彩的傳說：清咸豐10年（1860年），一位農民在當地溪流中撿拾到一塊天然石頭，石頭表面的紋路酷似觀音菩薩的形貌，村民認為這是神蹟，便將石頭供奉於路旁膜拜，這一帶因而被稱為「石觀音」。隨著這尊石觀音有求必應的靈驗事蹟逐漸傳開，信眾集資興建「福龍山寺」正式供奉；明治28年（1895年），有村民在寺廟旁發現一處湧泉，據傳泉水能治百病，因而命名為「甘泉井」，這座寺廟此後也改稱「甘泉寺」，成為當地重要的信仰中心。日治時期，「石觀音」正式簡化更名為「觀音」，沿用至今。觀音境內的「白沙墩」因觀音溪至大堀溪間有一座灰白色的沙丘（墩）而得名，日治時期在此興建的白沙岬燈塔，是台灣現存日治時期保存最完整的燈塔之一；「草漯」則因沙質地形排水不良、沼澤遍布而得名，境內草漯沙丘更有「台版撒哈拉」之稱。"],
    ["桃園市","新屋區","新起屋","新屋因清代廣東客籍范姜兄弟原屋遭平埔族侵擾焚毀，遷居另建新宅「新起屋」而得名。","","新屋是南桃園開發最早的地區之一，地名由來與一段家族拓墾史密切相關：清雍正、乾隆年間，廣東客籍范姜兄弟渡海來到桃園拓墾，原本的居所後來遭到平埔族的侵擾破壞，家族被迫放棄舊屋，於咸豐5年（1855年）遷居至此，興建五棟嶄新的大宅，當地人稱之為「新起屋」，這座建築如今已列為國家三級古蹟范姜古厝。「新屋」之名便由此而來，意指「新蓋的房子」。新屋境內地名同樣充滿拓墾故事：「九斗」是因地主羅允玉體恤佃農收成不佳，僅收取九斗稻穀作為租金而得名；「永安」原為當地漁港名稱，因地處新屋溪出海口，是桃園沿海重要的漁業據點，如今永安漁港與周邊的海螺文化園區已發展成知名的觀光漁港。新屋因地勢平坦、水源充足，是桃園著名的「魚米之鄉」。"],
    ["桃園市","復興區","角板山","復興區舊稱角板山，因清光緒年間劉銘傳見此地形平坦如板、四周山峰如角而得名，戰後為紀念民族復興基地精神改稱復興。","","復興區舊稱「角板山」，相傳光緒12年（1886年），時任台灣巡撫的劉銘傳巡視此地時，見這片位於大漢溪畔的河階台地地勢平坦開闊，四周環繞的山峰稜角分明，宛如一塊四角凸起的木板，因而將此地命名為「角板山」。角板山因地處漢人與泰雅族傳統領域的交界，清末劉銘傳在此設立「撫墾局」，推行開山撫番政策；日治時期更興建角板山貴賓館（今復興青年活動中心），蔣中正總統來台後也常在此避暑度假，因而又稱「介壽賓館」。戰後，政府基於「以復興基地精神、光復大陸山河」的政治期許，將角板山所在的鄉級行政區改名為「復興鄉」，2014年桃園升格直轄市後改制為復興區，是桃園市唯一的山地原住民區，境內巴陵、爺亨、羅浮、小烏來、義興等泰雅族部落，各自保有豐富多元的地名故事與部落文化。"],
    ["桃園市","內壢","內壢","內壢因位於中壢範圍內側的谷地（壢）而得名，另一說是源自舊稱「內壢溪庄」的溪名。","","內壢地名由來有兩種說法。第一種說法認為，「壢」與中壢的「壢」同樣意指澗谷地形，因這片區域的地理位置恰好落在中壢範圍的內側，因而得名「內壢」；第二種說法則指出，內壢最初其實是一條溪流的名稱，當地曾有「內壢溪庄」的聚落，又稱「內澗仔壢」，後來溪名逐漸轉為聚落地名沿用至今。內壢位於中壢區北側，因鄰近中壢工業區與台鐵內壢車站，加上緊臨桃園國際機場聯外道路，戰後隨著工廠陸續進駐設立，人口快速成長，逐漸從純樸的澗谷農業聚落，轉型為中壢都會區重要的工業與住宅生活圈，如今是中壢區劃分的四個次分區之一（中壢、內壢、龍岡、大崙）。"],
    ["桃園市","埔心","埔心","埔心因聚落位於一大片未開墾荒地（埔）的中心位置而得名。","","埔心是台灣常見的「埔」系列地名之一，「埔」在閩南語中泛指尚未開墾的平坦荒地，先民依聚落在這片荒埔中的相對位置為地方命名，「埔心」即意指聚落恰好位於這片荒埔地帶的中心點，這樣的命名方式與同樣源自「埔」的埔子、頭前埔、二重埔等地名，反映了台灣拓墾史上依開墾範圍與相對位置命名的普遍邏輯。桃園的埔心地區地處平鎮、楊梅一帶台地，清代逐漸由客家移民入墾成聚落，因鄰近中壢、平鎮市區，加上台鐵與公路交通便利，如今已從原本荒蕪的埔地中心，發展成人口稠密的住宅生活圈，境內埔心國小、埔心體育公園等公共設施，也持續沿用著這個描述地理位置的古老地名。"],
    ["桃園市","富岡","伯公岡","富岡日治時期原稱伯公岡，因當地小台地上設有土地公廟（伯公）而得名，戰後改為富岡。","","富岡舊稱「伯公岡」，「伯公」是客家人對土地公的敬稱，「岡」則指地勢略高的小型台地，伯公岡意指設有土地公廟、地勢較高的台地聚落。昭和4年（1929年），台灣總督府鐵道部因應鐵路路線改道，在此設立「伯公岡驛」，隨著車站啟用，站前老街迅速發展成繁榮市街，至今仍可從保存完整的呂家聲洋樓等建築，窺見當年的繁華景象。戰後，這一帶正式更名為「富岡」，取「富裕興盛」的吉祥寓意，車站也隨之改稱富岡車站。富岡地處楊梅區北側，因臺鐵縱貫線行經，加上鄰近農業精華地帶，是楊梅區重要的交通與商業聚落之一，境內富岡老街至今仍保留部分日治時期興建的街屋立面，見證這個從土地公信仰發展而來的地名，如何隨鐵路建設而繁榮興盛。"],
    ["桃園市","青埔","菁埔","青埔因清康熙年間漳州人呂夏珍見此地遍生可製藍染的「菁」草而得名，非因周邊荒涼而稱「青」。","","青埔地名的由來，其實與字面上「青翠荒埔」的聯想略有出入：康熙50年（1711年），漳州人呂夏珍前來開墾這片位於中壢台地的荒埔時，發現當地遍生一種可用來提煉藍色染料的植物「菁」（大菁），因而將這片長滿菁草的荒埔稱為「菁埔」，後來才逐漸轉寫為「青埔」。青埔因鄰近桃園國際機場，2000年代起被劃入「桃園航空城」重大開發計畫範圍，加上桃園機場捷運青埔站的設立，近年吸引大量建商投入造鎮，華泰名品城、Xpark水族館等大型商業設施陸續落成，使青埔從清代種植藍染作物的荒埔地帶，搖身一變成為桃園市近年發展最快速的新興重劃區，也讓「青埔」這個地名有了與初始命名截然不同的嶄新面貌。"],
    ["桃園市","竹圍","竹圍","竹圍因早期居民在住屋四周種植竹林以防風、防盜而得名，是台灣各地常見的聚落命名方式。","","竹圍是台灣相當普遍的地名之一，命名邏輯與蘆竹區境內「大竹圍」（後簡稱大竹）如出一轍：早期先民拓墾定居後，為了抵禦強勁的東北季風侵襲，或防範盜匪與野獸侵擾，習慣在住屋外圍種植成排的竹林作為天然屏障，這樣的聚落型態因而被稱為「竹圍」，這種命名方式在桃園、新北等風勢強勁的沿海台地地區尤其常見。桃園的竹圍地區因地處林口台地邊緣，土壤與氣候條件不利大規模水稻耕作，早期以種植地瓜、花生等雜糧作物為主，居民生活相對純樸簡單。隨著周邊工業區的開發與都市化進程，加上鄰近的機場聯外道路修築完成，竹圍逐漸從防風竹林環繞的傳統聚落，轉型為兼具工業與住宅機能的近郊生活圈，但「竹圍」這個描述早期聚落防禦景觀的地名，至今仍持續沿用。"],
    
    // --- 【新竹縣市】 ---
    ["新竹市","東區","竹塹","東區地名源自新竹古稱「竹塹」，1982年新竹市升格省轄市後，以中華路為界劃分東西兩區，東區因涵蓋竹塹城東側精華區而得名。","","「竹塹」是新竹市最古老的地名，源自平埔族道卡斯族「竹塹社」的社名音譯，另有一說是因清代竹塹城以環植莿竹作為城牆而得名。康熙57年（1718年），福建同安人王世傑率領族人渡海來台，向竹塹社取得土地，展開大規模拓墾，短短三十年間，從頭前溪南岸到香山南勢一帶，已開闢逾千甲田園，奠定竹塹地區農業發展的基礎。乾隆21年（1756年），淡水廳署由彰化移駐竹塹，竹塹自此成為北台灣的行政中心；光緒元年（1875年），因應北部開發日益繁榮，將原淡水廳一分為二，另設新竹縣，取「竹塹」之「竹」字，加上「新」字，意即「新的竹塹城」，這便是「新竹」名稱的由來。1982年新竹市升格為省轄市，以中華路為界，將市區劃分為東西兩區，東區涵蓋清代竹塹城東側的精華地帶，如今是國立清華大學、國立陽明交通大學與新竹科學園區的所在地，從清代的農墾中心，轉型為今日台灣高科技產業的重鎮。"],
    ["新竹市","北區","竹塹","北區同樣源自新竹古稱「竹塹」，1982年劃分行政區時，因位於中華路以北、涵蓋古竹塹城與港口而得名。","","北區與東區同樣源自新竹古地名「竹塹」，是1982年新竹市升格省轄市、以中華路為界劃分東西兩區時所產生的行政區劃。北區涵蓋清代竹塹城的核心地帶，境內的新竹城隍廟建於乾隆13年（1748年），廟宇規模為全台之冠，主祀掌管陰陽賞罰的城隍爺，是新竹市最重要的信仰中心，廟埕市集小吃攤更是新竹在地美食的聚集地。北區沿海一帶則是新竹港口發展的重要見證：清代最早的竹塹港（舊港）因頭前溪泥沙淤積，於嘉慶年間另闢新港，此後港口機能又幾經轉移，最終在頭前溪出海口南岸形成今日的南寮漁港與新竹漁港。北區因兼具舊城信仰核心與濱海漁港雙重面貌，境內的新竹公園、玻璃工藝博物館與17公里海岸線自行車道，共同勾勒出這座「風城」新舊交融的城市樣貌。"],
    ["新竹市","香山區","番山","香山原稱番山，因是道卡斯族竹塹社所居之山，因「番」字不雅，取其字形相近改稱香山。","","香山地名由來流傳著兩種說法。第一種說法指出，這一帶原是道卡斯族竹塹社的傳統居住地，漢人最初依「原住民（番）盤據之山」的印象，將此地稱為「番山」，後因「番」字帶有歧視意味且不甚文雅，加上「番」與「香」兩字字形相近，遂改稱較為文雅的「香山」；第二種說法則來自清代惠安縣螺陽陳氏家族的口傳，指遷居至此的族人見大坪頂一帶漫山遍野花草盛開、香氣馥郁，因而直接以「香山」為地名。相傳永曆36年（1682年），明鄭軍隊北伐路經此地，沿途徵召竹塹社人搬運糧草，族人不堪其擾而遷離，此地漢人拓墾隨後展開，卻也一度因與原住民衝突而幾近絕跡，直到清廷劃設土牛界線、設隘寮防守後，漢人才得以再次聚集。香山因濱海地形，清代曾一度取代淤塞的竹塹港成為重要貨物集散港，如今則以生態豐富的香山濕地聞名，是北台灣最大的蚵場與候鳥棲息地之一。"],
    ["新竹縣","竹北市","豆子埔","竹北市境內的豆子埔，因清代引水灌溉、適合種植豆類作物而得名，是竹北市行政中心所在地。","","竹北市舊稱範圍內的「豆子埔」，原寫作「豆仔埔」，是一處典型依作物命名的台灣地名：清治末期，這片位於竹北東北部的荒埔地因水利設施完善，適合種植豆類作物，因而得名「豆仔埔庄」，隸屬竹北一堡。1920年日本殖民政府推行地方改制時，將地名雅化為「豆子埔」，成為今日竹北里、竹義里、福德里、竹仁里一帶的舊稱。竹北原是新竹縣治所在地，因鄰近新竹科學園區與高鐵新竹站，1988年由竹北鄉改制為竹北市，是新竹縣人口成長最快速的行政區。豆子埔一帶因縣政府、縣議會等行政機關進駐，加上高鐵特區的開發，已從清代單純的豆類作物產地，蛻變為新竹縣的政治與交通核心地帶。"],
    ["新竹縣","竹東鎮","樹杞林","竹東舊稱樹杞林，因當地早期樹杞繁茂成林而得名，後因位居新竹市之東方，改稱竹東。","","竹東鎮舊稱「樹杞林」，這個地名由來相當直白：漢人尚未大規模入墾之前，此地原是泰雅族、賽夏族等原住民狩獵遊耕之地，境內樹杞（一種常綠喬木）生長茂密成林，因而得名。乾隆34年（1769年），已有廣東惠州籍移民入墾上、下七份及麻園肚一帶；乾隆39年，饒平人林欽堂向竹塹社通事承墾頭重埔、員山一帶荒埔，特地從六張犁（今竹北六家）率領四十餘名男丁前來建立村落；乾隆末年，陸豐人彭乾和、彭乾順兄弟自芎林南下遷往樹杞林開墾，嘉慶11年（1806年）更組成「金惠成墾號」，展開大規模拓墾。1920年，日本殖民政府因這一帶位居新竹市的東方，將「樹杞林」簡化改稱「竹東」，沿用至今。竹東因早期樟腦、林業與礦業發達，一度與東勢、羅東並稱台灣三大林業集散地，如今則是新竹縣頭前溪以南地區的交通樞紐與商業重鎮。"],
    ["新竹縣","新埔鎮","吧哩嘓","新埔舊稱吧哩嘓，是道卡斯族狩獵的荒埔，因是沿海開墾地帶中較晚開發的河埔地而得名新埔。","","新埔鎮舊稱「吧哩嘓」，原是平埔族道卡斯族狩獵遊耕的荒埔地帶。雍正年間，來自廣東惠州府陸豐縣、嘉應州鎮平縣、潮州府饒平縣等地的客籍移民陸續進入竹塹東北的吧哩嘓一帶拓墾，但因當時清廷渡台開墾政策未有統一規範，加上此地本屬竹塹社傳統領域，早期漢人拓墾規模並不大；乾隆12年（1747年），竹塹社人因水患之故，在土目衛阿貴與錢子白率領下整族遷入新埔地區。乾隆49年（1784年），已有陸豐、鎮平籍的粵籍移民聚落形成，並將荒地開發為農田，「新埔莊」之名也在此時開始使用，意即「新開發的河埔地」——因當年移民大多先從紅毛港、香山港登陸，沿海地帶已率先開發，這片內陸河埔地相對較晚開墾，因而得名「新埔」。如今新埔以生產稻米、水梨、柿子與柿餅聞名，義民廟更是台灣客家信仰的重要據點。"],
    ["新竹縣","關西鎮","鹹菜甕","關西清代稱鹹菜甕，因客籍居民擅長醃製鹹菜而得名，日治時期因「鹹菜」台語發音近似日語「關西」而改名。","","關西鎮舊名幾經演變，最初稱「美里庄」；乾隆58年，先民取「新興茂盛」之意改稱「新興庄」；道光30年，又因當地客家族群擅長將生產過剩的芥菜（鹹菜）醃製於甕中保存、行銷各地，四處可見醃製鹹菜的陶甕，因而改稱「鹹菜甕」。這片土地是竹塹社頭目衛阿貴率領客家墾佃拓墾而成，清代曾是新竹縣客家地區唯一能與竹塹城分庭抗禮的繁榮街市，也是竹東地區茶葉與樟腦貿易的重要轉運站。1920年，日本殖民政府推行地方改制，因「鹹菜甕」的客語發音與日語地名「關西」發音相近，索性直接借用日本本州西部「關西」之名，取代原本的「鹹菜甕」，沿用至今，與地理方位上真正的「西邊」其實毫無關聯。關西境內的馬武督部落，是泰雅族馬里闊丸系統的一支，也是關西鎮境內唯一不屬於尖石、復興的泰雅族部落。"],
    ["新竹縣","湖口鄉","大窩口","湖口舊稱大窩口，「窩」指山間盆狀窪地，因地處一連串窩地窪地的出入口而得名，後簡稱湖口。","","湖口鄉舊稱「大窩口」，「窩」在客家語中意指山間盆狀的窪地地形，因湖口鄉境內新莊溪上游支流將台地切割成一連串槽狀的「窩」「湖」地形，而這處聚落恰好位於這些窪地的出入口，故稱「大窩口」；又因「大湖口」與「大窩口」的客家語發音相近，後續文獻多以「大湖口」記載，1920年才正式簡化為「湖口」。清光緒年間，劉銘傳修築台北至新竹間的鐵路行經此地，設立大湖口車站，讓這座原本純樸的客家散村迅速發展成繁盛的交通聚落，可惜後來鐵路改道西移至新湖口，老湖口的繁華也隨之沒落，僅留下老街供人緬懷；車站原址後由天主教會於1954年租用傳教，1966年建成今日所見的老湖口天主堂。如今湖口因鄰近新竹工業區與科學園區，已從清代的窪地聚落轉型為新竹縣重要的工業重鎮。"],
    ["新竹縣","新豐鄉","紅毛港","新豐舊稱紅毛港，相傳明末荷蘭人（紅毛）曾在此因船難登岸而得名。","","新豐鄉舊稱「紅毛港」，因境內同名港口而得名。台灣民間長期以「紅毛」稱呼荷蘭人，《新竹縣志》記載，相傳南明隆武元年（1646年），荷蘭人曾因船隻損壞而在此地登陸，這段傳說便成為紅毛港地名的由來，距今已有三百七十餘年歷史。雍正13年（1735年），泉州閩籍移民汪淇楚等人成立「萃豐莊」墾區，開始開墾沿海一帶，並將墾務公館設於紅毛港；乾隆年間，擁有萃豐莊一半股權的粵籍陸豐縣人徐立鵬轉向內陸拓墾，成為客家人移入竹塹地區的開端，泉州同安縣的閩南籍鄭氏家族也陸續進駐紅毛港開墾。1920年，日本殖民政府依「物產豐饒」之意，將「紅毛港」改稱「新豐」，沿用至今。新豐鄉擁有長達七公里、全新竹縣最長的海岸線，以西瓜、洋香瓜與鴨蛋等農漁特產聞名。"],
    ["新竹縣","芎林鄉","九芎林","芎林舊稱九芎林，因當地早期九芎樹叢生成林而得名，後簡化為芎林。","","芎林鄉地名由來相當直接：這一帶清代原是九芎樹密布叢生的林地，先民入墾後便以「九芎林」為地名，1920年日本殖民政府推行地方改制時，簡化為今日的「芎林」。芎林與竹東、北埔一帶同屬清代客家移民拓墾竹塹丘陵地帶的一環，境內的飛鳳山因「飛鳳探梅」美景名列新竹縣八景之一，天氣晴朗時甚至可從山頂觀日亭遠眺台北101大樓，是台灣本島可望見101大樓的最遠地點之一。芎林同時也是北埔開拓史上重要的中繼站：金廣福墾號的核心人物姜秀鑾，其胞弟姜秀福便留居芎林九芎林一帶未隨兄長遷往北埔，其後代形成北埔姜家「新姜」一支的源頭，可見芎林在新竹客家拓墾史上，與北埔、竹東等地有著千絲萬縷的家族淵源。"],
    ["新竹縣","橫山鄉","橫山","橫山因境內有一座橫亙於前的「大山背山」而得名。","","橫山鄉地名由來相對單純，源自地形特徵：這一帶因有一座名為「大山背山」的山脈橫亙於聚落前方，遠望山勢橫向延展、阻擋去路，因而被稱為「橫山」，是台灣地名中依山脈走向直接命名的典型例子。橫山鄉境內最負盛名的內灣，地處油羅溪上游河灣地帶，清末以前原是泰雅族生活的丘陵領域，隨著客家移民勢力沿油羅溪向山區推進，加上日治時期日本當局發現當地蘊藏檜木與煤礦資源，帶動林業、石灰業與水泥業的興盛，1950至1970年代吸引大量勞動人口進駐，內灣戲院、內灣車站與商店街因而繁華一時；直到礦產枯竭、林業政策轉變，內灣才逐漸沒落，直到1990年代末，漫畫家劉興欽以家鄉內灣為背景創作的「大嬸婆與阿三哥」系列作品，才讓內灣老街重新以懷舊觀光小鎮的姿態聲名遠播。"],
    ["新竹縣","北埔鄉","北埔","北埔因地處姜秀鑾開墾集團「金廣福」大隘的北側荒埔而得名，「北」為方位、「埔」指未開墾荒地。","","北埔鄉與峨眉、寶山三鄉，清代原是賽夏族與道卡斯族的傳統領域，統稱「大隘」地區。道光15年（1835年），淡水廳同知李嗣鄴諭令粵籍墾首姜秀鑾與閩籍林德修、周邦正合資成立「金廣福」墾號（「金」代表官方資金，「廣」代表粵籍出資，「福」代表閩籍出資），這是台灣拓墾史上少見的閩粵合作範例。姜秀鑾率領數百武裝墾戶，由樹杞林（今竹東）突破賽夏族防線進駐這片盆地，因位置在整個大隘拓墾範圍的北側荒埔，故稱「北埔」，並以金廣福公館為指揮中心，在西、南、北三面種植莿竹為牆、興建四座城門防禦。姜秀鑾其後又陸續向南埔、峨眉、寶山等地推進開墾，到咸豐年間，這片山區大致已全數墾成。如今北埔以保存完整的老街古蹟群、東方美人茶與柿餅聞名，金廣福公館更是新竹縣境內唯一的國定古蹟。"],
    ["新竹縣","寶山鄉","草山","寶山原稱草山，因初墾時雜草叢生而得名，1920年取「草山」的山字與境內「寶斗仁」的寶字合併，改稱寶山。","","寶山鄉的命名方式相當獨特，融合了兩個舊地名的用字：這一帶清代開墾之初，因地表雜草叢生、遍布荒蕪的山丘，因而被稱為「草山」；1920年，日本殖民政府推行地方行政改制，考量境內另有一處聚落名為「寶斗仁」，便取「草山」的「山」字，加上「寶斗仁」的「寶」字，組合成兼具美感與吉祥寓意的新地名「寶山」，沿用至今，這種截取兩個舊地名各一字重新組合命名的方式，在台灣地名史上相當少見。寶山鄉與北埔、峨眉同屬「大隘」拓墾範圍的一部分，清道光年間由姜秀鑾率領的金廣福墾號逐步開墾而成。如今寶山鄉以紅糖、楊桃、橄欖、水梨、柑橘與綠竹筍等農特產聞名，境內的寶山第一水庫、第二水庫，也是新竹地區重要的休閒景點與水資源設施。"],
    ["新竹縣","峨眉鄉","月眉","峨眉原稱月眉，因峨眉溪曲流凸岸沖積出半月形的河階地形而得名，日治時期改以近音雅字「峨眉」取代。","","峨眉鄉清代原是賽夏族的生活領域，早期稱為「月眉」，這個地名直接描述了當地的地形特徵：峨眉溪流經此地時形成彎曲的曲流，凸岸處經年累月沖積出一連串半月形的河階地，形狀神似天上的眉月，因而得名。道光15年（1835年），金廣福墾號成立後，姜秀鑾在完成北埔的據點建設後，繼續向西進逼，陸續在月眉、中興、富興等地建立防禦性的小型集村，作為開墾的中繼站，與北埔、寶山共同構成「大隘」拓墾範圍。1920年，日本殖民政府推行地方行政改制，將八個小庄合併為「峨眉庄」，並以發音相近、更具文學意象的「峨眉」取代原本的「月眉」，沿用至今。峨眉鄉是全台客家人比例第三高的鄉鎮，以東方美人茶（膨風茶）聞名，相傳曾獲英國維多利亞女王讚賞而得名，境內峨眉湖（大埔水庫）的湖光山色，也是熱門的觀光景點。"],
    ["新竹縣","尖石鄉","尖石","尖石因境內那羅溪與嘉樂溪匯流處聳立一塊如尖筍般的巨石而得名，是新竹縣面積最大的行政區。","","尖石鄉的地名由來直接取自一塊真實存在的巨石：境內那羅溪與嘉樂溪匯流之處，矗立著一塊形狀尖聳如竹筍的巨大岩石，長期經受烈日曝曬與暴雨侵襲，依然堅毅挺立，這塊巨石不僅是地名的由來，更被視為象徵當地泰雅族原住民在艱困山地環境中不畏艱難、堅忍不拔精神的地標。尖石鄉是新竹縣面積最大的行政區，海拔高度自200公尺至2000公尺不等，境內高山林立，日治時期曾是五指山撫墾署管轄的番地，1910年至1913年更爆發過三次「李崠山事件」的隘勇線推進戰役，是泰雅族與日本殖民政府武裝衝突的重要歷史現場。尖石鄉境內的司馬庫斯、鎮西堡因擁有壯觀的紅檜巨木群而聞名，加上秀巒溫泉、大霸尖山等自然景觀，是新竹縣最重要的山地原住民文化與生態觀光重鎮。"],
    ["新竹縣","五峰鄉","五指山","五峰因境內五指山（五峰山）五座山峰相連、遠望形似手掌五指而得名。","","五峰鄉的地名由來源自境內一座知名地標——五指山：這座海拔1062公尺、屬雪山山脈支稜的山峰，因五個山頭相連、輪廓神似人類張開的手掌五指，因而得名「五指山」，也稱「五峰山」，清代曾入選淡水廳八景之一，日治及戰後更被評選為台灣十二勝之一，五峰鄉便是以此山為名。五峰鄉是新竹縣面積第二大、人口最少的行政區，境內同時是泰雅族與賽夏族兩個原住民族群的傳統領域，賽夏族兩年一度、在大隘部落舉行的矮靈祭（paSta'ay），是台灣原住民文化中極具代表性、也最受矚目的祭典之一。日治時期，五峰因實施理蕃政策而長期由警察機關直接管轄；戰後才改制為新竹縣五峰鄉。境內的清泉溫泉自日治時期便已知名，也是張學良將軍軟禁期間的居所之一。"],
    ["新竹縣","司馬庫斯","Smangus 紀念馬庫斯","司馬庫斯（泰雅語 Smangus）為紀念一位帶領族人開墾的祖先「馬庫斯」而得名，曾因與世隔絕而有「黑色部落」之稱。","","司馬庫斯位於新竹縣尖石鄉玉峰村深山，海拔約1500公尺，是泰雅族「Mrqwang」（馬里闊丸）支系的一個部落。根據耆老口述，泰雅族祖先原居於今南投縣仁愛鄉一帶，因人口增加、耕地不足而陸續向北遷徙，其中一支由名為「馬庫斯」（Mangus）的祖先率領族人翻山越嶺，來到雪山山脈稜線一帶的高地開墾定居；族人為了紀念這位開拓者，便以「Smangus」（意為紀念馬庫斯）為部落命名，沿用至今。由於地處深山、道路遙遠，司馬庫斯直到1979年才通電，聯外道路更晚至1995年才完全修築完成，長期與外界隔絕，因而有「黑色部落」或「上帝的部落」之稱。1991年，部落族人依據耆老口傳的線索，在山林間發現了紅檜巨木群，其中兩株更被列為全台第二、第三大神木，此後司馬庫斯逐漸從封閉的深山部落，轉型為兼具生態保育與觀光發展的知名景點，也讓司馬庫斯這個源自紀念先祖的地名，成為台灣認識泰雅族遷徙史與部落文化的重要窗口。"],
    ["新竹縣","鎮西堡","Cinsbu","泰雅族語，意清晨第一道陽光照耀處。","","鎮西堡（泰雅語：Cinsbu）位於新竹縣尖石鄉海拔約1700公尺的深山之中，地名意指「清晨第一道陽光照耀之地」，因終年日照充足、土壤肥沃，適合作物生長而得名，是全台海拔最高的原住民部落之一。相傳鎮西堡部落由泰雅族大頭目之子率眾建立於三百多年前，是秀巒村七社中最早結社的部落，也是Makanaji（基那吉）群向北遷徙擴展的重要根據地。鎮西堡隔著塔克金溪與司馬庫斯遙遙相望，兩地共同孕育出全台面積最大的紅檜原始檜木林。1986年，林務局在砍伐鄰近五峰鄉的原始林後，計畫將伐木線轉向尖石鄉秀巒一帶，鎮西堡與新光部落族人為了守護世代居住的傳統領域，聯合起來以「砍一棵樹、償一條命」的口號展開激烈抗爭，最終迫使林務局撤回伐木計畫，成功保住這片珍貴的巨木森林。如今鎮西堡巨木群步道中，以造型維妙維肖的「亞當」「夏娃」神木最負盛名，是台灣生態保育史上一頁重要的原住民護林運動見證。"],
    ["新竹縣","內灣","內灣","內灣因坐落於油羅溪彎曲河道內側形成的河灣地帶而得名，日治後期因林業、礦業興盛而繁華一時。","","內灣地名由來源自其所處的河道地形：這處聚落位於油羅溪上游、河道彎曲凹陷的內側河灣處，因而得名「內灣」。內灣清末以前原是泰雅族生活的丘陵地帶，隨著客家移民的拓墾勢力沿油羅溪逐步向山區推進，內灣才逐漸成為漢人與泰雅族接觸的前緣聚落。日治時期，日本當局沿油羅溪深入尖石山區，發現當地蘊藏豐富的檜木與煤礦資源，開啟了內灣的林業、石灰業與水泥業，1950至1970年代產業興盛時期，吸引大量伐木工與礦工湧入，帶動內灣戲院、商店街的繁榮；直到礦產枯竭、林業政策轉變，內灣才逐漸歸於平靜。1990年代末，因漫畫家劉興欽以家鄉內灣為背景創作的「大嬸婆與阿三哥」系列作品廣為人知，加上內灣線鐵路的觀光效益，內灣老街得以轉型復甦，成為新竹縣客家山城觀光的代表性景點之一。"],
    ["新竹縣","六家","六張犁","六家舊稱六張犁，因清代林先坤家族拓墾面積達三十甲（六張犁，一張犁五甲）而得名。","","六家舊稱「六張犁」，命名邏輯與台北大安區、桃園龍潭的同名地名如出一轍：清代拓墾以「張犁」為計算開墾面積的單位，一張犁約合五甲土地，這片墾地面積恰好達到三十甲，因而稱為「六張犁」，1920年日本殖民政府推行地方改制時，才改稱較為文雅的「六家」。乾隆14年（1749年），廣東饒平人林先坤與父兄渡海來台，先在台灣中部落腳，乾隆17年（1752年）遷居至此展開拓墾，憑藉優異的領導與經營能力，逐漸從佃戶轉型為擁有大片土地的地主，並團結族人力量，建立起以林姓為核心的單姓聚落，光緒8年（1882年）興建的「問禮堂」（次聖公廳）便是林家祭祖與凝聚宗族力量的重要祠堂，如今已列為國家三級古蹟。如今六家因高速鐵路新竹站與新竹縣政府所在地的設立，已從清代的客家拓墾聚落，轉型為新竹縣新興的高鐵特區與行政核心。"],
    ["新竹市","南寮","十塊寮","南寮因與頭前溪口北岸的「魚寮」相對而得名，原稱十塊寮，是新竹港口機能歷經多次遷移後的落腳處。","","南寮的地名由來相對單純，因這處聚落位於頭前溪出海口南岸，與北岸一處稱為「魚寮」的聚落隔溪相對，因而得名「南寮」；地方文獻另記載，南寮最初稱為「十塊寮」，是康熙50年前後北莊二十四聚落之一。南寮的發展與新竹港口機能的多次遷移密切相關：清代最早的竹塹港（舊港）因頭前溪泥沙淤積而航運受阻，嘉慶12年（1807年）商民集資在南寮另闢新港，卻不到兩年又遭淤塞，此後南寮逐漸萎縮為單純的漁村聚落。日治時期，南寮曾闢建海水浴場，是許多新竹人共同的青春回憶；戰後也曾安置大陳島撤退來台的居民。1980年代，因應南寮漁港持續淤積的問題，政府在南側另建新竹漁港取而代之，南寮舊港則轉型保存為觀光漁港，如今結合漁產直銷中心、17公里海岸自行車道等設施，成為新竹市最具代表性的濱海休閒去處。"],
    ["新竹市","金山面","金山面","金山面因地形似「金」字形的山面而得名，今為清華大學、交通大學及新竹科學園區一帶。","","金山面地名由來，源自其獨特的地形樣貌：這一帶丘陵地勢由高而低逐漸傾斜延伸，遠望形狀神似漢字「金」字的側面輪廓，因而被稱為「金山面」，是台灣地名中依山形字形命名的例子之一。金山面清代原屬竹塹社傳統領域外緣的丘陵地帶，因土壤貧瘠、水源不易取得，開發程度長期落後於竹塹城周邊的平原地帶，僅有零星的旱作農業。1950年代後，隨著台灣工業技術研究院、國立清華大學、國立交通大學（今陽明交通大學）相繼在此設校或設立園區，加上1980年新竹科學工業園區的成立，金山面搖身一變成為台灣高科技產業的發源地與研發重鎮，昔日單純以山形命名的丘陵荒地，如今已成為享譽國際的「台灣矽谷」核心地帶。"],

    // --- 【苗栗縣】 ---
    ["苗栗縣","苗栗市","貓裏","苗栗舊稱貓裏，源自道卡斯族「貓裏社」（Pali）音譯，意指平原，清光緒設縣時取近音雅化為苗栗。","","苗栗市舊稱「貓裏」，是平埔族道卡斯族「貓裏社」（又稱麻裡社）的音譯，Pali一詞原意為「平原」，反映後龍溪沖積而成的苗栗河谷平原地貌。乾隆初年，廣東客籍墾民依社名音譯稱此地為「貓里」「貓裡」「貓貍」或「貓裏」，各種寫法長期並存混用；乾隆末年，墾民大量拓墾後形成一街六庄，包含貓裡街、內麻庄、維祥庄、中興庄、嘉盛庄、大田庄、西山庄，故有「六庄」的俗稱。光緒15年（1889年）苗栗設縣，官方正式改用近音而雅致的「苗栗」二字，沿用至今。有趣的是，「貓裏」與「貓貍」兩種舊稱寫法孰為正統，直到21世紀仍在地方引發討論：苗栗縣政府一度公告統一採用「貓裏」，卻遭部分地方人士以縣定古蹟賴氏節孝坊沿用「貓貍」已久為由提出異議，可見這個古老地名至今仍牽動著地方認同。"],
    ["苗栗縣","頭份市","頭份","頭份因清乾隆年間客籍移民合股開墾，以抓鬮方式分配墾地，抽中第一號者稱「頭份」，因而得名。","","頭份地名完全是台灣土地拓墾制度的產物：清乾隆16年（1751年），廣東嘉應州鎮平縣人林洪、吳永忠、溫殿玉、黃日新、羅德達等約兩百人，率領宗族渡海來到頭份開墾，眾人以抓鬮方式決定各自的開墾地點，抽中第一號的區域便稱為「頭份」，其後依序為二份、三份、四份、五份，這種以合股拓墾編號命名的方式，在頭份、苗栗一帶留下了頭份、二份、三份等一系列地名。據傳林姓人數最多，分得頭份、二份及望更寮；黃姓分得三份及新屋下；溫姓分得四份、五份；吳姓分得河唇；羅姓分得中肚，這些姓氏開墾範圍的分布，至今仍大致對應頭份市和平里、民族里一帶。頭份更早之前的舊稱是「田寮庄」，源自乾隆4年（1739年）泉州人林耳順率眾入墾時所建立的臨時草寮聚落。如今頭份因鄰近新竹科學園區竹南園區，是苗栗縣人口最多、少數維持人口正成長的行政區。"],
    ["苗栗縣","竹南鎮","三角店","竹南原稱三角店，因1902年縱貫鐵路通車設站於此，1920年因地處新竹之南而改稱竹南。","","竹南鎮最早發展的核心聚落其實是「中港街」，因濱臨海岸、交通便利而繁榮一時；1902年，縱貫鐵路通車，鐵道部在距離中港街約一公里處設立車站，車站周邊因道路交叉而形成聚落，被稱為「三角店」，但車站當時仍沿用「中港」為站名。隨著鐵路運輸逐漸取代港口航運，加上中港溪港口淤積，三角店的繁榮程度逐漸超越中港街，1920年，日本殖民政府正式將「三角店」改名為「竹南」，取其地理位置在新竹之南之意，車站也隨之更名為竹南車站，並成為竹南郡的行政中心。竹南因與相鄰的頭份市區連成一片，兩地被視為「雙子城」的都市結構，戰後以塑膠、陶瓷、玻璃、成衣等勞力密集工業起家，1980年代後隨著竹南工業區、竹科竹南園區等大型工業區陸續開闢，成為苗栗縣人口密度最高、也是全台人口密度數一數二的鎮。"],
    ["苗栗縣","後龍鎮","後壟","後龍舊稱後壟，源自道卡斯族後壟社，一說因聚落後方有長條狀丘陵（壟）而得名。","","後龍舊稱「後壟」，其由來主要有三種說法：第一種認為源自道卡斯族「後壟社」的原始社名，該社原名可能是「雅斯社」（Yass）或「阿蘭社」（Auran），清代入墾的漢人將其音轉為「後壟」；第二種說法則從地形出發，指「壟」意指長條狀隆起的丘陵地，因聚落後方正好有這樣的丘陵地形，故稱「後壟之村莊」；第三種較特殊的說法認為，「後壟」原是當地原住民對漢人帶有貶意的稱呼，意近「無用之人」，後來反而被漢人挪用作為地名。康熙33年（1694年）《台灣府志》已可見「後壟社」的記載，可見這個地名至遲在17世紀末已通行。1670年，鄭氏部將劉國軒率軍墾殖蓬山八社、後壠五社（涵蓋今通霄、苑裡、後龍、竹南一帶），是漢人有計畫開拓苗栗地區的開端。如今後龍鎮因高鐵苗栗站的設立，成為苗栗縣新興的重點發展地區。"],
    ["苗栗縣","通霄鎮","吞霄","通霄舊稱吞霄，源自道卡斯族吞霄社，日治時期因虎頭山平地突起、聳入雲霄而改稱通霄。","","通霄在鄭氏王朝以前，大部分是平埔族道卡斯族「吞霄社」（Tonsuyan）的傳統領域，鄭經時代，右武衛劉國軒率軍經略此地，是漢人正式進入通霄的開始。清雍正年間，漢人漸增，將此地稱為「吞霄」，1878年設台北府後，通霄隸屬新竹縣竹南三堡；1885年台灣建省，改隸苗栗縣「吞霄堡」，堡內管轄範圍以吞霄街為中心。日治初期設通霄街，因當地地標虎頭山是一座平地突起、狀似仰首猛虎、山勢聳入雲霄的丘陵，加上「吞霄」二字字面帶有較為負面的意涵，1920年（大正9年）行政區劃改制時，便取虎頭山「聳入雲霄」之意，將地名雅化為「通霄」，沿用至今。虎頭山上至今仍保留日俄戰爭時期日軍監控台灣海峽船隻動向所設的瞭望站遺跡，以及戰後改建、卻保留日式神社參道與鳥居的通霄神社，是通霄重要的歷史地景。"],
    ["苗栗縣","苑裡鎮","彎麗","苑裡地名源自道卡斯族「苑裡社」，清代文獻曾寫作宛里、彎里、灣麗等多種音譯用字。","","苑裡鎮地名源自道卡斯族「苑裡社」（Wanrie）的社名音譯，這個平埔族部落原是清初「蓬山八社」（初稱崩山八社）之一，清代文獻中曾出現宛里、里灣里、彎里、灣麗等多種不同的音譯用字，直到日治時期才統一定為「苑裡」。除了苑裡社，苑裡鎮境內還涵蓋房裡社、貓盂社等蓬山八社成員的傳統領域，各社頭目分別管理各自轄下的聚落與土地事務，清光緒年間的官方文書中仍可見到這些頭目的姓名紀錄。苑裡因地勢平坦、水源充沛，適合種植稻米，是苗栗縣最大稻米產地，有「苗栗穀倉」的美譽；此外，苑裡與鄰近的大甲同為台灣藺草編織業的重要產地，早期大量出口草蓆、草帽等生活用品，藺草編織業沒落後，近年成立蘭草文物館重新推廣這項傳統工藝，讓苑裡從單純的平埔族社名，逐漸發展出兼具稻米與藺草雙重代表性的地方特色。"],
    ["苗栗縣","卓蘭鎮","罩蘭","卓蘭原稱塔連，是巴宰族語「Tarien」音譯，意指美麗的原野，歷經罩蘭、打難等多次寫法變化，1920年定名卓蘭。","","卓蘭地名源自巴宰族（巴則海族）「Tarien」的音譯，意思是「美麗的原野」，清雍正年間的契字上寫作「塔連」，這是目前所知最早的漢字記錄；乾隆51年繪製的《岸番把守圖》中，大安溪出山口北岸平原（今三義鯉魚潭附近）已標註「罩蘭埔」地名，當時罩蘭仍屬清廷劃定的生番界內，是泰雅族傳統領域。道光16年（1836年）刊行的《彰化縣志》改稱「罩蘭」，同治年間的《臺灣府輿圖纂要》又寫作「打難」，可見這個地名歷經多次不同的漢字音譯版本。乾隆55年（1790年）林爽文事件後，清廷實施「番屯制」，巴宰族取得罩蘭地區作為屯丁贍養埔地，漢人得以持續在此開墾，但與泰雅族的關係長期緊繃，直到光緒10年（1884年）仍爆發武裝衝突。1920年，日本殖民政府正式將地名定為「卓蘭」，沿用至今。卓蘭因耕地多為旱田，盛產葡萄、楊桃、水梨與柑橘，享有「水果王國」的美譽。"],
    ["苗栗縣","造橋鄉","造橋","造橋因清雍正年間居民為了跨越南港溪、解決頭份與造橋兩地交通問題而集資造橋得名。","","造橋地名由來相當直白：清雍正9年（1731年），頭份與造橋兩地之間的交通因南港溪河床阻隔而諸多不便，當地居民為了解決往來問題，集資合力興建一座橋梁，命名為「登雲橋」，又稱「長橋」，這座橋的興建，便成為「造橋」這個地名的由來。另有一說指出，是一位苗栗客籍拓荒者與商旅合作，共同出資建造這座跨越南港溪的橋梁，為了紀念這項工程，便以「造橋」作為當地地名，兩種說法雖細節略有出入，但核心都圍繞著這座解決交通問題的橋梁而生。造橋鄉地處苗栗縣北側丘陵地帶，因土壤與氣候條件適合種植南瓜，近年舉辦的「苗栗縣南瓜節」（原稱造橋瓜瓜節）已成為地方重要的農特產推廣活動，讓這個因造橋通行而得名的鄉鎮，也發展出獨具特色的瓜果產業。"],
    ["苗栗縣","西湖鄉","四湖","西湖舊稱四湖，因附近有頭湖、二湖至九湖等一連串河谷小盆地，四湖位居中央，為避免與雲林縣四湖鄉同名而改稱西湖。","","西湖鄉舊稱「四湖」，這個地名源自當地特殊的地形分布：西湖溪流域沿岸分布著一連串大小不一的河谷小盆地，客家人慣以「湖」稱呼這種山間盆地地形，先民依序將這些盆地由下游往上游命名為頭湖、二湖、三湖、四湖、五湖，一路排列至九湖，其中「四湖」恰好位居這片區域的中央地帶，因而成為整個鄉鎮的代表性地名。戰後台灣行政區重新命名時，因雲林縣也有一個同樣稱為「四湖」的鄉鎮，兩地容易混淆，苗栗的四湖鄉便依其地理位置改稱「西湖」，沿用至今，這也是台灣少數因與他縣地名重複、而非因語音演變或行政改制才更名的案例。西湖鄉境內丘陵地形發達，適合種植地瓜，近年舉辦的「西湖蕃薯文化節」是地方重要的農特產推廣活動。"],
    ["苗栗縣","頭屋鄉","崁頭屋","頭屋舊稱崁頭屋，因位於老田寮溪沿岸河階地形的第一個河階（崁）上而得名，後簡化為頭屋。","","頭屋鄉舊稱「崁頭屋」，這個地名結合了地形與聚落兩種概念：老田寮溪沿岸分布著多層河階地形，客家話稱這種因河流侵蝕堆積形成的階地為「崁」，而這處聚落恰好位於沿岸第一個（最下游或最前端）河階之上，因而得名「崁頭屋」，其後簡化為「頭屋」，沿用至今。頭屋鄉境內另有「天花湖」一地，地名由來眾說紛紜，有一說指過去天花或性病患者曾被送至此地隔離；另一說則稱此地過去風月場所林立，因而得名，但確切緣由已難以考證。清光緒年間，墾戶黃南球率眾進墾頭屋一帶，境內流傳的「番王」傳說，據信與當地原住民貓閣社道卡斯族人的後裔有關，反映出頭屋是漢人與平埔族群交會拓墾的重要地帶。頭屋鄉因水源充足、氣候適宜，是苗栗縣重要的蘿蔔產地，每年舉辦「頭屋蘿蔔節」推廣地方農特產。"],
    ["苗栗縣","公館鄉","隘寮下","公館原稱隘寮下，因清代設隘防禦原住民出草，並在隘寮下方興建處理隘務、墾務的公館而得名。","","公館鄉地名源自清代的隘防制度：這一帶因鄰近原住民傳統領域，早期先民為防範出草侵擾，在山區要隘設置「隘寮」派駐隘丁巡防，這處聚落因位於隘寮下方而俗稱「隘寮下」或「隘寮腳」；隨著開墾業務日益繁重，墾戶首領便在此興建一座專門處理隘務與墾務的辦事處，這種建築在客家話中稱為「公館」，久而久之便取代了原本的「隘寮下」，成為地名的正式稱呼，這與台灣其他各地因業戶興建辦事處而得名「公館」的地方，屬於相同的命名邏輯。公館鄉因四周山丘環繞、中央是後龍溪沖積而成的河谷平原，南北狹長、地勢低平，形似蛤蜊，因而也有「蛤仔市」的別稱。公館鄉境內曾是「亞洲第一口油井」出磺坑油田的所在地，加上氣候溫和、雨量充沛，適合紅棗生長，享有「紅棗的故鄉」美名，每年舉辦「公館紅棗季」推廣地方農特產。"],
    ["苗栗縣","銅鑼鄉","銅鑼灣","銅鑼原稱銅鑼灣，因聚落坐落於三面環山、一面開口的弧形山麓地形，狀似樂器銅鑼而得名。","","銅鑼鄉地名由來源自地形意象：這處聚落位於銅鑼斷層線谷中、西湖溪溪谷東岸，雙峰山向北延伸的餘脈環繞四周，地形北面銜接南勢坑分割台地，西側環繞苗栗丘陵，南面則有雙峰山塊餘脈屏障，三面山勢圍成一個圓弧狀地形，僅一面開口向外，形狀神似傳統樂器「銅鑼」，因而得名「銅鑼灣」，後簡化為「銅鑼」。銅鑼鄉境內的雙峰山，因山形俊美、氣勢雄渾，昔日文人墨客將「雙峰陵霄」列為古苗栗八景之一，是全鄉最顯著的地標。銅鑼鄉因氣候與土壤條件適合杭菊與芋頭種植，每年舉辦「銅鑼杭菊芋頭節」推廣地方農特產，秋冬時節杭菊花田盛開，也成為苗栗縣熱門的賞花景點之一，讓這個因地形似樂器而得名的山谷鄉鎮，兼具農業生產與觀光休閒的雙重機能。"],
    ["苗栗縣","三義鄉","三叉河","三義舊稱三叉河，因打木溪、水尾溪等支流在此匯集成西湖溪、形成三叉狀地形而得名，戰後取諧音改稱三義。","","三義鄉舊稱「三叉河」，這個地名直接描述了當地的水文地形：發源於雙連潭與十六份一帶的水尾溪（原名打木溪）與其他支流，在廣盛、雙湖交界的三興橋附近會合，匯流成西湖溪，因河道在此呈現三叉分歧的形狀，因而得名「三叉河」。道光22年（1842年），李藤華等人在此設街立庄，正式命名為「三叉河庄」；1842年，漢人組織「金華生」墾號，看中此地樟林茂密，於十六份等地搭寮蒸煉樟腦，逐漸發展出以山林物產交易為核心的市街聚落，並在聚落高處興建五穀宮作為信仰中心。1953年，「三叉」正式改名為「三義」，一般認為是因「義」字的簡寫字形與「叉」字相近，加上「義」字寓意更為正面吉祥，因而順勢改名。如今三義因舊山線鐵道與魚藤坪斷橋等歷史遺跡，加上木雕產業聞名全台，每年舉辦「三義國際木雕藝術節」，是苗栗縣重要的觀光與工藝重鎮。"],
    ["苗栗縣","大湖鄉","大湖","大湖原稱馬凹，因泰雅族見此地形如大湖而得名，清咸豐年間吳定新兄弟入墾後正式以「大湖」為名。","","大湖鄉在漢人入墾前，東部山區為泰雅族汶水群、大湖群的傳統領域，原住民依當地遍生山胡椒，將此地稱為「馬凹」（Ma-Ao，意即山胡椒）；大南勢一帶的泰雅族則另稱此地為「巴價拉崎」（Bagalagya），有一說是為了紀念一位頭目，另一說則指周圍溪水環繞之意。清咸豐7年（1857年），居住在銅鑼新雞隆的吳定新、吳定連兄弟翻越關刀山，見這片由後龍溪沖積而成、四周群山環繞、形似盆地大湖的地形，因而以「大湖」稱之，兄弟倆並組成「金和成」墾號武裝入墾，從事製材與製腦事業，但仍時常遭到泰雅族的抵抗與偷襲，開墾進度因而受限。1913年，抗日志士羅福星曾在此策劃武裝起義，遭日方鎮壓後演變為「大湖事件」。如今大湖鄉因氣候溫和多雨，發展出全國聞名的草莓產業，享有「草莓王國」美譽，每年舉辦「大湖草莓文化季」吸引大量遊客前來採果。"],
    ["苗栗縣","獅潭鄉","獅潭","獅潭因當地一道山稜遠望似獅子俯臥、獅頭伸入一潭飲水而得名，另一說為賽夏族語音轉而來。","","獅潭鄉地名由來流傳著一個頗富傳奇色彩的故事：在今永興村與百壽村交界處，橫亙著一道山稜，遠遠望去，山勢彷彿一頭獅子俯臥於地，而獅頭部位恰好延伸入一旁的水潭中飲水，當地居民因而將這座潭稱為「獅潭」，地名便沿用至今；據說早年每逢元宵節前後，附近居民還能聽見潭邊傳出鑼鼓喧天的聲響，增添了幾分神秘色彩，不過中豐公路開闢、切斷這道山脈之後，便再也沒有這樣的傳聞。另一種說法則認為，「獅潭」其實是賽夏族「西潭社」（Sawi'）語音轉變而來，與獅子毫無關聯。清同治年間，獅潭仍是原住民的傳統領域，直到光緒年間，墾首黃南球率領客家移民入墾，才開始有漢籍居民定居。獅潭鄉境內因氣候溫和、土質適合，近年發展出仙草種植與加工產業，每年舉辦的「獅潭仙草花節」是地方重要的觀光活動。"],
    ["苗栗縣","三灣鄉","三灣","三灣因中港溪流經此地形成連續三個大彎曲的河階地形，聚落恰好位於第三個曲流河階而得名。","","三灣鄉地名由來源自中港溪的河道地形：這條溪流流經三灣一帶時，因地勢與地質因素形成連續彎曲的曲流，先民依序將沿岸的河階聚落稱為頭灣、二灣、三灣，三灣正是這條河道上第三個彎曲處所形成的河階平地，因而得名，這種依河道彎曲次序命名地方的方式，與新北市三峽舊稱「三角湧」同樣是描述河川地形的典型範例。三灣鄉清代因鄰近北埔、南庄一帶泰雅族與賽夏族的傳統領域，是漢人拓墾山區前緣的重要據點，客家移民與原住民之間互動頻繁，既有貿易往來，也曾發生武裝衝突。三灣鄉因丘陵地形、氣候涼爽，適合種植水梨，是苗栗縣重要的水梨產地之一，每年舉辦「三灣梨觀光季」推廣地方農特產，讓這個因河道彎曲得名的山區鄉鎮，發展出獨具特色的果樹經濟。"],
    ["苗栗縣","南庄鄉","南庄","南庄因聚落位於清代最早開墾的據點「田尾公館」南方而得名。","","南庄鄉地名由來相對單純，源自其地理位置：清代這一帶最早開墾成形的據點稱為「田尾公館」，隨著拓墾範圍逐漸向南擴展，在田尾公館南方新形成的聚落，便被稱為「南庄」，以區別於北側較早開發的核心區域。南庄鄉是賽夏族的傳統領域，也是台灣少數賽夏族與客家族群密切共居、文化交融的地區，賽夏族兩年一度舉行的矮靈祭（paSta'ay），是全鄉極具代表性的原住民祭典，吸引大量遊客與研究者前來觀禮。南庄老街保留了完整的客家、閩南與日治時期建築風貌，加上鄰近的向天湖、蓬萊溪護漁區等自然景觀，已被劃入參山國家風景區範圍，是苗栗縣山城觀光的重要據點之一。"],
    ["苗栗縣","泰安鄉","大安","泰安舊稱大安，因是大安溪發源地而得名，1954年因與台中大安鄉同名，取諧音及「國泰民安」之意改名。","","泰安鄉是苗栗縣唯一的山地鄉，境內幾乎全境深入雪山山脈，早期因是大安溪的發源地，被稱為「大安」。1947年，這處山地行政區正式成立時，初期命名為「大安鄉」，然而由於名稱與台中縣（今台中市）大安鄉完全重複，容易造成行政與郵務混淆，因此於1954年申請改名；新地名一方面保留「大安」的諧音，另一方面則取「國泰民安」的吉祥寓意，正式定名為「泰安鄉」，沿用至今，是台灣少數因與他鄉鎮同名而更改名稱、且巧妙保留原音同時賦予嶄新吉祥意涵的案例。泰安鄉境內主要居民為泰雅族與客家人，由於溫泉資源豐富，素有「泰安溫泉鄉」的雅號，加上鄉內一半以上土地劃入雪霸國家公園範圍，保留了豐富的高山生態與瀕危物種，是苗栗縣重要的生態旅遊與溫泉觀光重鎮。"],
    ["苗栗縣","勝興","十六份","勝興舊稱十六份，因清代此地設有十六座蒸餾樟腦的腦灶而得名，境內勝興車站是台鐵海拔最高的車站。","","勝興地名源自清代盛極一時的樟腦產業：道光22年（1842年）漢人組織「金華生」墾號進入三叉河一帶開墾，因當地樟樹林密布，在十六份等處搭建腦寮蒸餾樟腦，依熬製樟腦所需的灶數計算，此處恰好設有十六座腦灶，因而得名「十六份」，這與苗栗地區另有「二十份」等以腦灶或墾股數量命名的地名，屬於同一套計量式命名邏輯。1908年台鐵縱貫線山線通車，在十六份設站，因海拔402.326公尺，是台鐵目前海拔最高的車站；戰後車站與周邊聚落更名為「勝興」，車站鐵道邊坡上，至今仍保留著「十六份」的舊名標示，供旅客追憶這段樟腦產業史。勝興車站因鄰近龍騰斷橋、舊山線鐵道等歷史遺跡，加上木造車站建築保存完整，已成為苗栗縣熱門的鐵道懷舊觀光景點之一。"],
    ["苗栗縣","龍騰","魚藤坪","龍騰舊稱魚藤坪，相傳因先民種植魚藤毒殺作怪的鯉魚精，後因「魚藤」不雅改稱龍騰，境內龍騰斷橋是知名地標。","","龍騰舊稱「魚藤坪」，地名由來流傳著一則生動的民間傳說：相傳先民初墾此地時，附近鯉魚潭中有一尾鯉魚精經常興風作浪、危害地方，村民為了克制鯉魚精，便在龍騰一帶的山區廣植具有毒性的魚藤，並將東側的高山改稱「關刀山」，寓意藉關刀之力斬除魚藤、毒殺鯉魚精，此後鯉魚精果然不再作怪，居民得以安居樂業。後來村民認為「魚藤」二字不夠雅致，遂改稱寓意飛龍騰躍的「龍騰」。這裡最知名的地標是1907年完工的「魚藤坪橋」（即龍騰斷橋），是縱貫線鐵路全線通車前興建的磚造、鋼鈑梁及桁架梁混合式橋梁，屬台灣鐵道工程技術的代表作之一。這座橋梁在1935年新竹台中大地震中嚴重震毀，僅存拱型橋墩挺立至今，1999年921大地震又再度震裂部分橋墩，如今已列為苗栗縣定古蹟，供後人憑弔這段鐵道與地震交織的歷史。"],
    ["苗栗縣","崎頂","崎頂","崎頂舊稱老衢崎，因位於一段長崎路（衢崎）頂端的聚落而得名。","","崎頂舊稱「老衢崎」，「衢」在漢語中意指四通八達的道路，「崎」則指崎嶇不平的坡地，「老衢崎」意指一段古老崎嶇道路的最頂端處，這處聚落因坐落於這段坡路的頂點而得名，後簡化為「崎頂」。崎頂地處竹南鎮西北側沿海地帶，是苗栗縣最北端的聚落，因縱貫鐵路行經而設有崎頂車站；車站旁保留了兩座建於日治時期的雙軌鐵路隧道，一號隧道興建較早，二號隧道建於1928年，因兩座隧道相距僅約50公尺，並列如母子相依，被稱為「崎頂子母隧道」，是台灣早期少見的雙線鐵路隧道之一，也是苗栗縣境內僅存的鐵路舊隧道，如今已規劃為崎頂隧道文化公園，隧道磚牆上仍可見戰爭時期留下的彈孔痕跡，是了解台灣鐵道史與戰爭記憶的重要景點。"],
    ["苗栗縣","白沙屯","白沙墩","白沙屯舊稱白沙墩，因海邊風沙長期堆積成沙丘（墩）而得名，是白沙屯媽祖徒步進香的起駕地。","","白沙屯舊稱「白沙墩」，這個地名直接描述了當地的海岸地貌：清乾隆年間，陳志城等移民入墾此地時，海濱一帶因長期受風力與潮汐作用，堆積出一片片白色沙丘，閩南語稱這種沙丘地形為「墩」，因而得名「白沙墩」，後簡化為「白沙屯」。白沙屯先民早期奉請一尊軟身媽祖神像供奉於爐主民宅，直到咸豐晚年，居民集資興建廟宇，於同治2年（1863年）建成「拱天宮」，正式成為地方信仰中心。事實上，白沙屯媽祖徒步前往雲林北港朝天宮進香的習俗，早在拱天宮建廟之前便已存在，距今已有兩百多年歷史，是全台媽祖進香活動中徒步距離最遠的一項，來回約三、四百公里；其最大特色是完全沒有固定路線與行程天數，全程依媽祖鑾轎的指示前進，充滿神秘色彩，2010年更獲文化部指定為國家重要無形文化資產，與大甲媽祖遶境並列台灣兩大媽祖進香盛事。"],

    // --- 【台中市】 ---
    ["台中市","中區","大墩","台中舊稱大墩，因清代此地有一座隆起的土墩（今台中公園砲台山）而得名，日治初期改稱台中，取「位居台灣中部」之意。","","台中的舊稱「大墩」，源自清雍正年間台中盆地仍是一片沼澤地，其中隆起一塊高地，先民依此凸起地形而得名，並在周邊建立「大墩庄」，乾隆年間發展成「大墩街」，即今日中區大墩里、中墩里一帶。1899年台灣總督府在這座土丘上（今台中公園內的砲台山）架設大砲以防禦抗日義軍，1903年台中公園開園時更將其納入園區，成為台灣最早設置三角測量標準點的地方之一。1896年日本殖民政府調整行政區域，因台中縣署設於此地，大墩街隨之改稱「台中街」；1920年台中設州，州治定於台中市，「台中」之名正式確立，取其「位居台灣中部」之意。有趣的是，多數人誤以為今日的「大墩路」與舊地名大墩有直接關聯，但其實最初的大墩位於台中公園西側的老街一帶，與後來另闢的大墩路實為兩地，是台中地名史上常見的一項誤解。"],
    ["台中市","東區","頂橋頭","東區舊稱頂橋頭，因位居台中盆地最低窪處、旱溪上架有橋梁而得名，日治後因區位於台中舊城之東而改稱東區。","","東區地處台中盆地最低窪之處，清代因當地旱溪上架設一座橋梁，且此地相對於下游其他橋梁位置較高，因而被稱為「頂橋頭」，透過這座橋梁，水路交通得以南抵大里、阿罩霧（今霧峰）等地，是早期台中盆地重要的水陸轉運節點。日治時期，隨著台中市街規劃向四周擴展，這一帶因地處台中舊城核心（今中區）之東側，正式定名為「東區」。台中盆地地勢低窪的東區，日治後期因汽車零件加工業與材料行林立，曾有「武市」之稱，是台中重要的黑手（黑手師傅）產業聚落；戰後隨著國立中興大學在此創校，東區逐漸從工業氣息濃厚的「武市」，轉型出兼具學術文風的城市風貌，成為台中市區東側重要的文教與住宅地帶。"],
    ["台中市","南區","半平厝","南區舊稱半平厝，因鄰近大里溪畔地勢低平的聚落而得名，日治後因位於台中舊城之南改稱南區。","","南區清代原是台中盆地南側的農業聚落地帶，舊稱「半平厝」，這個地名的確切語源已不易考證，一般認為與當地地勢平坦、聚落規模不大有關。1920年代，台中市街依日式棋盤式規劃向外擴展，這一帶因地處台中舊城核心之南，正式劃入「台中市」並定名為「南區」。南區境內設有台中州立台中農業試驗場等日治時期農業研究機構，加上鄰近台中車站與縱貫鐵路，逐漸發展成兼具農業試驗與鐵道運輸機能的市郊地帶。戰後，國立中興大學、台中榮民總醫院等重要機構陸續在南區周邊設立，加上台灣大道與復興路等主要幹道貫穿，南區逐漸從清代單純的農業聚落，轉型為台中市區南側重要的文教醫療與住宅生活圈。"],
    ["台中市","西區","麻園頭","西區舊稱麻園頭，因清代此地遍植黃麻、作為紡織原料而得名，日治後因位於台中舊城之西改稱西區。","","西區地名源自清代的經濟作物種植：這一帶因土壤與氣候適合黃麻生長，先民大量栽植黃麻作為紡織繩索的原料，因而得名「麻園頭」，是台灣地名中依經濟作物直接命名的常見案例之一，與台北「麻園頭」等地同樣反映清代台灣麻類作物種植的普遍性。1920年代，因地處台中舊城核心之西側，「麻園頭」正式改制為「西區」。日治時期，台中州廳、台中刑務所等重要官署機構陸續在西區周邊設立，加上台中公園、綠川、柳川等綠帶水岸貫穿其間，西區逐漸發展成台中市重要的行政與商業核心地帶。如今西區因鄰近國立自然科學博物館、審計新村與草悟道等文創景點，已從清代單純的黃麻產地，轉型為台中市極具人文氣息的生活商圈。"],
    ["台中市","北區","賴厝廍","北區舊稱賴厝廍，因清代賴姓家族在此經營製糖廍（糖廠）而得名，日治後因位於台中舊城之北改稱北區。","","北區地名由來與清代的糖業經濟密切相關：這一帶清代由賴姓家族族人聚居開墾，並在此設立「廍」——即傳統以牛力或水力帶動石車榨甘蔗汁、熬煮成糖的加工設施，因賴姓為當地主要姓氏，這座糖廍便被稱為「賴厝廍」，是台灣早期糖業聚落常見的姓氏加產業設施命名模式，類似地名在台灣中南部糖業興盛地區相當普遍。1920年代，因地處台中舊城核心之北側，「賴厝廍」正式改制為「北區」。北區境內因國立台中科技大學、國立中興大學（部分校地）等高等教育機構林立，加上一中商圈的興起，已從清代的糖業加工聚落，發展成台中市重要的文教與青年商圈，一中街更是全台知名的學生商圈之一，與其糖業起源形成饒富趣味的今昔對比。"],
    ["台中市","北屯區","三十張犁","北屯舊稱三十張犁，因清代開墾面積達一百五十甲（三十張犁）而得名，日治後因位於西大墩之北改稱北屯。","","北屯地名源自清代拓墾面積的計算方式：台灣早期漢人拓墾以「張犁」作為計算開墾規模的單位，一張犁約可耕作五甲土地，這片墾地面積恰好達到一百五十甲，換算下來正好是三十張犁，因而得名「三十張犁」，與台北大安、桃園龍潭、新竹六家等地的「張犁」系列地名，屬於同一套計量式命名邏輯。清代因此地開闢了聯繫台中盆地與大坑山區的官道（約今自由路、雙十路、北屯路一帶），三十張犁逐漸發展成往來要衝。1920年代，因地處西屯（西大墩）之北方，「三十張犁」正式改制為「北屯」，這也呼應了與其相對的西屯、南屯，共同構成因大墩（今中區）東西南北方位而命名的行政區劃系統。北屯區因面積廣闊、人口眾多，如今是台中市人口最多的行政區。"],
    ["台中市","西屯區","西大墩","西屯舊稱西大墩，因位於大墩（今中區）之西側而得名，早期為廖姓宗親聚落，日治後簡化為西屯。","","西屯地名由來相對單純：這一帶因位於清代台中盆地核心聚落「大墩街」（今中區）的西方，加上當地也有一座類似大墩的小土丘（俗稱墩仔頂），故稱「西大墩」，與東側的大墩街合稱「東大墩、西大墩」；西大墩地當犁頭店（今南屯區）與壩雅（今大雅區）之間的交通要衝，清道光年間發展成街肆。西大墩早期是廖姓宗親的主要聚居地，至今西屯一帶仍有許多廖姓家族世居於此。1920年，日本殖民政府推行地方行政改制，將「西大墩」簡化為「西屯」，隸屬台中州大屯郡，這也是「大屯」（今北屯、西屯、南屯共同的郡名淵源）一詞的由來。如今西屯區因台灣大道、台中國家歌劇院與逢甲商圈的發展，已從清代廖姓宗親聚落，轉型為台中市最重要的新興都會核心區之一。"],
    ["台中市","南屯區","犁頭店","南屯舊稱犁頭店，因清代此地聚集打造犁頭、鋤頭等農具的鐵匠店鋪而得名，日治後因位於大墩之南改稱南屯。","","南屯是台中盆地開發最早的漢人聚落之一，地名由來直接反映了清初的產業型態：拓荒時期，這一帶聚集了許多專門打造犁、鋤等墾耕用具的鐵匠店鋪，因而得名「犁頭店」，是台灣地名中依手工業聚落直接命名的典型案例，與台南、彰化等地同名的犁頭店聚落，都反映了清初農具鍛造業對聚落發展的重要性。犁頭店因地處貓霧捒社（平埔族拍瀑拉族分支）傳統領域，加上鄰近旱溪、筏子溪，是漢人與平埔族群交會拓墾的重要據點。1920年，日本殖民政府推行地方行政改制，因地處大墩（今中區）之南方，「犁頭店」正式改稱「南屯」。如今南屯區因鄰近台中高鐵站與台中市政府所在的七期重劃區，已從清代打造農具的鐵匠聚落，蛻變為台中市最具代表性的新市政中心與豪宅聚落。"],
    ["台中市","太平區","鳥榕頭","太平舊稱鳥榕頭，因霧峰林家先人故居前有兩棵大榕樹而得名，另有一說源自清代漢人與洪雅族衝突後祈求太平之意。","","太平地名的由來流傳著多種說法。「鳥榕頭」一說源自清乾隆末年，霧峰林家第四房林石之四子林棣，在開渠闢田成功後，成為當地最大墾首，其故居前種有兩棵大榕樹（台語「鳥榕」即榕樹之意），因而得名；另一說則因入山口福德祠附近有一棵大榕樹而得名。此外，《彰化縣志》等古文書中，也多以「鳥銃頭」稱呼此地，「鳥銃」是清代常見的火器，因當地鄰近內山、原為土牛界外，居民為防禦原住民威脅而擁槍自保，加上林棣之孫林瑞麟平日雙槍不離腰，居民尊稱其「鳥銃頭」，這也是另一種地名由來的說法。至於「太平」這個吉祥地名，一說是清乾隆年間漢人與洪雅族衝突頻繁、傷亡慘重，村莊建立之初便寄託「太平」的願望而命名；另一說則指日治初期日軍推進至此，因當地居民溫和未加抵抗，日軍指揮官讚嘆「此地真是太平」，因而定名。如今太平區因枇杷、龍眼等丘陵農作聞名，是台中市面積第二大的行政區。"],
    ["台中市","大里區","大里杙","大里舊稱大里杙，源自平埔族洪雅族社名譯音，「杙」則指早期船隻停靠時用來繫船固定的木樁。","","大里舊稱「大里杙」，這個地名結合了平埔族社名與河運聚落的雙重意涵：「大里」一詞普遍認為源自洪雅族社名的音譯，反映當地原是平埔族傳統領域；「杙」則是閩南語中指稱木樁的用字，早期大里地處大肚溪支流大里溪（大里杙溪）沿岸，往來船隻停靠時，須以木樁「杙」將船身固定於岸邊，因而在社名之後加上「杙」字，合稱「大里杙」，形容這是一處設有繫船木樁的河港聚落。清代大里杙因水運便利，一度是台中盆地重要的物產集散地，霧峰林家的崛起也與大里杙的拓墾開發密切相關。1920年，日本殖民政府推行地方行政改制，將「大里杙」簡化為「大里」，沿用至今。如今大里區因鄰近台中市區、交通便利，是台中市人口成長最快速的行政區之一。"],
    ["台中市","霧峰區","阿罩霧","霧峰舊稱阿罩霧，一說因聚落地處鳳山山麓、晨間常有濃霧籠罩而得名，一說源自平埔族社名音譯，因霧峰林家而聞名全台。","","霧峰地名由來流傳著兩種說法：第一種說法認為，這一帶聚落建於鳳山山麓，因地形因素每逢清晨常有濃霧瀰漫籠罩，因而得名「阿罩霧」；第二種說法則指出，「阿罩霧」實際上是當地平埔族貓霧捒社群「阿罩霧社」的社名音譯，台灣地名中凡冠以「阿」字者，多屬原住民社名的音譯，例如阿束、阿冷等地皆是如此，漢人初入墾時原稱此地為「貓羅新莊」，其後才改稱「阿罩霧」。無論何種由來，霧峰因清代「霧峰林家」的崛起而聲名遠播：林家先祖林石自福建渡海來台，其後代林文察、林朝棟等人因協助清廷平定戴潮春事件、中法戰爭有功，官位顯赫，成為清代台灣少數官居高位的本土家族，林家花園（今霧峰林家宮保第園區）至今仍是全台規模最大的清代官宅建築群。1920年，「阿罩霧」正式改稱「霧峰」，沿用至今。"],
    ["台中市","烏日區","湖日","烏日舊稱湖日，一說源自平埔族語音轉，一說因境內多條溪流匯入大肚溪、地勢呈現凹陷（烏日）之勢而得名。","","烏日地名由來眾說紛紜，早期文獻曾出現「凹入」「湖日」「烏日」等多種寫法。第一種說法認為，這一帶是拍瀑拉族傳統領域，「烏日」可能源自平埔族語的音譯轉寫；第二種說法則從地形出發，指出貓羅溪、烏溪、草湖溪、旱溪等多條河川皆在此匯入大肚溪，因而地勢呈現明顯的凹陷之勢，閩南語稱這種低窪地形為「凹入」，清代文獻便以諧音字「湖日」「烏日」記載，反映了先民依地形特徵命名地方的普遍作法。烏日因地處大肚溪、烏溪、貓羅溪等多條河川交會之處，是清代台中盆地重要的水運轉運據點；如今更因高鐵台中站、台鐵烏日站雙鐵共構於此，成為中台灣最重要的軌道運輸樞紐，這個曾經因河川匯集而地勢凹陷得名的地方，如今反而因交通匯集而成為中台灣的門戶。"],
    ["台中市","豐原區","葫蘆墩","豐原舊稱葫蘆墩，源自巴宰族語音譯，一說因境內屯腳、屯頭、屯身三座小丘形似葫蘆而得名，日治時期取「豐葦原之瑞穗國」典故改稱豐原。","","豐原舊稱「葫蘆墩」，這個地名的由來主要有兩種說法：一說源自平埔族巴宰族「葫蘆墩社」社名的音譯，該社原是境內岸裡社群的重要聚落之一；另一說則從地形出發，指境內有屯腳、屯頭、屯身三座相連的小土丘，因整體形狀神似葫蘆，因而得名。清末，因當地土壤肥沃、物產豐饒，台灣巡撫劉銘傳曾將此地稱為「富春鄉」，並有「小蘇州」的美譽。1920年，日本殖民政府推行地方行政改制，取自日本天皇詔書中「豐葦原之瑞穗國」的典故字句，將「葫蘆墩」正式改稱「豐原」，這也是台灣少數直接引用日本皇室詔書典故命名的地名案例。豐原境內豐原區公所所在地一帶因盛產優質稻米「葫蘆墩米」而聞名，如今則以廟東夜市、豐原漆藝與伴手禮糕餅業聞名，是台中市山城與海線交會的重要商業與交通樞紐。"],
    ["台中市","后里區","內埔","后里舊稱內埔，因聚落建於平埔族巴宰族麻薯社（岸裡社群）之後方而得名，1955年因與屏東縣內埔鄉同名而改稱后里。","","后里舊稱「內埔」，這個地名由來相對單純：這一帶清代聚落最初創建於平埔族巴宰族「麻薯社」（岸裡社群的一支）居住地的後方，因而得名「內埔」，其聚落核心早期又稱「屯子腳」，並分為屯頂、屯下兩部分。1955年，因台灣行政區劃中屏東縣同樣設有一個「內埔鄉」，兩地容易造成郵務與行政上的混淆，台中的內埔鄉便依「後」與「后」同音同義的關係，正式改稱「后里鄉」，這與苗栗西湖鄉因與雲林四湖鄉同名而改名的案例，屬於同一類因行政區重名而更改地名的特殊情形。后里因大甲溪沖積而成的河階台地，土壤肥沃、氣候適宜，是台灣重要的花卉（尤其是百合花）與馬場產業重鎮，每年舉辦的台灣國際花卉博覽會（2018年）便選定后里作為主要展區之一，讓這個因地處平埔族聚落後方而得名的地方，發展出獨具特色的花卉觀光產業。"],
